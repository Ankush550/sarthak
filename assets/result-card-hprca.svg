<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg)" rx="16"/>

  <!-- Decorative circles -->
  <circle cx="720" cy="60" r="120" fill="rgba(255,255,255,0.05)"/>
  <circle cx="80" cy="360" r="100" fill="rgba(255,255,255,0.04)"/>
  <circle cx="400" cy="210" r="300" fill="rgba(255,255,255,0.02)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="4" rx="0" fill="#ffd600"/>

  <!-- Logo area -->
  <rect x="30" y="24" width="46" height="46" rx="10" fill="rgba(255,255,255,0.15)"/>
  <text x="53" y="53" font-size="20" text-anchor="middle" fill="#fff">📋</text>

  <!-- Site name -->
  <text x="88" y="44" font-size="14" font-weight="700" fill="#fff" opacity="0.9">SarthakYojana.in</text>
  <text x="88" y="62" font-size="11" fill="rgba(255,255,255,0.6)">Sarkari Naukri | Results | Admit Cards</text>

  <!-- RESULT OUT badge -->
  <rect x="630" y="22" width="140" height="32" rx="16" fill="#00c853"/>
  <text x="700" y="43" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">✅ RESULT OUT</text>

  <!-- Main Title -->
  <text x="400" y="120" font-size="28" font-weight="900" text-anchor="middle" fill="#fff" filter="url(#shadow)">HPRCA TGT (Non Medical)</text>
  <text x="400" y="158" font-size="22" font-weight="700" text-anchor="middle" fill="#ffd600">Result 2026 Declared!</text>

  <!-- Subtitle -->
  <text x="400" y="190" font-size="13" text-anchor="middle" fill="rgba(255,255,255,0.75)">Himachal Pradesh Rajya Chayan Aayog | hprca.hp.gov.in</text>

  <!-- Info Cards Row -->
  <!-- Card 1 -->
  <rect x="30" y="215" width="220" height="90" rx="12" fill="url(#card)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="140" y="248" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-weight="600" letter-spacing="0.5">RESULT DATE</text>
  <text x="140" y="274" font-size="18" text-anchor="middle" fill="#fff" font-weight="800">20 April 2026</text>
  <text x="140" y="294" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.55)">Official Declaration</text>

  <!-- Card 2 -->
  <rect x="290" y="215" width="220" height="90" rx="12" fill="url(#card)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="400" y="248" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-weight="600" letter-spacing="0.5">NEXT STAGE</text>
  <text x="400" y="270" font-size="16" text-anchor="middle" fill="#ffd600" font-weight="800">Document Verification</text>
  <text x="400" y="291" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.55)">+ Interview (dates awaited)</text>

  <!-- Card 3 -->
  <rect x="550" y="215" width="220" height="90" rx="12" fill="url(#card)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="660" y="248" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-weight="600" letter-spacing="0.5">HOW TO CHECK</text>
  <text x="660" y="270" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">hprca.hp.gov.in</text>
  <text x="660" y="291" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.55)">Result → TGT Non Medical</text>

  <!-- Steps section -->
  <text x="400" y="338" font-size="13" text-anchor="middle" fill="rgba(255,255,255,0.7)">📥 Download Result PDF → Search Roll Number → Save Scorecard</text>

  <!-- Bottom divider -->
  <line x1="30" y1="358" x2="770" y2="358" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Bottom info -->
  <text x="30" y="384" font-size="12" fill="rgba(255,255,255,0.5)">Post: TGT (Non Medical) | Recruiting Body: HPRCA, Himachal Pradesh</text>
  <text x="770" y="384" font-size="12" text-anchor="end" fill="rgba(255,255,255,0.5)">Updated: April 22, 2026</text>

  <!-- Bottom URL -->
  <text x="400" y="408" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.4)">For complete details visit: sarthakyojana.in</text>
</svg>
