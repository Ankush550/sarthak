name: Auto Telegram Post

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'data/jobs.json'

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Send Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python3 << 'PYEOF'
import json, urllib.request, urllib.parse, subprocess, sys, os

BOT = os.environ.get('BOT_TOKEN','')
CID = os.environ.get('CHANNEL_ID','')

print(f"BOT: {BOT[:10]}... CID: {CID}")

with open('data/jobs.json', encoding='utf-8') as f:
    now = json.load(f)

res = subprocess.run(['git','show','HEAD~1:data/jobs.json'], capture_output=True, text=True)
old_ids = set()
if res.returncode == 0:
    old_ids = {a['id'] for a in json.loads(res.stdout)}

new = [a for a in now if a['id'] not in old_ids]
print(f"New: {len(new)}")

for a in new:
    h = a.get('highlights',{})
    msg = "🔔 Nayi Khabar — SarthakYojana.in\n\n"
    msg += "💼 " + a.get('title','') + "\n\n"
    msg += "📊 Vacancy: " + h.get('vacancy','-') + "\n"
    msg += "📅 Last Date: " + h.get('applyDate','-') + "\n\n"
    msg += "👉 " + "https://sarthakyojana.in/pages/job-detail.html?id=" + a.get('id','') + "\n\n"
    msg += "🌐 sarthakyojana.in"

    data = urllib.parse.urlencode({
        'chat_id': CID,
        'text': msg
    }).encode()

    req = urllib.request.Request(
        f'https://api.telegram.org/bot{BOT}/sendMessage',
        data=data
    )
    try:
        resp = urllib.request.urlopen(req)
        print("Sent:", a.get('title','')[:50])
    except Exception as e:
        print("Error:", str(e))
PYEOF
