  <style>
    body { background:#f4f6fb; font-family:Poppins,sans-serif; }
    .finder-wrap { max-width:600px; margin:0 auto; padding:20px 14px; }

    /* Chat Container */
    .chat-box { background:white; border-radius:16px; border:1px solid #e2e8f0; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.08); }

    /* Chat Header */
    .chat-header { background:linear-gradient(135deg,#1a56db,#7c3aed); padding:18px 20px; display:flex; align-items:center; gap:12px; }
    .bot-avatar { width:44px; height:44px; background:rgba(255,255,255,0.2); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
    .bot-info { color:white; }
    .bot-name { font-size:15px; font-weight:700; }
    .bot-status { font-size:11px; opacity:0.8; display:flex; align-items:center; gap:4px; }
    .status-dot { width:7px; height:7px; background:#4ade80; border-radius:50%; animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* Messages */
    .chat-messages { padding:16px; min-height:300px; max-height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }

    .msg { display:flex; gap:8px; align-items:flex-end; }
    .msg.bot { flex-direction:row; }
    .msg.user { flex-direction:row-reverse; }

    .msg-avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
    .msg.bot .msg-avatar { background:#ede9ff; }
    .msg.user .msg-avatar { background:#dbeafe; }

    .msg-bubble { max-width:80%; padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.6; }
    .msg.bot .msg-bubble { background:#f8fafc; border:1px solid #e2e8f0; border-bottom-left-radius:4px; color:#1e293b; }
    .msg.user .msg-bubble { background:#1a56db; color:white; border-bottom-right-radius:4px; }

    /* Typing indicator */
    .typing { display:flex; gap:4px; align-items:center; padding:10px 14px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:14px; border-bottom-left-radius:4px; width:fit-content; }
    .typing span { width:7px; height:7px; background:#94a3b8; border-radius:50%; animation:bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay:0.2s; }
    .typing span:nth-child(3) { animation-delay:0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    /* Options */
    .options-wrap { padding:12px 16px; border-top:1px solid #f1f5f9; display:flex; flex-wrap:wrap; gap:8px; }
    .opt-btn { background:#f1f5f9; border:1.5px solid #e2e8f0; color:#374151; padding:8px 14px; border-radius:50px; font-size:12px; font-weight:500; cursor:pointer; font-family:Poppins,sans-serif; transition:all 0.2s; }
    .opt-btn:hover { background:#ede9ff; border-color:#7c3aed; color:#7c3aed; }
    .opt-btn.selected { background:#7c3aed; color:white; border-color:#7c3aed; }

    /* Results */
    .result-card { background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:14px; margin-top:8px; }
    .result-card a { text-decoration:none; }
    .result-title { font-size:13px; font-weight:700; color:#1e293b; margin-bottom:6px; }
    .result-badges { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
    .result-badge { font-size:10px; padding:3px 8px; border-radius:4px; font-weight:500; }
    .rb-blue { background:#eff6ff; color:#1d4ed8; }
    .rb-green { background:#f0fdf4; color:#15803d; }
    .rb-yellow { background:#fefce8; color:#854d0e; }
    .result-link { display:inline-block; background:#1a56db; color:white; font-size:11px; font-weight:600; padding:6px 14px; border-radius:6px; margin-top:4px; text-decoration:none; }
    .result-link:hover { background:#1e40af; }

    .restart-btn { background:#f1f5f9; border:1px solid #e2e8f0; color:#374151; padding:10px 20px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; font-family:Poppins,sans-serif; margin:12px 16px; display:none; }
    .restart-btn:hover { background:#e2e8f0; }
  </style>

  <script src="../assets/js/main.js"></script>
  <script>
    function toggleMenu(){ document.getElementById('mainNav').classList.toggle('open'); }

    var allJobs = [];
    var userProfile = {};
    var step = 0;

    // Load jobs
    fetch('../data/jobs.json')
      .then(function(r){ return r.json(); })
      .then(function(data){
        allJobs = data;
        startChat();
      });

    var steps = [
      {
        key: 'qualification',
        question: 'Namaste! 🙏 Main SarthakBot hoon.\n\nAapki qualification kya hai?',
        options: ['8th Pass','10th Pass','12th Pass','Graduation','B.Tech/B.E.','M.Tech/PG','CA/CMA','B.Ed/Teacher']
      },
      {
        key: 'age',
        question: 'Aapki age kitni hai?',
        options: ['14-18 Saal','18-22 Saal','22-27 Saal','27-35 Saal','35-45 Saal']
      },
      {
        key: 'state',
        question: 'Aap kahan se hain?',
        options: ['Rajasthan','Uttar Pradesh','Madhya Pradesh','Bihar','Himachal Pradesh','All India']
      },
      {
        key: 'category',
        question: 'Aapki category kya hai?',
        options: ['General','OBC','SC','ST','EWS']
      },
      {
        key: 'interest',
        question: 'Aapko kis field mein job chahiye?',
        options: ['Police/Defence','Teaching','Engineering/Tech','Banking/Finance','Medical/Health','Any Govt Job']
      }
    ];

    function startChat(){
      step = 0;
      userProfile = {};
      document.getElementById('chatMessages').innerHTML = '';
      document.getElementById('restartBtn').style.display = 'none';
      botMsg(steps[0].question, function(){
        showOptions(steps[0].options);
      });
    }

    function restartChat(){ startChat(); }

    function botMsg(text, callback){
      var messages = document.getElementById('chatMessages');

      // Typing indicator
      var typing = document.createElement('div');
      typing.className = 'msg bot';
      typing.id = 'typing';
      typing.innerHTML = '<div class="msg-avatar">🤖</div><div class="typing"><span></span><span></span><span></span></div>';
      messages.appendChild(typing);
      messages.scrollTop = messages.scrollHeight;

      setTimeout(function(){
        typing.remove();
        var msg = document.createElement('div');
        msg.className = 'msg bot';
        var formattedText = text.replace(/\n/g, '<br>');
        msg.innerHTML = '<div class="msg-avatar">🤖</div><div class="msg-bubble">' + formattedText + '</div>';
        messages.appendChild(msg);
        messages.scrollTop = messages.scrollHeight;
        if(callback) callback();
      }, 800);
    }

    function userMsg(text){
      var messages = document.getElementById('chatMessages');
      var msg = document.createElement('div');
      msg.className = 'msg user';
      msg.innerHTML = '<div class="msg-bubble">' + text + '</div><div class="msg-avatar">😊</div>';
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }

    function showOptions(options){
      var wrap = document.getElementById('optionsWrap');
      wrap.innerHTML = '';
      options.forEach(function(opt){
        var btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt;
        btn.onclick = function(){ selectOption(opt); };
        wrap.appendChild(btn);
      });
    }

    function selectOption(value){
      document.getElementById('optionsWrap').innerHTML = '';
      userMsg(value);
      userProfile[steps[step].key] = value;
      step++;

      if(step < steps.length){
        botMsg(steps[step].question, function(){
          showOptions(steps[step].options);
        });
      } else {
        // Find matching jobs
        botMsg('Aapki details mil gayi! 🎉 Ab main aapke liye best jobs dhundh raha hoon...', function(){
          findJobs();
        });
      }
    }

    function findJobs(){
      var qual = userProfile.qualification || '';
      var age = userProfile.age || '';
      var state = userProfile.state || '';
      var interest = userProfile.interest || '';

      var scored = [];

      allJobs.forEach(function(job){
        var score = 0;
        var title = (job.title || '').toLowerCase();
        var desc = (job.description || '').toLowerCase();
        var dept = ((job.highlights || {}).department || '').toLowerCase();
        var eligText = JSON.stringify(job.eligibility || '').toLowerCase();
        var ageLimit = ((job.highlights || {}).ageLimit || '').toLowerCase();
        var domicile = ((job.highlights || {}).domicile || '').toLowerCase();

        // Qualification match
        if(qual === '10th Pass' && (title.includes('10th') || eligText.includes('10th') || desc.includes('10th'))) score += 3;
        if(qual === '12th Pass' && (title.includes('12th') || eligText.includes('12th') || desc.includes('12th'))) score += 3;
        if(qual === 'Graduation' && (eligText.includes('graduation') || eligText.includes('graduate') || desc.includes('graduation'))) score += 3;
        if(qual === 'B.Tech/B.E.' && (eligText.includes('b.tech') || eligText.includes('b.e.') || desc.includes('engineering'))) score += 3;
        if(qual === 'B.Ed/Teacher' && (title.includes('teacher') || eligText.includes('b.ed') || desc.includes('teacher'))) score += 3;
        if(qual === 'CA/CMA' && (eligText.includes('ca') || eligText.includes('cma') || desc.includes('finance'))) score += 3;
        if(qual === '8th Pass' && eligText.includes('8th')) score += 3;

        // State match
        if(state === 'All India') score += 1;
        if(state === 'Rajasthan' && (domicile.includes('rajasthan') || title.includes('rajasthan') || desc.includes('rajasthan'))) score += 2;
        if(state === 'Uttar Pradesh' && (domicile.includes('uttar') || title.includes('up ') || title.includes('upsssc') || desc.includes('uttar pradesh'))) score += 2;
        if(state === 'Madhya Pradesh' && (domicile.includes('madhya') || title.includes('mp ') || title.includes('mpesb') || desc.includes('madhya pradesh'))) score += 2;
        if(state === 'Bihar' && (domicile.includes('bihar') || title.includes('bihar') || desc.includes('bihar'))) score += 2;
        if(state === 'Himachal Pradesh' && (domicile.includes('himachal') || title.includes('hprca') || desc.includes('himachal'))) score += 2;
        if(domicile.includes('all india')) score += 1;

        // Interest match
        if(interest === 'Police/Defence' && (title.includes('police') || title.includes('constable') || title.includes('ssb') || title.includes('army'))) score += 3;
        if(interest === 'Teaching' && (title.includes('teacher') || title.includes('tutor') || title.includes('reet') || title.includes('tet'))) score += 3;
        if(interest === 'Engineering/Tech' && (title.includes('engineer') || title.includes('technical') || title.includes('iti') || title.includes('mes'))) score += 3;
        if(interest === 'Banking/Finance' && (title.includes('bank') || title.includes('finance') || title.includes('accountant'))) score += 3;
        if(interest === 'Medical/Health' && (title.includes('medical') || title.includes('nurse') || title.includes('health') || title.includes('nib'))) score += 3;

        // Category bonus
        if(userProfile.category === 'SC' || userProfile.category === 'ST') score += 0.5;

        if(score > 0) scored.push({job: job, score: score});
      });

      // Sort by score
      scored.sort(function(a,b){ return b.score - a.score; });
      var results = scored.slice(0, 5);

      if(results.length === 0){
        botMsg('Abhi aapki exact profile ke liye limited jobs hain. Yahan saari latest jobs dekhein! 👇', function(){
          showAllJobsBtn();
        });
        return;
      }

      var html = '<strong>🎯 Aapke liye ' + results.length + ' best jobs mili hain!</strong><br><br>';
      results.forEach(function(r, i){
        var job = r.job;
        var h = job.highlights || {};
        html += '<div class="result-card">' +
          '<div class="result-title">' + (i+1) + '. ' + job.title + '</div>' +
          '<div class="result-badges">' +
            '<span class="result-badge rb-blue">📊 ' + (h.vacancy || '-') + '</span>' +
            '<span class="result-badge rb-green">📅 ' + (h.applyDate || '-') + '</span>' +
            '<span class="result-badge rb-yellow">📍 ' + (h.domicile || 'All India') + '</span>' +
          '</div>' +
          '<a href="job-detail.html?id=' + job.id + '" class="result-link">Poori Jaankari Dekhen →</a>' +
        '</div>';
      });

      var messages = document.getElementById('chatMessages');
      var msg = document.createElement('div');
      msg.className = 'msg bot';
      msg.innerHTML = '<div class="msg-avatar">🤖</div><div class="msg-bubble" style="max-width:90%">' + html + '</div>';
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;

      // Show restart
      setTimeout(function(){
        botMsg('Kya aur dhundhna hai? Nayi khoj shuru karein! 😊', function(){
          document.getElementById('restartBtn').style.display = 'block';
        });
      }, 500);
    }

    function showAllJobsBtn(){
      var wrap = document.getElementById('optionsWrap');
      wrap.innerHTML = '<a href="jobs.html" style="background:#1a56db;color:white;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;">Saari Jobs Dekhen →</a>';
      document.getElementById('restartBtn').style.display = 'block';
    }

    // Auto date
    (function(){
      var days=['रविवार','सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
      var months=['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
      var d=new Date();
      document.querySelectorAll('.auto-date').forEach(function(el){
        el.textContent='📅 '+days[d.getDay()]+', '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
      });
    })();
  </script>
