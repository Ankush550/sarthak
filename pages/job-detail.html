}

.jd-meta tr:last-child {

/* ============================================================

<script>
renderHeader('Latest Job');
renderTicker();
renderFooter();
renderCookieConsent();

const id = new URLSearchParams(window.location.search).get('id') || '';
if (!id) { window.location.replace('jobs.html'); }

// ✅ FIX: Use encodeURIComponent for proper canonical URL encoding
document.getElementById('canonicalTag').href = 'https://sarthakyojana.in/pages/job-detail.html?id=' + encodeURIComponent(id);

const _jobs   = typeof JOBS_DATA        !== 'undefined' ? JOBS_DATA        : [];
const _pvt    = typeof PRIVATE_JOBS_DATA !== 'undefined' ? PRIVATE_JOBS_DATA : [];
const _res    = typeof RESULTS_DATA      !== 'undefined' ? RESULTS_DATA      : [];
const _admit  = typeof ADMIT_CARDS_DATA  !== 'undefined' ? ADMIT_CARDS_DATA  : [];
const _ans    = typeof ANSWER_KEYS_DATA  !== 'undefined' ? ANSWER_KEYS_DATA  : [];
const all = [..._jobs, ..._pvt, ..._res, ..._admit, ..._ans];
const job = all.find(j => j.id === id);

// Always recompute a clean, normalized status via the shared
// resolveJobStatus() — the raw data uses inconsistent text like
// "Online Form", "Active", "Open" (capital O), "Short Notice" which
// never exactly matched the badge logic's lowercase comparison below,
// so those jobs always incorrectly fell through to the "Closed" badge.
if (job) {
  job.status = resolveJobStatus(job);
}

if (!job) {
  document.getElementById('quickCard').innerHTML = '<div class="content-article"><h1 style="font-size:20px;color:#1a237e;">Job Not Found</h1><p style="text-align:center;color:#c0392b;padding:20px;">Sorry, we could not find this job listing. It may have been moved or the link is incorrect. <a href="jobs.html">Browse All Jobs</a></p></div>';
  var adWrap = document.getElementById('adBannerWrap');
  if (adWrap) adWrap.style.display = 'none';
  // ✅ CORRECT: Only mark truly invalid pages as noindex
  // (Default in <head> is now "index, follow" since almost all requests have a valid ?id=)
  let notFoundRobotsTag = document.querySelector('meta[name="robots"]');
  if (!notFoundRobotsTag) {
    notFoundRobotsTag = document.createElement('meta');
    notFoundRobotsTag.name = 'robots';
    document.head.appendChild(notFoundRobotsTag);
  }
  notFoundRobotsTag.content = 'noindex, follow';
  document.getElementById('canonicalTag').href = 'https://sarthakyojana.in/pages/jobs.html';
} else {
  // Dynamic Job Banner Image
  const banner = document.getElementById("jobBannerImage");
  if (banner && job.image) {
    banner.src = "/assets/images/" + job.image;
    banner.alt = job.title;
  }
  
  // Page title & meta
  document.getElementById('bc').innerHTML = `<a href="../index.html">Home</a> &rsaquo; <a href="jobs.html">Govt Jobs</a> &rsaquo; ${job.title}`;

  // Valid job confirmed — page is already index,follow by default (see <head>).

  // ── ENTERPRISE SEO — JobPosting schema + breadcrumbs + OG/Twitter ──
  applySEO({
    title:       job.title + ' – ' + job.organization + ' Recruitment 2026 | SarthakYojana.in',
    description: (job.description || job.title) + ' Check eligibility, vacancies, salary, last date and apply online at SarthakYojana.in.',
    keywords:    job.title + ', ' + job.organization + ', sarkari naukri 2026, govt jobs 2026, ' + (job.qualification || ''),
    path:        'pages/job-detail.html?id=' + encodeURIComponent(job.id),
    type:        'JobPosting',
    job:         job,
    image:       job.image ? ('assets/images/' + job.image) : undefined,
    breadcrumbs: [
      { name: 'Home', path: '' },
      { name: 'Government Jobs 2026', path: 'pages/jobs.html' },
      { name: job.title, path: 'pages/job-detail.html?id=' + encodeURIComponent(job.id) }
    ]
  });

  // Quick info card
  const statusLabel = job.status === 'open'
    ? '<span class="badge-open">✔ Open Now</span>'
    : job.status === 'closing_soon'
    ? '<span class="badge-soon">⚡ Closing Soon</span>'
    : '<span class="badge-closed">✖ Closed</span>';

  document.getElementById('quickCard').innerHTML = `
    <div class="jd-box">
      <div class="jd-title-bar">
        <h1>${job.title} – ${job.organization} 2026</h1>
      </div>
      <div class="jd-body">
        <table class="jd-meta">
          <tr><td>Organization</td><td><strong>${job.organization}</strong></td></tr>
          <tr><td>Post Name</td><td>${job.title}</td></tr>
          ${job.totalPosts || job.totalVacancies ? `<tr><td>Total Vacancies</td><td><strong style="color:#c0392b;font-size:14px;">${job.totalPosts || job.totalVacancies} Posts</strong></td></tr>` : ''}
          ${job.qualification ? `<tr><td>Qualification</td><td>${job.qualification}</td></tr>` : ''}
          ${job.ageLimit ? `<tr><td>Age Limit</td><td>${job.ageLimit}</td></tr>` : ''}
          ${job.salaryMin ? `<tr><td>Pay Scale</td><td>₹${job.salaryMin.toLocaleString()} – ₹${job.salaryMax.toLocaleString()} / month</td></tr>` : ''}
          ${job.location ? `<tr><td>Job Location</td><td>${job.location}</td></tr>` : ''}
          ${job.employmentType ? `<tr><td>Employment Type</td><td>${job.employmentType.replace(/_/g,' ')}</td></tr>` : ''}
          ${job.lastDate || job.lastDateDisplay ? `<tr><td>Last Date to Apply</td><td><strong style="color:#c0392b;">${job.lastDateDisplay || job.lastDate}</strong></td></tr>` : ''}
          ${job.examDate ? `<tr><td>Exam Date</td><td>${job.examDate}</td></tr>` : ''}
          ${job.fee ? `<tr><td>Application Fee</td><td>${job.fee}</td></tr>` : ''}
          <tr><td>Status</td><td>${statusLabel}</td></tr>
          ${job.officialNotification ? `<tr><td>Official Notification</td><td><a href="${job.officialNotification}" target="_blank" rel="nofollow noopener" style="color:#1565c0;font-weight:600;">Download PDF &rarr;</a></td></tr>` : ''}
        </table>
      </div>
    </div>`;

  // Full article content from JOB_CONTENT
  const articleContent = JOB_CONTENT[id];
  if (articleContent) {
    document.getElementById('fullContent').innerHTML = articleContent;
    renderInternalLinks(job.id, job.category);
    addContextualLinks();
  } else {
    document.getElementById('fullContent').innerHTML = `
      <h2>About ${job.organization} Recruitment 2026</h2>
      <p>${job.description || job.organization + ' has released an official recruitment notification for ' + job.title + ' posts. Eligible and interested candidates can apply online through the official website before the last date mentioned above.'}</p>
      <h2>How to Apply</h2>
      <p>Visit the official website of ${job.organization}, navigate to the recruitment section, and complete the online application form before the last date. Ensure all documents are ready before filling the form.</p>`;
  }

  // Apply box
  const applyBox = document.getElementById('applyBox');
  applyBox.style.display = 'block';
  document.getElementById('applyTitle').textContent = 'Apply Online – ' + job.title;
  document.getElementById('applyMeta').innerHTML = 'Last Date: <strong style="color:#c0392b;">' + (job.lastDateDisplay || job.lastDate || 'Check Official Site') + '</strong> &nbsp;|&nbsp; Status: <strong>' + (job.status === 'open' ? 'Open Now' : job.status === 'closing_soon' ? 'Closing Soon' : 'Check Official Site') + '</strong>';
  document.getElementById('applyLinks').innerHTML = job.applyLink ?
    `<a href="${job.applyLink}" class="apply-btn-main" target="_blank" rel="nofollow noopener">Apply Online &rarr;</a>
     &nbsp;&nbsp;
     <a href="${job.officialNotification || job.applyLink}" target="_blank" rel="nofollow noopener" style="font-size:12.5px;color:#555;">Official Notification PDF</a>` :
    '<p style="color:#888;font-size:12.5px;">Application link will be available soon. Bookmark this page.</p>';

  // ===== NRI Section: Currency + Timezone =====
  if (job.salaryMin) {
    document.getElementById('nriBox').style.display = 'block';
    const salMin = job.salaryMin;
    const salMax = job.salaryMax || salMin;
    const currencies = [
      {code:'USD', symbol:'$', rate:0.0119, flag:'🇺🇸', country:'USA'},
      {code:'GBP', symbol:'£', rate:0.0094, flag:'🇬🇧', country:'UK'},
      {code:'AED', symbol:'AED', rate:0.0437, flag:'🇦🇪', country:'UAE/Dubai'},
      {code:'CAD', symbol:'C$', rate:0.0161, flag:'🇨🇦', country:'Canada'},
      {code:'AUD', symbol:'A$', rate:0.0181, flag:'🇦🇺', country:'Australia'},
      {code:'SGD', symbol:'S$', rate:0.0160, flag:'🇸🇬', country:'Singapore'},
    ];
    document.getElementById('currencyGrid').innerHTML = currencies.map(c => `
      <div style="background:#fff;border:1px solid #e0e8f0;border-radius:6px;padding:10px;text-align:center;">
        <div style="font-size:18px;">${c.flag}</div>
        <div style="font-size:11px;color:#888;margin:2px 0;">${c.country}</div>
        <div style="font-size:13px;font-weight:800;color:#0f3460;">
          ${c.symbol}${Math.round(salMin*c.rate).toLocaleString()} –
          ${c.symbol}${Math.round(salMax*c.rate).toLocaleString()}
        </div>
        <div style="font-size:10px;color:#aaa;">/month</div>
      </div>`).join('');
  }

  if (job.lastDate || job.lastDateDisplay) {
    const lastDateStr = job.lastDate || '';
    let lastDateObj = lastDateStr ? new Date(lastDateStr + 'T23:59:00+05:30') : null;
    if (lastDateObj && !isNaN(lastDateObj)) {
      const timezones = [
        {name:'🇮🇳 India (IST)', tz:'Asia/Kolkata'},
        {name:'🇺🇸 New York (EDT)', tz:'America/New_York'},
        {name:'🇺🇸 California (PDT)', tz:'America/Los_Angeles'},
        {name:'🇬🇧 London (BST)', tz:'Europe/London'},
        {name:'🇦🇪 Dubai (GST)', tz:'Asia/Dubai'},
        {name:'🇨🇦 Toronto (EDT)', tz:'America/Toronto'},
        {name:'🇦🇺 Sydney (AEST)', tz:'Australia/Sydney'},
        {name:'🇸🇬 Singapore (SGT)', tz:'Asia/Singapore'},
      ];
      document.getElementById('timezoneBox').innerHTML = 
        '<h2>⏰ Last Date in Your Timezone</h2>' +
        '<table style="width:100%;border-collapse:collapse;font-size:12.5px;">' +
        timezones.map((tz,i) => {
          try {
            const formatted = lastDateObj.toLocaleString('en-IN', {
              timeZone: tz.tz,
              day:'2-digit', month:'short', year:'numeric',
              hour:'2-digit', minute:'2-digit', hour12:true
            });
            return `<tr style="background:${i%2===0?'#f9fbff':'#fff'}">
              <td style="padding:7px 10px;color:#555;font-weight:600;">${tz.name}</td>
              <td style="padding:7px 10px;color:#0f3460;font-weight:700;text-align:right;">${formatted}</td>
            </tr>`;
          } catch(e) { return ''; }
        }).join('') + '</table>' +
        '<p style="font-size:11px;color:#aaa;margin-top:8px;padding:0 4px;">Times are approximate. IST = Indian Standard Time (UTC+5:30). Last date is at 11:59 PM IST.</p>';
      document.getElementById('timezoneBox').style.display = 'block';
    }
  }

  // Similar jobs
  const sim = _jobs.filter(j => j.id !== id).slice(0, 10);
  document.getElementById('similarJobs').innerHTML = sim.map(j =>
    `<li><a href="job-detail.html?id=${encodeURIComponent(j.id)}">${j.title} – ${j.organization} (${j.totalPosts || j.totalVacancies || 'N/A'} Posts)</a></li>`
  ).join('');
}
</script>
</body>
</html>
