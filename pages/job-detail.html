    // Get ID from URL

    // Load JSON and render
    // ── DATA EMBEDDED — No fetch needed ──
    var JOBS_DATA = [{"id":"mpesb-forest-2026","title":"MPESB Forest Guard, Jail Prahari & Field Guard Bharti 2026 – 1679 Posts ke liye Apply Karein","category":"Jobs","lastUpdate":"15/03/2026 | 11:54 AM","description":"Madhya Pradesh mein sarkari naukri ki talash kar rahe yuvaon ke liye ek acha mauka aaya hai. Madhya Pradesh Employees Selection Board yaani MPESB ne Forest Guard, Field Guard, Jail Prahari aur Assistant Jail Superintendent ke kul 1679 posts ke liye bharti nikali hai. Yeh bharti un sabhi ke liye hai jo 10th pass hain ya graduation kar chuke hain aur MP sarkar mein naukri karna chahte hain.\n\nIs bharti ki sabse khaas baat yeh hai ki isme male aur female dono apply kar sakte hain. Aur last date ko extend karke 30 April 2026 kar diya gaya hai, isliye jin logo ne abhi tak apply nahi kiya unke paas abhi bhi waqt hai.\n\n<strong>Vacancy Details — Kitne Posts Hain?</strong>\n\nIs bharti mein 4 alag-alag posts ke liye selection hoga. Sabse zyada 757 posts Jail Prahari ke hain, uske baad 728 posts Forest Guard ke, 169 posts Field Guard ke aur 25 posts Assistant Jail Superintendent ke hain.\n\n<strong>Aayu Seema — Kaun Apply Kar Sakta Hai?</strong>\n\nIs bharti mein apply karne ke liye minimum age 18 saal rakhi gayi hai. Assistant Jail Superintendent ke liye minimum age 21 saal hai. Maximum age general category ke male candidates ke liye 33 saal hai. Mahilaon aur reserved category ke MP ke rehne wale candidates ko 5 saal ki chhoot milti hai yani unke liye maximum age 38 saal hai. Age limit 1 January 2026 ke hisaab se nikalenge.\n\n<strong>Application Fee — Kitna Paisa Lagega?</strong>\n\nGeneral category aur doosre state ke candidates ko 560 rupaye fees deni hogi. MP ke SC, ST, OBC aur PwD candidates ke liye fees 310 rupaye hai. Is fees mein 60 rupaye portal charge bhi shamil hai. Payment MP Online ke authorized kiosk centers par cash mein ya Debit Card, Credit Card aur Net Banking se bhi kar sakte hain.\n\n<strong>Physical Fitness — Kitni Height aur Chest Chahiye?</strong>\n\nYeh ek physical post hai isliye body measurements bhi check ki jaati hain. Jail Prahari ke liye male candidates ki height 165 cm aur chest 83 cm honi chahiye. Mahilaon ke liye 158 cm height kaafi hai. Forest Guard aur Field Guard male candidates ke liye height 163 cm, chest 79 cm aur chest expansion 5 cm hona zaruri hai. Mahilaon ke liye Forest Guard aur Field Guard mein 150 cm height chahiye. Assistant Jail Superintendent male ke liye 168 cm height aur 84 cm chest chahiye. Mahilaon ke liye 155 cm height kaafi hai.\n\n<strong>Documents — Kya Kya Lagega?</strong>\n\nApply karte waqt aapke paas Aadhaar Card, 10th ka certificate aur marksheet, graduation certificate agar applicable ho, caste certificate agar OBC/SC/ST hain, ek recent passport size photo, signature aur valid email ID aur mobile number hona chahiye. Inhe sahi format mein scan karke ready rakhein.\n\n<strong>Apply Kaise Karein — Step by Step?</strong>\n\nSabse pehle MPESB ki official website par jaayein. Wahan Forest Guard Bharti 2026 wala link dhundhein. Pehle ESB Profile banani hogi agar pehle se nahi bani hai. Phir Rojgar Panjiyan bhi zaroori hai. Profile banne ke baad online form mein apni details bharein — personal info, educational details, physical measurements sab. Documents upload karein. Fee pay karein. Submit karne ke baad form ka printout zaroor lein.\n\n<strong>Selection Process Kya Hoga?</strong>\n\nIs bharti mein selection written exam, physical test aur medical test ke zariye hoga. Physical test mein running, pull-ups aur long jump jaise tests honge. Jo candidates physical aur written dono mein pass honge, unhe medical ke liye bulaya jaayega. Final merit list ke baad joining letter milega.","notification":"MP Forest Guard & Jail Prahari Official Notification 2026 (Dated: 27 February 2026)","importantDates":[{"label":"Application Start Date","value":"28/02/2026","highlight":false},{"label":"Apply Last Date (Extended)","value":"30/04/2026","highlight":true},{"label":"Payment Last Date","value":"30/04/2026","highlight":true},{"label":"Last Date for Correction","value":"30/04/2026","highlight":false},{"label":"Admit Card","value":"Baad mein aayega","highlight":false},{"label":"Exam Date","value":"Baad mein aayega","highlight":false}],"fees":["General / Other State: Rs. 560/-","SC / ST / OBC / PwD (MP): Rs. 310/-","Portal Charge Rs. 60 included","Payment: MP Online kiosk / Debit / Credit / Net Banking"],"documents":["Aadhaar Card","10th Certificate & Marksheet","Graduation Certificate (if applicable)","Caste Certificate","Domicile Certificate","Passport Size Photo","Signature","Mobile Number","Email ID"],"eligibility":[{"class":"Forest Guard","age":"18-33 (General Male) / 18-38 (Female/Reserved)","category":"10th Pass","residence":"728 Posts"},{"class":"Field Guard","age":"18-33 (General Male) / 18-38 (Female/Reserved)","category":"10th Pass","residence":"169 Posts"},{"class":"Jail Prahari","age":"18-33 (General Male) / 18-38 (Female/Reserved)","category":"10th Pass","residence":"757 Posts"},{"class":"Asst. Jail Superintendent","age":"21-33 (General Male) / 21-38 (Female/Reserved)","category":"Graduation","residence":"25 Posts"}],"howToApply":[{"title":"MPESB Official Website par jaayein","detail":"esb.mp.gov.in kholo apne browser mein"},{"title":"ESB Profile Panjiyan karein","detail":"Agar pehle se profile nahi bani toh nayi banao"},{"title":"Rojgar Panjiyan complete karein","detail":"mprojgar.gov.in par apna rojgar registration karein"},{"title":"Apply Online link par click karein","detail":"Forest Guard / Jail Prahari Bharti 2026 wala link dhundhein"},{"title":"Form mein saari details bharein","detail":"Personal info, educational details, physical measurements sab sahi sahi bharo"},{"title":"Documents upload karein","detail":"Photo, signature, certificates sab scan karke upload karein"},{"title":"Application Fee pay karein","detail":"General: Rs.560, SC/ST/OBC/PwD MP: Rs.310 — MP Online ya card se"},{"title":"Form preview karein aur submit karein","detail":"Submit karne se pehle ek baar poora form check karo"},{"title":"Printout lein","detail":"Submitted form ka printout nikaalo — aage kaam aayega"}],"importantLinks":[{"label":"Apply Online","url":"https://esb.mp.gov.in","text":"Online Form"},{"label":"Rojgar Panjiyan","url":"https://mprojgar.gov.in","text":"Register Here"},{"label":"Download Notification","url":"#","text":"Official Notification PDF"},{"label":"Official Website","url":"https://esb.mp.gov.in","text":"ESB Official Website"}],"highlights":{"postName":"Forest Guard, Field Guard, Jail Prahari, Asst. Jail Superintendent","vacancy":"1679 Posts","domicile":"All India (Male & Female)","ageLimit":"18-33 Yrs (General Male) | 18-38 Yrs (Female/Reserved) | Min 21 for Jail Superintendent","applyDate":"28 Feb to 30 Apr 2026","documents":"Aadhaar | 10th Certificate | Caste Certificate | Photo","department":"Madhya Pradesh Employees Selection Board (MPESB)"},"keywords":["MPESB Forest Guard Bharti 2026","MP Jail Prahari Vacancy 2026","MPESB 1679 Post 2026","MP Field Guard Recruitment","10th Pass Govt Job MP 2026"]},{"id":"army-agniveer-2026","title":"Indian Army Agniveer Rally Bharti 2026 – GD, Technical, Sepoy Pharma ke liye Apply Karein","category":"Jobs","lastUpdate":"13/02/2026 | 11:35 AM","description":"Bharat ki Sena mein jaana bahut se youngsters ka sapna hota hai aur ab us sapne ko poora karne ka waqt aa gaya hai. Join Indian Army ne Agniveer Rally Bharti 2026-27 ke liye notification jari ki hai. Is bharti ke through GD, Technical, Tradesman, Nursing Assistant, Sepoy Pharma aur JCO Religious Teacher jaise posts ke liye selection hoga.\n\nIs bharti ki khaas baat yeh hai ki yeh ek Rally-based recruitment hai, matlab selected states aur districts mein physical tests aur written exams dono ek saath conduct ki jaati hain. Isliye apne district ki rally date zaroor check karein.\n\n<strong>Ye Bharti Kya Hai — Agniveer Scheme Kya Hoti Hai?</strong>\n\nAgniveer scheme ke tahat candidates ko 4 saal ke liye Army mein seva ka mauka milta hai. In 4 saalon mein candidates ko achhi training, salary aur anubhav milta hai. 4 saal baad kuch selected Agniveers ko regular Army mein liya jaata hai baki ko ek mota severance package diya jaata hai jisse woh apna khud ka kaam ya aage padhai kar sakte hain. Yeh scheme un yuvaon ke liye bahut faydemand hai jo desh seva karna chahte hain.\n\n<strong>Post Wise Eligibility Kya Hai?</strong>\n\nAgniveer GD ke liye candidates ko apne us district ka niwasi hona zaroori hai jahan se woh rally mein apply kar rahe hain. Class 10th pass hona chahiye minimum. Height 169 cm aur 1.6 km running 5 minute 30 second mein karni hogi. Pull-ups 10 baar lagane honge.\n\nWomen Military Police ke liye Agniveer GD mahilaaon ke liye ek alag category hai. Inhe 10th mein 45 percent marks chahiye. Height 162 cm honi chahiye aur 1.6 km running 7 minute 30 second mein karni hogi.\n\nNursing Assistant ke liye candidates ke paas 12th mein Physics, Chemistry aur Biology ke saath 50 percent marks hone chahiye. Height 169 cm se 170 cm post ke hisaab se alag hoti hai.\n\nSepoy Pharma ke liye 12th ke baad D.Pharma ya B.Pharma kiya hua hona chahiye aur Pharmacy Council mein registration bhi hona chahiye.\n\nJCO Religious Teacher ke liye Pandit, Granthi, Maulvi, Padre ya Buddhist Monk ki post ke hisaab se graduation ke saath relevant religious qualification chahiye.\n\n<strong>Aayu Seema — Kya Age Chahiye?</strong>\n\nAgniveer GD, Technical, Assistant aur Tradesman ke liye age 17.5 saal se 22 saal honi chahiye. Soldier Technical ke liye 17.5 se 23 saal. Sepoy Pharma ke liye 19 se 25 saal. JCO Religious Teacher ke liye 25 se 34 saal ki age honi chahiye.\n\n<strong>Application Fee — Kitni Lagegi?</strong>\n\nIs bharti ke liye General, OBC aur EWS sabhi categories ke liye 250 rupaye ki fees hai. SC aur ST candidates ke liye bhi 250 rupaye hi hai. Payment UPI, net banking, debit ya credit card se online ki ja sakti hai.\n\n<strong>Physical Test Ki Taiyari Kaise Karein?</strong>\n\nArmy ki rally mein physical fitness bahut zaroori hai. Running ki preparation ke liye roz subah jaldi utho aur 4 se 5 km ki practice karo. Pull-ups ke liye regular exercises karo. Apni height ke hisaab se weight balance rakho. Achi diet lo aur neend poori karo. Admit card milte hi apne documents ready rakh lo aur rally venue par samay se pahuncho.\n\n<strong>Apply Kaise Karein?</strong>\n\nSabse pehle Indian Army ki official website par jaayein. Wahan Agniveer Rally ka link dhundhein. Pehle new registration karein. Login karke apni post select karein. Personal details, educational details aur district details bharein. Photo aur documents upload karein. Fee pay karein. Final submit ke baad application print kar lein.","notification":"Indian Army Rally Recruitment 2026-27 Official Notification (Dated: 13 February 2026)","importantDates":[{"label":"Application Start Date","value":"13/02/2026","highlight":false},{"label":"Apply Last Date","value":"01/04/2026","highlight":true},{"label":"Payment Last Date","value":"01/04/2026","highlight":true},{"label":"Agniveer Exam Date","value":"01/06/2026 to 15/06/2026","highlight":false},{"label":"Admit Card","value":"Exam se pehle","highlight":false}],"fees":["General / OBC / EWS: Rs. 250/-","SC / ST: Rs. 250/-","Payment: UPI / Net Banking / Debit / Credit Card"],"documents":["Aadhaar Card","10th / 12th Certificate","Domicile / Residence Certificate","Caste Certificate (if applicable)","Character Certificate","Passport Size Photo","Signature"],"eligibility":[{"class":"Agniveer GD (Male)","age":"17.5 to 22 Years","category":"10th Pass, Height 169cm, Running 5:30","residence":"District Resident"},{"class":"Agniveer GD (Women MP)","age":"17.5 to 22 Years","category":"10th 45%, Height 162cm, Running 7:30","residence":"State Resident"},{"class":"Nursing Assistant","age":"17.5 to 23 Years","category":"12th PCB 50%, Height 169-170cm","residence":"State Resident"},{"class":"Sepoy Pharma","age":"19 to 25 Years","category":"12th + D.Pharma/B.Pharma + Registration","residence":"State Resident"},{"class":"JCO Religious Teacher","age":"25 to 34 Years","category":"Graduation + Religious Qualification","residence":"As per notification"}],"howToApply":[{"title":"Indian Army Official Website par jaayein","detail":"joinindianarmy.nic.in open karein"},{"title":"New Registration karein","detail":"Apna mobile number aur email se account banao"},{"title":"Login karein","detail":"Registered credentials se login karein"},{"title":"Post select karein","detail":"GD, Technical, Tradesman ya Nursing Assistant mein se apni post chunein"},{"title":"Application Form bharein","detail":"District, state, personal aur education details sahi bharein"},{"title":"Documents upload karein","detail":"Photo, signature aur required certificates upload karein"},{"title":"Fee pay karein","detail":"Rs. 250 — UPI, net banking ya card se pay karein"},{"title":"Final Submit karein","detail":"Ek baar verify karo phir submit dabao"},{"title":"Application print karein","detail":"Confirmation page ka printout zaroor rakhein"}],"importantLinks":[{"label":"Apply Online","url":"https://joinindianarmy.nic.in","text":"Online Form"},{"label":"Download Notification","url":"#","text":"Official Notice"},{"label":"Official Website","url":"https://joinindianarmy.nic.in","text":"Indian Army Official Website"}],"highlights":{"postName":"Agniveer GD, Technical, Tradesman, Nursing Assistant, Sepoy Pharma, JCO RT","vacancy":"Various Posts","domicile":"All India (Male & Female)","ageLimit":"17.5 to 34 Years (Post Wise)","applyDate":"13 Feb to 01 Apr 2026","documents":"Aadhaar | 10th/12th Certificate | Domicile | Character Certificate","department":"Join Indian Army (Bhartiya Sena)"},"keywords":["Army Agniveer Rally 2026","Indian Army Bharti 2026","Agniveer GD Eligibility","Army Technical Recruitment 2026","Army Women Military Police Bharti","Sepoy Pharma Recruitment 2026"]},{"id":"mp-fsl-2026","title":"MP FSL Recruitment 2026 – 126 Laboratory Technician, Assistant aur Attendant Posts ke liye Apply Karein","category":"Jobs","lastUpdate":"22/03/2026 | 03:27 PM","description":"Madhya Pradesh mein science background wale candidates ke liye ek behtareen sarkari naukri ka mauka nikla hai. MP Police Head Quarter yaani MPPHQ ne Forensic Science Laboratory mein 126 posts ke liye recruitment notice jari kiya hai. In posts mein Laboratory Technician, Laboratory Assistant aur Laboratory Attendant shamil hain.\n\nSabse achhi baat yeh hai ki is bharti mein kisi bhi category ke liye koi application fees nahi hai — yani bilkul free mein apply kar sakte hain. Yeh MP ke un students ke liye sone pe suhaga hai jo science se graduation ya 12th kar chuke hain.\n\n<strong>Kya Kaam Karna Hoga In Posts Mein?</strong>\n\nForensic Science Laboratory mein kaam karna matlab aap police ki jaanch mein scientific taur par madad karenge. Crime scene se laaye gaye samples ka analysis karna, reports taiyar karna aur evidence preserve karna — yeh sab in posts ki zimmedaari hai. Yeh kaam bahut responsible aur important hota hai kyunki scientific reports court mein bhi use hoti hain.\n\n<strong>Post Wise Vacancy Aur Qualification Kya Chahiye?</strong>\n\nLaboratory Technician ke liye 35 posts hain. Iske liye B.Sc Forensic Science, Computer Science ya Computer Application mein graduation zaroori hai. Laboratory Assistant ke liye 33 posts hain aur iske liye 12th Science stream se pass hona kaafi hai. Laboratory Attendant ke liye 58 posts hain jo 10th pass candidates ke liye hain. Teen posts mein se kisi ek ke liye bhi apply kar sakte hain apni qualification ke hisaab se.\n\n<strong>Age Limit Kya Hai?</strong>\n\nIs bharti ke liye minimum age 18 saal aur maximum age 40 saal hai. Age limit 1 January 2026 ke hisaab se calculate ki jaayegi. Agar aap reserved category se hain toh age relaxation ka faayda le sakte hain — uske liye official notification zaroor padhein.\n\n<strong>Application Fee Nahi Hai — Sach Mein?</strong>\n\nHaan, bilkul sach. Is bharti mein General, OBC, SC, ST aur mahilaaon sabke liye application fee zero hai. Koi portal charge nahi, koi processing fee nahi. Bas apne documents ready rakho aur online form bharo.\n\n<strong>Documents Kya Chahiye?</strong>\n\nApply karne ke liye Aadhaar Card, 10th aur 12th ki marksheet aur certificate, graduation certificate agar applicable ho, caste certificate, domicile certificate, ek recent passport size photo aur signature scan ready rakhein. Sab documents sahi format mein hone chahiye.\n\n<strong>Apply Kaise Karein?</strong>\n\nSabse pehle official website par jaayein aur registration karein. Login ke baad application form mein sari details achi tarah se bharein. Educational details mein koi gadbad na karo. Documents upload karein. Form ka preview dekho — sab sahi hai toh submit karo. Submit ke baad receipt zaroor download karein aur ek printout nikaalo rakh lo.","notification":"MP FSL Recruitment 2026 Notification Out (Dated: 15 March 2026)","importantDates":[{"label":"Application Start Date","value":"18/03/2026","highlight":false},{"label":"Apply Last Date","value":"06/04/2026","highlight":true},{"label":"Duplicate Receipt Last Date","value":"06/04/2026","highlight":false}],"fees":["Sabhi Categories ke liye: Rs. 0/-","Koi bhi fees nahi lagti — Bilkul Free"],"documents":["Aadhaar Card","10th Certificate & Marksheet","12th Certificate & Marksheet","Graduation Certificate (if applicable)","Caste Certificate","Domicile Certificate","Passport Size Photo","Signature"],"eligibility":[{"class":"Laboratory Technician","age":"18 to 40 Years","category":"B.Sc Forensic / Computer Science / Computer Application","residence":"35 Posts"},{"class":"Laboratory Assistant","age":"18 to 40 Years","category":"12th Pass (Science Stream)","residence":"33 Posts"},{"class":"Laboratory Attendant","age":"18 to 40 Years","category":"10th Pass","residence":"58 Posts"}],"howToApply":[{"title":"Official Website par jaayein","detail":"MPPHQ ya Chayan portal open karein"},{"title":"Register karein","detail":"Nayi ID banao — email aur mobile number se"},{"title":"Login karein","detail":"Apne registered account se login karein"},{"title":"Application Form bharein","detail":"Personal details, educational qualification sab sahi bharo"},{"title":"Documents upload karein","detail":"10th/12th/Graduation certificate, photo, signature upload karein"},{"title":"Form Preview karein","detail":"Sab kuch sahi hai ya nahi ek baar check karo"},{"title":"Submit karein","detail":"Sab sahi ho toh final submit karein"},{"title":"Receipt download karein","detail":"Submission confirmation receipt download karo aur save rakho"}],"importantLinks":[{"label":"Apply Online","url":"https://mppolice.gov.in","text":"Online Form"},{"label":"Download Receipt","url":"#","text":"Duplicate Receipt"},{"label":"Download Notification","url":"#","text":"Official Notice"},{"label":"Official Website","url":"https://mppolice.gov.in","text":"Chayan Official Website"}],"highlights":{"postName":"Laboratory Technician, Laboratory Assistant, Laboratory Attendant","vacancy":"126 Posts","domicile":"All India (Male & Female)","ageLimit":"18 to 40 Years (As on 01/01/2026)","applyDate":"18 Mar to 06 Apr 2026","documents":"Aadhaar | 10th/12th/Graduation Certificate | Caste Certificate","department":"MP Police Head Quarter (MPPHQ)"},"keywords":["MP FSL Recruitment 2026","MP Forensic Lab Vacancy 2026","MP Lab Technician Vacancy","MPPHQ Recruitment 2026","Free Govt Job MP 2026","10th 12th Pass MP Govt Job"]},{"id":"bihar-board-2026","title":"Bihar Board 10th 12th Result 2026 – BSEB Matric aur Intermediate Result Kaise Dekhen","category":"Education","lastUpdate":"22/03/2026 | 12:33 PM","description":"Bihar mein laakhon students ka intezaar khatam hone wala hai. Bihar School Examination Board yaani BSEB jald hi 10th Matric aur 12th Intermediate ka result announce karne wala hai. Agar aap bhi Bihar Board ke student hain toh yeh jaankari aapke kaam ki hai — result kaise dekhen, kya kya chahiye aur kahan check karein.\n\nHar saal Bihar Board ka result lakhs of students ki zindagi ka ek important padaav hota hai. 10th result ke baad aage ki stream chunni hoti hai aur 12th result ke baad college admissions start hote hain. Isliye result ka intezaar students aur parents dono ko bahut eagerly rehta hai.\n\n<strong>Result Kab Tak Aayega?</strong>\n\nBihar Board ka 12th Intermediate result March 2026 mein aane ki ummeed hai. 10th Matric ka result March ya April 2026 mein aayega. Yeh dates expected hain — official announcement board ki website par ki jaayegi. Exam February 2026 mein conduct hua tha.\n\n<strong>Result Kaise Check Karein — Step by Step?</strong>\n\nResult check karne ke liye sabse pehle Bihar Board ki official website results.biharboardonline.com par jaana hoga. Wahan 10th ya 12th result ka link dhundhein. Link par click karne ke baad aapka Roll Code aur Roll Number daalna hoga — yeh aapke admit card par likhe hote hain. Phir captcha fill karo aur submit karo. Aapka result screen par aa jaayega. Result ka screenshot lo ya PDF download karo aur ek printout nikaalo.\n\n<strong>Marksheet Mein Kya Likha Hoga?</strong>\n\nResult mein student ka naam, roll number, roll code, pitaji aur mataji ka naam, subject-wise marks, total marks, division ya grade aur pass ya fail status likha hoga. Online marksheet provisional hoti hai — original marksheet school ke through milegi.\n\n<strong>Passing Marks Kitne Chahiye?</strong>\n\nBihar Board mein pass hone ke liye har subject mein minimum 33 percent marks laane zaroori hain. Practical wale subjects mein practical mein bhi alag se pass karna hota hai. Agar kisi subject mein marks kam aayen toh scrutiny aur compartment exam ka option bhi hota hai.\n\n<strong>Scrutiny aur Compartment Exam Kya Hota Hai?</strong>\n\nAgar aapko lagta hai ki kisi subject mein marks galat aaye hain toh result aane ke ek hafte baad scrutiny form bhar sakte hain. Yeh online process hoti hai aur fees bhi lagti hai. Agar kisi subject mein fail ho jaayein toh compartment exam dene ka mauka milta hai jo April ya May 2026 mein expected hai. Compartment result June-July mein aayega.\n\n<strong>Agar Result Check Karte Waqt Server Down Hojaye?</strong>\n\nResult ke din lakhs of students ek saath website kholta hain jisse server overload ho jaata hai. Aise mein kuch der baad dobara try karein. Third-party websites jaise indiaresults.com par bhi result check kar sakte hain. Mobile data aur wifi dono try karo.","notification":"Bihar Board 10th & 12th Result 2026 Official Notification","importantDates":[{"label":"Exam Conducted","value":"February 2026","highlight":false},{"label":"12th Result Date (Expected)","value":"March 2026","highlight":true},{"label":"10th Result Date (Expected)","value":"March-April 2026","highlight":true},{"label":"Scrutiny Application","value":"Result ke 1 hafte baad","highlight":false},{"label":"Compartment Exam (Expected)","value":"April-May 2026","highlight":false}],"fees":["Result dekhne ke liye koi fees nahi","Online result check karna bilkul free hai"],"documents":["Roll Number (Admit Card par hota hai)","Roll Code (Admit Card par hota hai)","Mobile / Computer result check karne ke liye"],"eligibility":[{"class":"10th Matric Result","age":"Koi age limit nahi","category":"Bihar Board 10th Students","residence":"Bihar"},{"class":"12th Inter Result","age":"Koi age limit nahi","category":"Bihar Board 12th Students","residence":"Bihar"}],"howToApply":[{"title":"results.biharboardonline.com par jaayein","detail":"Official Bihar Board result website open karein"},{"title":"10th ya 12th Result link chunein","detail":"Apni class ke hisaab se sahi link par click karein"},{"title":"Roll Code daalen","detail":"Roll Code admit card par likha hota hai"},{"title":"Roll Number daalen","detail":"Roll Number bhi admit card se lein"},{"title":"Captcha fill karein","detail":"Screen par jo text/number dikhe woh type karein"},{"title":"Submit karein","detail":"Submit button par click karein"},{"title":"Result dekhen","detail":"Aapka result subject-wise screen par aa jaayega"},{"title":"Screenshot lein ya PDF download karein","detail":"Result save karo aur ek printout nikaalo"}],"importantLinks":[{"label":"10th Result Check","url":"https://results.biharboardonline.com","text":"Result Check Karein (soon)"},{"label":"12th Result Check","url":"https://results.biharboardonline.com","text":"Result Check Karein (soon)"},{"label":"Official Website","url":"https://biharboardonline.bihar.gov.in","text":"BSEB Official Website"}],"highlights":{"postName":"Bihar Board Matric & Intermediate Result 2026","vacancy":"10th & 12th Students","domicile":"Bihar","ageLimit":"Koi age limit nahi","applyDate":"Result aane par check karein","documents":"Roll Number & Roll Code (Admit Card se)","department":"Bihar School Examination Board (BSEB)"},"keywords":["Bihar Board Result 2026","BSEB 10th Result 2026","Bihar Board 12th Result","Bihar Matric Result 2026","BSEB Intermediate Result","Bihar Board Result Kaise Dekhen"]},{"id":"jee-mains-2026","title":"JEE Main 2026 Session 2 – Exam City Jari, April mein Hoga Exam","category":"Education","lastUpdate":"22/03/2026 | 12:05 PM","description":"Engineering mein career banana chahne wale students ke liye JEE Main 2026 Session 2 ka notification aagaya hai. National Testing Agency yaani NTA ne April 2026 mein JEE Main Session 2 conduct karne ka schedule jari kar diya hai. Exam city details bhi release ho gayi hain — matlab jo candidates apply kar chuke hain woh ab jaanne lage hain ki unka exam center kahan hoga.\n\nJEE Main ek national level entrance exam hai jo engineering colleges mein admission ke liye hota hai. IITs mein admission ke liye JEE Advanced dena padta hai lekin uske liye pehle JEE Main clear karna zaroori hai. NIT, IIIT aur central funded technical institutions mein direct JEE Main score se admission hota hai.\n\n<strong>Session 2 Kyun Important Hai?</strong>\n\nJEE Main ke 2 sessions hote hain. Jo students Session 1 mein achha score nahi kar paaye unke liye Session 2 ek aur mauka hai. Dono sessions ke best score ko consider kiya jaata hai. Agar Session 1 nahi diya tha toh bhi Session 2 de sakte hain — dono independent hain.\n\n<strong>Eligibility Kya Hai?</strong>\n\nJEE Main 2026 mein apply karne ke liye koi age limit nahi hai. Candidate ko 2024, 2025 mein 12th pass hona chahiye ya 2026 mein appear karna chahiye. Jo 2023 ya usse pehle 12th pass kar chuke hain woh eligible nahi hain. Minimum marks ki bhi koi compulsion nahi hai.\n\n<strong>Application Fee Kitni Hai?</strong>\n\nSirf Paper 1 ke liye General male candidates ko 1000 rupaye, OBC/EWS males ko 900 rupaye, General/OBC females ko 800 rupaye aur SC/ST/PwD ko 500 rupaye fees deni hoti hai. Paper 1 aur Paper 2 dono ke liye General/OBC/EWS males ko 2000 rupaye, females ko 1600 aur SC/ST/PwD ko 1000 rupaye dene honge. Payment Debit Card, Credit Card, Net Banking ya e-challan se hoti hai.\n\n<strong>Exam City Notice Kaise Dekhen?</strong>\n\nJo candidates pehle se apply kar chuke hain woh NTA ki official website par login karke apni exam city check kar sakte hain. Exam city notice mein aapka exam center ka sheher likha hota hai lekin exact venue admit card mein aata hai. Admit card exam se 3-4 din pehle website par available hota hai.\n\n<strong>Preparation Tips for Session 2?</strong>\n\nSession 2 April 2026 mein hai — abhi thoda waqt hai. NCERT books ko ek baar aur achhe se padho especially Physics aur Chemistry ke formulas. Previous year questions solve karo. Mock tests regularly do taaki time management acchi ho. Weak topics par zyada dhyan do aur strong topics repeat karo.","notification":"JEE Main 2026 Session 2 Official Notification (Dated: 01 February 2026)","importantDates":[{"label":"Application Start Date","value":"01/02/2026","highlight":false},{"label":"Last Date to Apply","value":"25/02/2026 (9 PM tak)","highlight":true},{"label":"Fee Payment Last Date","value":"25/02/2026 (11:50 PM tak)","highlight":false},{"label":"Exam City Notice","value":"Jari Ho Gayi","highlight":false},{"label":"Exam Dates","value":"02/04/2026 to 09/04/2026","highlight":true},{"label":"Admit Card","value":"Exam se 3-4 din pehle","highlight":false}],"fees":["General Male: Rs. 1000/-","OBC/EWS Male: Rs. 900/-","General/OBC Female: Rs. 800/-","SC/ST/PwD: Rs. 500/-","Payment: Debit/Credit Card, Net Banking, e-Challan"],"documents":["Aadhaar Card / ID Proof","12th Marksheet (ya Appearing Proof)","Passport Size Photo","Signature","Mobile Number","Email ID"],"eligibility":[{"class":"JEE Main 2026","age":"Koi Age Limit Nahi","category":"12th 2024/2025 Passed ya 2026 Appearing","residence":"All India"}],"howToApply":[{"title":"Visit Website","detail":"jeemain.nta.ac.in open karein apne browser mein"},{"title":"Registration / Login","detail":"Register as a new user or login using application number and password"},{"title":"Fill Personal Details","detail":"Enter name, date of birth, category and contact details carefully"},{"title":"Select Exam Details","detail":"Choose Session 2, paper, exam language and preferred exam cities"},{"title":"Enter Qualification Details","detail":"Fill Class 10 and Class 12 education details"},{"title":"Upload Documents","detail":"Upload photograph, signature and required certificates"},{"title":"Pay Application Fee","detail":"Pay the examination fee through Debit Card, Credit Card, Net Banking or E-Challan"},{"title":"Final Submit","detail":"Review the application form and submit it"},{"title":"Print Confirmation","detail":"Download and print the confirmation page for future reference"}],"importantLinks":[{"label":"Exam City Check","url":"https://jeemain.nta.ac.in","text":"Exam City Details"},{"label":"Apply Online","url":"https://jeemain.nta.ac.in","text":"Online Form"},{"label":"Download Syllabus","url":"#","text":"Official Syllabus"},{"label":"Official Website","url":"https://jeemain.nta.ac.in","text":"NTA JEE Official Website"}],"highlights":{"postName":"NTA JEE Main Session 2 April 2026","vacancy":"Engineering College Admissions","domicile":"All India","ageLimit":"Koi Age Limit Nahi","applyDate":"01 Feb to 25 Feb 2026","documents":"Aadhaar | 12th Marksheet | Photo | Signature","department":"National Testing Agency (NTA)"},"keywords":["JEE Main 2026 Session 2","JEE Main April 2026","JEE Main Exam City 2026","NTA JEE Main Eligibility","JEE Main Apply Online 2026","JEE Main Fee 2026"]},{"id":"vahan-rc-2026","title":"Vehicle RC Card Online Download Kaise Karein – Parivahan aur DigiLocker se Puri Jaankari","category":"Documents","lastUpdate":"22/03/2026 | 09:16 AM","description":"Agar aapके paas koi bhi gaadi hai — chahe bike ho, car ho ya koi bhi commercial vehicle — toh RC yaani Registration Certificate ek bahut zaroori document hai. Sadak par chalte waqt traffic police RC maang sakti hai aur agar RC nahi dikhaye toh chaklan kat sakta hai. Ab achhi baat yeh hai ki RC online download ki ja sakti hai aur digital RC bhi legally valid hoti hai.\n\nRC ek sarkari document hai jo yeh sabit karta hai ki aapki gaadi sahi taur par sarkar ke paas registered hai. Isme gaadi ka number, malik ka naam, engine number, chassis number sab kuch likha hota hai.\n\n<strong>RC Mein Kya Kya Likha Hota Hai?</strong>\n\nRC mein gaadi ka registration number, malik ka poora naam aur pata, gaadi ka type, brand aur model, engine number, chassis number, manufacturing year, fuel type, registration date, RTO ka naam, gaadi ka rang aur fitness validity sab kuch hota hai. Commercial gaadion mein bima ki validity aur PUC status bhi RC mein dikhta hai.\n\n<strong>RC Kyun Zaroori Hai?</strong>\n\nRC ke bina aap gaadi nahi bech sakte, loan nahi le sakte, bima claim nahi kar sakte aur traffic police ke samne apni gaadi ki validity nahi sabit kar sakte. Chori ya accident mein bhi RC se pehchan hoti hai. Isliye RC hamesha safe rakhein.\n\n<strong>Parivahan Website se RC Kaise Download Karein?</strong>\n\nSabse pehle parivahan.gov.in par jaayein. Wahan Online Services mein jaake Vehicle Related Services chunein. Apna state select karein. RC Print ya Duplicate RC ka option chunein. Gaadi ka registration number aur chassis number ke last 5 digits daalen. OTP verify karein. RC download ho jaayegi.\n\n<strong>DigiLocker se RC Kaise Download Karein?</strong>\n\nDigiLocker app ya website par jaayein. Mobile number ya Aadhaar se login karein. Search Documents mein RC search karein. Ministry of Road Transport and Highways ka option chunein. Registration number daalen aur OTP verify karein. RC aapke DigiLocker mein save ho jaayegi.\n\n<strong>Digital RC Legal Hai Ya Nahi?</strong>\n\nHaan, bilkul legal hai. Supreme Court aur Government of India ne digital documents ko physical documents ke barabar maanyata di hai. Traffic police ke samne DigiLocker ya mParivahan app par dikhayi gayi RC puri tarah valid hai. Isko lekar pareshan hone ki koi zaroorat nahi.\n\n<strong>RC Kho Jaaye Toh Kya Karein?</strong>\n\nAgar physical RC kho jaaye toh FIR karwaayein. Uske baad local RTO mein jaayein aur Duplicate RC ke liye application dein. Form 26 fill karna hoga. Prescribed fees bhari jaayegi. 30 din ke andar duplicate RC mil jaati hai. Iske bich DigiLocker ki digital RC use kar sakte hain.","notification":"Parivahan Seva – Ministry of Road Transport and Highways","importantDates":[{"label":"Service Available","value":"24x7 Online Available","highlight":false},{"label":"Digital RC Valid","value":"Haan, Legally Valid Hai","highlight":true}],"fees":["Online RC Download: Free","Duplicate RC (RTO se): Prescribed Government Fees"],"documents":["Vehicle Registration Number","Chassis Number ke last 5 digits","Registered Mobile Number (OTP ke liye)","Aadhaar Card (DigiLocker ke liye)"],"eligibility":[{"class":"Vehicle RC Download","age":"Koi age limit nahi","category":"Vehicle Owner","residence":"India"}],"howToApply":[{"title":"Parivahan.gov.in par jaayein","detail":"Ya mParivahan app open karein"},{"title":"Online Services mein jaayein","detail":"Vehicle Related Services option chunein"},{"title":"Apna State select karein","detail":"Jis state mein vehicle registered hai woh chunein"},{"title":"RC Print option chunein","detail":"Duplicate RC ya RC Print wala link dhundhein"},{"title":"Registration Number daalen","detail":"Apni gaadi ka number daalen jaise MP04AB1234"},{"title":"Chassis Number ke last 5 digits daalen","detail":"RC ya vehicle papers se chassis number lein"},{"title":"OTP verify karein","detail":"Registered mobile par aaya OTP enter karein"},{"title":"RC Download karein","detail":"PDF download karein ya DigiLocker mein save karein"}],"importantLinks":[{"label":"Parivahan RC Download","url":"https://parivahan.gov.in","text":"Download via Parivahan"},{"label":"DigiLocker RC","url":"https://digilocker.gov.in","text":"Download via DigiLocker"},{"label":"Search RC Details","url":"https://vahan.parivahan.gov.in","text":"RC Details Check"},{"label":"Official Website","url":"https://parivahan.gov.in","text":"Parivahan Official Website"}],"highlights":{"postName":"Vehicle Registration Certificate (RC) Download","vacancy":"Online Service","domicile":"All India","ageLimit":"Koi Age Limit Nahi","applyDate":"24x7 Online Available","documents":"Vehicle Registration Number | Chassis Number Last 5 Digits | Mobile Number","department":"Ministry of Road Transport and Highways (MoRTH)"},"keywords":["RC Download Online","Vehicle RC Card Download","Parivahan RC Download","DigiLocker RC","Digital RC Valid","Duplicate RC Kaise Banaye"]},{"id":"upsssc-aso-2026","title":"UPSSSC ASO ARO Recruitment 2026 – 929 Posts ke liye April mein Apply Karein","category":"Jobs","lastUpdate":"21/03/2026 | 05:29 PM","description":"UP mein statistics ya economics background wale graduates ke liye ek shandaar sarkari naukri ka mauka aaya hai. Uttar Pradesh Subordinate Services Selection Commission yaani UPSSSC ne Assistant Statistical Officer aur Assistant Research Officer ke 929 posts ke liye recruitment notification nikali hai. Is bharti ki khaas baat yeh hai ki application fees maatr 25 rupaye hai jo ki sabhi categories ke liye same hai.\n\nYeh posts UP sarkar ke alag-alag departments mein data analysis, statistics aur research se related kaam ke liye hain. Agar aap numbers, research aur government sector mein kaam karna chahte hain toh yeh opportunity bilkul aapke liye hai.\n\n<strong>Kya Qualification Chahiye?</strong>\n\nAssistant Statistical Officer ke liye candidate ke paas Mathematics, Mathematical Statistics, Commerce, Economics ya Statistics mein Master's Degree honi chahiye. Saath hi O Level Computer Diploma ya 1 saal ka computer diploma bhi compulsory hai. Hindi Devanagari script ki knowledge bhi zaruri hai. Sabse zaroori baat — UPSSSC PET 2025 ka score card hona zaroori hai.\n\n<strong>PET 2025 Score Card Kyun Zaroori Hai?</strong>\n\nUPSSSC ne ek Preliminary Eligibility Test yaani PET shuru ki hai. Ab UPSSSC ki sabhi bhartiyon ke liye PET score mandatory hai. Agar aapne UPSSSC PET 2025 diya hai toh aap is bharti ke liye eligible hain. Agar nahi diya toh is bharti mein apply nahi kar sakte.\n\n<strong>Age Limit Kya Hai?</strong>\n\nIs bharti mein apply karne ki minimum age 21 saal aur maximum age 40 saal hai. Age 1 July 2026 ke hisaab se calculate hogi. Reserved category ke candidates ko age relaxation milegi — iske liye official notification padhen.\n\n<strong>Application Fee — Itni Kam?</strong>\n\nHaan, is bharti mein fees sirf 25 rupaye hai — aur yeh sabhi categories ke liye same hai, chahe General ho, OBC ho, SC ho ya ST. Payment online through UPI, net banking ya card se ki ja sakti hai.\n\n<strong>Selection Process Kya Hoga?</strong>\n\nUPSSSC ASO ke liye written exam hoga jisme objective type questions honge. Exam mein Mathematics, Statistics aur General studies ke questions aayenge. Written exam clear karne ke baad document verification hoga. Final selection merit list ke basis par hoga.\n\n<strong>Apply Kaise Karein?</strong>\n\nSabse pehle UPSSSC ki official website par jaayein. OTR yaani One Time Registration karein agar pehle se nahi kiya. Login ke baad PET details enter karein. Application form mein personal, educational aur other details bharein. Documents upload karein. 25 rupaye ki fee pay karein. Submit ke baad confirmation print karein.","notification":"Advt. No.: 05-Exam/2026 (Dated: 20 March 2026)","importantDates":[{"label":"Application Start Date","value":"21/04/2026","highlight":false},{"label":"Apply Last Date","value":"11/05/2026","highlight":true},{"label":"Payment Last Date","value":"11/05/2026","highlight":true},{"label":"Correction Last Date","value":"18/05/2026","highlight":false},{"label":"Admit Card","value":"Baad mein aayega","highlight":false}],"fees":["Sabhi Categories: Rs. 25/-","Payment: UPI / Net Banking / Debit / Credit Card"],"documents":["Aadhaar Card","Graduation Certificate & Marksheet","PG/Master's Degree Certificate","UPSSSC PET 2025 Score Card","Computer Diploma Certificate","Caste Certificate (if applicable)","Photo & Signature"],"eligibility":[{"class":"Assistant Statistical Officer","age":"21 to 40 Years (as on 01/07/2026)","category":"Master's in Maths/Stats/Economics + Computer Diploma + PET Score","residence":"929 Posts"}],"howToApply":[{"title":"UPSSSC Official Website par jaayein","detail":"upsssc.gov.in open karein"},{"title":"OTR Registration karein","detail":"One Time Registration karein agar pehle se nahi kiya"},{"title":"Login karein","detail":"OTR credentials se login karein"},{"title":"PET Details enter karein","detail":"UPSSSC PET 2025 Roll Number aur Score Card details bharein"},{"title":"Application Form bharein","detail":"Personal, educational aur other required details sahi bharein"},{"title":"Documents upload karein","detail":"Photo, signature, degree certificate, PET scorecard upload karein"},{"title":"Rs. 25 Fee pay karein","detail":"UPI, net banking ya card se online pay karein"},{"title":"Submit karein","detail":"Preview check karo phir final submit karein"},{"title":"Printout lein","detail":"Confirmation page print karo aur safe rakhein"}],"importantLinks":[{"label":"Apply Online","url":"https://upsssc.gov.in","text":"Online Form (21 Apr se)"},{"label":"Download Notification","url":"#","text":"Official Notice"},{"label":"Official Website","url":"https://upsssc.gov.in","text":"UPSSSC Official Website"}],"highlights":{"postName":"UPSSSC Assistant Statistical Officer (ASO)","vacancy":"929 Posts","domicile":"All India (Male & Female)","ageLimit":"21 to 40 Years (as on 01/07/2026)","applyDate":"21 Apr to 11 May 2026","documents":"Aadhaar | Master's Degree | PET Score Card | Computer Diploma","department":"Uttar Pradesh Subordinate Services Selection Commission (UPSSSC)"},"keywords":["UPSSSC ASO Recruitment 2026","UPSSSC 929 Post 2026","UPSSSC ASO ARO Vacancy","UP Government Jobs 2026","UPSSSC PET Based Recruitment","UP Statistics Officer Vacancy"]},{"id":"ssb-paramedical-2026","title":"SSB Paramedical Staff Recruitment 2026 – 83 Constable, Head Constable aur ASI Posts ke liye Apply Karein","category":"Jobs","lastUpdate":"21/03/2026 | 03:48 PM","description":"Sashastra Seema Bal yaani SSB ne paramedical background wale candidates ke liye ek acha mauka nikala hai. SSB ne Head Constable, Constable aur Assistant Sub Inspector ke paramedical posts ke liye kul 83 vacancies nikali hain. Yeh bharti un candidates ke liye hai jinke paas laboratory, physiotherapy, nursing, radiology ya pharmacy jaisi medical field ki qualification hai.\n\nSSB ek paramilitary force hai jo India ki borders ki raksha karta hai. Is force mein paramedical staff bahut zaroori hoti hai taaki border par tainat jawanon ko medical suvidha mil sake. Isliye yeh posts important aur responsible hain.\n\n<strong>Konse Posts Hain Aur Kitni Vacancies Hain?</strong>\n\nHead Constable Laboratory Assistant ke 30 posts hain. Head Constable Physiotherapy Assistant ke 12 posts hain. Constable Nursing Assistant ke 34 posts hain. Assistant Sub Inspector Radiographer ke 3, ASI Pharmacist ke 2, ASI Operation Theatre Technician ka 1 aur ASI Dental Technician ka 1 post hai. Kul milakar 83 posts hain.\n\n<strong>Qualification Kya Chahiye Post Wise?</strong>\n\nHead Constable Laboratory Assistant ke liye 12th mein Physics, Chemistry aur Biology hona chahiye saath mein Laboratory Assistant Course Certificate aur minimum 1 saal ka experience bhi zaroori hai. Head Constable Physiotherapy Assistant ke liye 12th Science ke baad Diploma in Physiotherapy aur 1 saal hospital experience chahiye. Constable Nursing Assistant ke liye 10th pass hone ke saath Nursing Assistant ya First Aid certificate aur 1 saal ka hospital experience hona chahiye.\n\n<strong>Age Limit Kya Hai?</strong>\n\nIs bharti mein minimum age 18 saal aur maximum age 27 saal hai. Age 20 April 2026 ke hisaab se nikalegi. SC/ST aur OBC candidates ko age relaxation milegi.\n\n<strong>Application Fee Kya Hai?</strong>\n\nGeneral, OBC aur EWS candidates ko 100 rupaye fees deni hogi. SC, ST, PwBD aur mahila candidates ke liye fees zero hai.\n\n<strong>Selection Process Kya Hoga?</strong>\n\nSSB ki is bharti mein written exam, physical test aur medical test se selection hoga. Written exam mein general knowledge, reasoning aur subject-specific questions aayenge. Physical test mein running aur other activities honge. Medical mein health check hogi.\n\n<strong>Apply Kaise Karein?</strong>\n\nSSB ki official website par jaayein. OTR Registration karein agar nahi ki hai. Login ke baad Head Constable ya ASI wala link chunein kyunki dono ke liye alag forms hain. Details bharein, documents upload karein, fee pay karein aur submit karein. Application ka printout zaroor rakhein.","notification":"Advertisement No.: 524/RC/SSB/Combined Advt./CT to SI (Non-GD)/2025 (Dated: 21 March 2026)","importantDates":[{"label":"Application Start Date","value":"21/03/2026","highlight":false},{"label":"Apply Last Date","value":"20/04/2026","highlight":true},{"label":"Payment Last Date","value":"20/04/2026","highlight":true},{"label":"Admit Card","value":"Baad mein aayega","highlight":false}],"fees":["General / OBC / EWS: Rs. 100/-","SC / ST / PwBD / Female: Rs. 0/-","Payment: UPI / Net Banking / Card"],"documents":["Aadhaar Card","10th / 12th Certificate","Diploma / Course Certificate","Experience Certificate","Caste Certificate (if applicable)","Photo & Signature"],"eligibility":[{"class":"HC Laboratory Assistant","age":"18-27 Years","category":"12th PCB + Lab Assistant Course + 1 Yr Exp","residence":"30 Posts"},{"class":"HC Physiotherapy Asst.","age":"18-27 Years","category":"12th Science + Diploma Physiotherapy + 1 Yr Exp","residence":"12 Posts"},{"class":"Constable Nursing Asst.","age":"18-27 Years","category":"10th + Nursing/First Aid Certificate + 1 Yr Exp","residence":"34 Posts"},{"class":"ASI Radiographer","age":"18-27 Years","category":"12th Science + Radiology Diploma + Experience","residence":"3 Posts"}],"howToApply":[{"title":"SSB Official Website par jaayein","detail":"ssbrectt.gov.in open karein"},{"title":"OTR Registration karein","detail":"One Time Registration nahi ki hai toh pehle karein"},{"title":"Login karein","detail":"Registered ID se login karein"},{"title":"HC ya ASI form chunein","detail":"Dono ke alag links hain — apni post ke hisaab se chunein"},{"title":"Details bharein","detail":"Personal information, educational details sab sahi sahi likhein"},{"title":"Documents upload karein","detail":"Diploma, experience certificate, photo aur signature upload karein"},{"title":"Fee pay karein","detail":"General/OBC: Rs.100 | SC/ST/Female: Free"},{"title":"Submit karein","detail":"Ek baar preview karo phir submit karein"},{"title":"Printout lein","detail":"Application form ka printout zaroor rakhein"}],"importantLinks":[{"label":"Apply Online HC","url":"https://ssbrectt.gov.in","text":"Head Constable Form"},{"label":"Apply Online ASI","url":"https://ssbrectt.gov.in","text":"ASI Form"},{"label":"Download Notification","url":"#","text":"Official Notice"},{"label":"Official Website","url":"https://ssbrectt.gov.in","text":"SSB Official Website"}],"highlights":{"postName":"Head Constable & ASI Paramedical Staff (SSB)","vacancy":"83 Posts","domicile":"All India (Male & Female)","ageLimit":"18 to 27 Years (as on 20/04/2026)","applyDate":"21 Mar to 20 Apr 2026","documents":"Aadhaar | 10th/12th Certificate | Diploma | Experience Certificate","department":"Sashastra Seema Bal (SSB)"},"keywords":["SSB Paramedical Recruitment 2026","SSB Head Constable Medical 2026","SSB ASI Pharmacist Vacancy","SSB Nursing Assistant Bharti","SSB 83 Posts 2026"]},{"id":"ssb-si-2026","title":"SSB Sub Inspector SI Recruitment 2026 – 51 Posts ke liye Apply Karein","category":"Jobs","lastUpdate":"21/03/2026 | 03:12 PM","description":"Sashastra Seema Bal ne Sub Inspector ke 51 posts ke liye recruitment nikali hai. Yeh posts Pioneer, Staff Nurse aur Communication fields mein hain. Agar aapke paas Civil Engineering mein degree hai, Nursing mein qualification hai ya Electronics/IT mein degree hai toh yeh bharti aapke liye ek behtareen career option ho sakta hai.\n\nSSB ek Central Armed Police Force hai jo India-Nepal aur India-Bhutan border ki suraksha karta hai. Is force mein Sub Inspector rank ek responsible post hoti hai jahan candidate ko leadership ki zimmedaari bhi deni hoti hai.\n\n<strong>Konse Posts Hain Aur Kya Qualification Chahiye?</strong>\n\nSub Inspector Pioneer ke 21 posts hain jiske liye Civil Engineering mein degree chahiye. Yeh post construction, maintenance aur infrastructure se related kaam ke liye hai.\n\nSub Inspector Staff Nurse ke 10 posts hain. Iske liye B.Sc Nursing ya GNM ke saath Nursing Council mein registration zaroori hai.\n\nSub Inspector Communication ke 20 posts hain. Iske liye Electronics, IT, Computer Science ya Physics with Mathematics mein degree chahiye. Yeh posts communication systems operate aur maintain karne ke liye hain.\n\n<strong>Age Limit Kya Hai?</strong>\n\nIs bharti mein minimum age 18 saal aur maximum age 30 saal hai. Age 24 April 2026 ke hisaab se calculate hogi. Reserved category candidates ko government rules ke hisaab se age mein chhoot milegi.\n\n<strong>Application Fee Kitni Hai?</strong>\n\nGeneral, OBC aur EWS candidates ke liye 200 rupaye fees hai. SC, ST aur PwBD candidates ke liye koi fees nahi hai. Payment online ki ja sakti hai.\n\n<strong>Selection Kaise Hoga?</strong>\n\nLikha hua exam pehle hoga jisme technical aur general subjects se questions aayenge. Phir physical test hoga. Medical exam bhi hoga. Final merit ke basis par selection hoga aur training ke liye bheja jaayega.\n\n<strong>Apply Kaise Karein?</strong>\n\nSSB ki website par jaao, registration karo, login karo, form mein sab details sahi sahi bharo, documents upload karo, fees pay karo, submit karo aur printout nikaal lo. Apply karne ki last date 20 April 2026 hai.","notification":"Advertisement no: 524/RC/SSB/Combined Advt./CT to SI (Non-GD)/2025 (Dated: 21 March 2026)","importantDates":[{"label":"Application Start Date","value":"21/03/2026","highlight":false},{"label":"Apply Last Date","value":"20/04/2026","highlight":true},{"label":"Payment Last Date","value":"20/04/2026","highlight":true},{"label":"Exam Date","value":"Baad mein aayega","highlight":false}],"fees":["General / OBC / EWS: Rs. 200/-","SC / ST / PwBD: Rs. 0/-","Payment: UPI / Net Banking / Card"],"documents":["Aadhaar Card","Graduation / Engineering Degree Certificate","B.Sc Nursing / GNM Certificate + Registration (Staff Nurse ke liye)","Electronics / IT Degree (Communication ke liye)","Caste Certificate (if applicable)","Photo & Signature"],"eligibility":[{"class":"SI Pioneer","age":"18-30 Years","category":"Degree in Civil Engineering","residence":"21 Posts"},{"class":"SI Staff Nurse","age":"18-30 Years","category":"B.Sc Nursing / GNM + Nursing Registration","residence":"10 Posts"},{"class":"SI Communication","age":"18-30 Years","category":"Degree in Electronics / IT / Computer Science","residence":"20 Posts"}],"howToApply":[{"title":"SSB Website par jaayein","detail":"ssbrectt.gov.in open karein"},{"title":"Registration karein","detail":"Nayi ID banao apne email aur mobile se"},{"title":"Login karein","detail":"Account se login karein"},{"title":"Application Form bharein","detail":"Pioneer, Staff Nurse ya Communication post choose karo aur details bharo"},{"title":"Documents upload karein","detail":"Degree certificate, nursing registration (agar applicable), photo, signature"},{"title":"Preview dekhen","detail":"Submit se pehle sab details ek baar check karein"},{"title":"Fee pay karein","detail":"General/OBC/EWS: Rs. 200 | SC/ST/PwBD: Free"},{"title":"Submit karein","detail":"Final submit button dabao"},{"title":"Print karein","detail":"Confirmation page ka printout rakh lo"}],"importantLinks":[{"label":"Apply Online","url":"https://ssbrectt.gov.in","text":"Online Form"},{"label":"Download Notification","url":"#","text":"Official Notice"},{"label":"Official Website","url":"https://ssbrectt.gov.in","text":"SSB Official Website"}],"highlights":{"postName":"SSB Sub Inspector (Pioneer, Staff Nurse, Communication)","vacancy":"51 Posts","domicile":"All India (Male & Female)","ageLimit":"18 to 30 Years (as on 24/04/2026)","applyDate":"21 Mar to 20 Apr 2026","documents":"Aadhaar | Engineering/Nursing Degree | Registration Certificate","department":"Sashastra Seema Bal (SSB)"},"keywords":["SSB SI Recruitment 2026","SSB Sub Inspector Vacancy 2026","SSB SI Pioneer Post","SSB Staff Nurse Vacancy","SSB Communication SI 2026"]},{"id":"ssb-hc-2026","title":"SSB Head Constable Recruitment 2026 – 233 Posts Steward, Communication, Electrician ke liye Apply Karein","category":"Jobs","lastUpdate":"21/03/2026 | 03:10 PM","description":"SSB yaani Sashastra Seema Bal ne Head Constable ke 233 posts ke liye recruitment notification jari ki hai. Yeh posts Steward, Communication, Electrician aur Veterinary trades mein hain. Agar aapke paas 10th ya 12th ke saath koi relevant diploma ya ITI hai toh aap is bharti ke liye apply kar sakte hain.\n\nSSB paramilitary force mein Head Constable ek respected post hai. Yah candidates apni trade ke hisaab se specific kaam karte hain — chahe woh communication systems chalana ho, bijli ka kaam ho ya khane ki vyavastha dekhna ho. Sabka apna role hai aur sabki zaroorat hai.\n\n<strong>Post Wise Vacancy Kya Hai?</strong>\n\nHead Constable Steward ke sirf 2 posts hain. Head Constable Communication ke sabse zyada 197 posts hain. Head Constable Electrician ke 29 posts hain. Head Constable Veterinary ke 5 posts hain. Kul milakar 233 posts hain.\n\n<strong>Qualification Kya Chahiye Post Wise?</strong>\n\nSteward post ke liye 12th pass ke saath Catering ya Kitchen Management mein diploma aur relevant experience chahiye. Communication post ke liye 12th mein Science with PCM yaani Physics, Chemistry aur Mathematics ke saath Electronics, IT ya Computer Science mein diploma zaroori hai. Electrician post ke liye 10th pass ke baad ITI in Electrician Trade aur kaam ka experience chahiye. Veterinary post ke liye 12th mein Biology ke saath Veterinary ya Livestock mein diploma chahiye.\n\n<strong>Age Limit Kya Hai?</strong>\n\nZyadatar posts ke liye minimum age 18 aur maximum age 27 saal hai. Sirf Electrician post ke liye maximum age 25 saal hai. Age 20 April 2026 ke hisaab se calculate hogi.\n\n<strong>Application Fee?</strong>\n\nGeneral, OBC aur EWS ke liye 100 rupaye fees hai. SC, ST, PwBD aur mahilaaon ke liye koi fees nahi hai.\n\n<strong>Apply Kaise Karein?</strong>\n\nSSB website par jaayein, registration karein, login karein, apna post select karein, form bharein, documents upload karein, fee pay karein aur submit karo. Form ka printout zaroor rakhein kyunki aage kaam aata hai.","notification":"Advertisement no: 524/RC/SSB/Combined Advt./Head Constables/2025 (Dated: 21 March 2026)","importantDates":[{"label":"Application Start Date","value":"21/03/2026","highlight":false},{"label":"Apply Last Date","value":"20/04/2026","highlight":true},{"label":"Payment Last Date","value":"20/04/2026","highlight":true},{"l ears | Electrician: 18-25 Years (as on 20/04/2026)","applyDate":"21 Mar to 20 Apr 2026","documents":"Aadhaar | 10th/12th | Diploma/ITI | Experience Certificate","department":"Sashastra Seema Bal (SSB)"},"keywords":["SSB Head Constable Recruitment 2026","SSB HC Communication 2026","SSB Electrician Vacancy","SSB 233 Posts 2026","10th 12th ITI Govt Job 2026"]},{"id":"ssb-constable-2026","title":"SSB Constable Tradesman aur Driver Recruitment 2026 – 827 Posts ke liye Apply Karein","category":"Jobs","lastUpdate":"21/03/2026 | 03:07 PM","description":"Sashastra Seema Bal ne Constable Tradesman aur Driver ke 827 posts ke liye bharti nikali hai. Yeh sabse zyada vacancies wali SSB bharti hai — 827 posts mein 11 alag alag trades hain jisme Driver, Gardener, Tailor, Barber, Cobbler, Washerma, Carpenter, Waiter, Veterinary, Nursing Orderly aur Water Carrier shamil hain.\n\nYeh posts un candidates ke liye hain jo 10th pass hain aur koi relevant trade ya skill jaante hain. SSB mein Constable Tradesman ek stable aur respectable government job hai jisme regular salary, accommodation aur other perks bhi milte hain.\n\n<strong>Sabse Zyada Vacancy Konse Post Mein Hai?</strong>\n\nIs bharti mein sabse zyada 553 posts Driver ke hain. Driver post ke liye valid heavy driving license hona zaroori hai. Uske baad 74 posts Washerma ke, 43 posts Barber ke, 41-41 posts Gardener aur Tailor ke, 34 posts Veterinary ke aur 25 posts Cobbler ke hain. Carpenter ke 7, Waiter ke 3, Water Carrier ke 5 aur Nursing Orderly ka 1 post hai.\n\n<strong>Age Limit Post Wise Alag Hai?</strong>\n\nDriver, Veterinary aur Nursing Orderly posts ke liye 18 se 27 saal ki age chahiye. Gardener, Water Carrier, Cobbler, Tailor, Washerman, Barber aur Waiter posts ke liye 18 se 23 saal ki age chahiye. Carpenter ke liye 18 se 25 saal. Age 20 April 2026 ke hisaab se calculate hogi.\n\n<strong>Qualification Kya Chahiye?</strong>\n\nSabhi posts ke liye minimum 10th pass hona chahiye. Driver ke liye valid HMV yaani Heavy Motor Vehicle driving license bhi compulsory hai. Baki trades ke liye ITI diploma ya 2 saal ka relevant experience ya relevant diploma chahiye. Veterinary ke liye Veterinary field mein 1 saal ka experience.\n\n<strong>Application Fee Kya Hai?</strong>\n\nGeneral, OBC aur EWS candidates ke liye 100 rupaye fees hai. SC, ST aur PwBD candidates ke liye fees zero hai. Online payment se fee pay kar sakte hain.\n\n<strong>Selection Process?</strong>\n\nLikha hua exam hoga, phir physical test aur medical exam hoga. Trade test bhi hoga matlab aapko apni trade ki practical knowledge bhi dikhani hogi — jaise Driver ko driving test dena hoga.\n\n<strong>Apply Kaise Karein?</strong>\n\nSSB ki official website ssbrectt.gov.in par jaayein. Registration karein, login karein, apni post select karein. Form mein sab sahi sahi bharein. Trade certificate aur driving license upload karein. Fee pay karein aur submit karein. Printout nikaalna na bhoolen.","notification":"Advertisement no: 524/RC/SSB/Combined Advt./Constables (Non-GD)/2025 (Dated: 21 March 2026)","importantDates":[{"label":"Application Start Date","value":"21/03/2026","highlight":false},{"label":"Apply Last Date","value":"20/04/2026","highlight":true},{"label":"Payment Last Date","value":"20/04/2026","highlight":true},{"label":"Exam Date","value":"Baad mein aayega","highlight":false}],"fees":["General / OBC / EWS: Rs. 100/-","SC / ST / PwBD: Rs. 0/-","Payment: Online"],"documents":["Aadhaar Card","10th Certificate","ITI / Trade Certificate","Driving License (Driver post ke liye HMV)","Experience Certificate (if applicable)","Caste Certificate","Photo & Signature"],"eligibility":[{"class":"Constable Driver","age":"18-27 Years","category":"10th + Valid HMV Driving License","residence":"553 Posts"},{"class":"Constable Gardener","age":"18-23 Years","category":"10th + ITI/Diploma/2 Yr Experience","residence":"41 Posts"},{"class":"Constable Tailor","age":"18-23 Years","category":"10th + ITI/Diploma/Experience","residence":"41 Posts"},{"  11:54 AM","description":"Madhya Pradesh mein padhne wale gareeb aur zarooratmand parivaaron ke bachcho ke liye ek bahut achha mauka aaya hai. State Education Center ne Right to Education yaani RTE ke tahat private schools mein free admission ke liye online form jari kar diye hain. Agar aapka baccha Nursery, KG-1 ya phir Class 1 mein admission dilana chahte hain toh yeh aapke liye hi hai.\n\nRTE ke tahat private schools mein 25 percent seats gareeb aur pichde varg ke bachcho ke liye reserved hoti hain aur iski poori fees sarkar bharti hai. Iska matlab hai aapke bacche ko private school mein padhne ka mauka milega bilkul muft mein. Yeh scheme SC, ST, OBC, BPL card wale, HIV se prabhavit, COVID orphan aur divyang bachcho ke liye available hai.\n\n<strong>Kaun Apply Kar Sakta Hai?</strong>\n\nNursery mein admission ke liye bacche ki umar 3 se 4 saal 6 mahine honi chahiye 31 July 2026 ke hisaab se. KG-1 mein admission ke liye umar 4 se 5 saal 6 mahine honi chahiye. Class 1 mein admission ke liye bacche ki umar 6 se 7 saal 6 mahine honi chahiye — yahan age 30 September 2026 ke hisaab se calculate hogi. Saath hi bacche ka ya uske parents ka Madhya Pradesh ka niwasi hona zaroori hai.\n\n<strong>Fees Kitni Lagegi?</strong>\n\nIs process mein koi bhi fees nahi lagti. Poora online application form bilkul free hai.\n\n<strong>Documents Kya Chahiye?</strong>\n\nAadhaar Card, Samagra ID, mobile number, email ID, bacche ka birth certificate, residence proof, caste certificate agar applicable ho, income certificate aur BPL card agar hai toh woh bhi ready rakhein.\n\n<strong>Lottery System Kya Hota Hai?</strong>\n\nRTE mein school allotment lottery ke through hoti hai. 2 April 2026 ko online lottery nikalegi. Iske baad 3 April se 15 April ke beech allotted school mein reporting karni hogi. Documents verify hone ke baad admission confirm hota hai.\n\n<strong>Apply Kaise Karein?</strong>\n\nRTE MP ke official portal par jaayein. New Registration karein. Bacche aur parents ki details bharein. Documents upload karein. Schools select karein. Form submit karein. Receipt download karein — yeh aage kaam aayegi.","notification":"MP RTE Admission 2026-27 Official Notification (Dated: 27 February 2026)","importantDates":[{"label":"Application Start Date","value":"13/03/2026","highlight":false},{"label":"Last Date to Apply","value":"28/03/2026","highlight":true},{"label":"Document Verification","value":"14/03 to 30/03/2026","highlight":false},{"label":"Online Lottery","value":"02/04/2026","highlight":false},{"label":"School Reporting","value":"03/04 to 15/04/2026","highlight":false}],"fees":["Koi fees nahi — bilkul FREE hai"],"documents":["Aadhaar Card","Samagra ID","Mobile Number","Email ID","Birth Certificate","Residence Certificate","Caste Certificate","Income Certificate","BPL Card (if applicable)"],"eligibility":[{"class":"Nursery","age":"3 to 4.5 Years (31 July 2026)","category":"SC/ST/OBC/BPL/Divyang/Weaker Section","residence":"MP Resident"},{"class":"KG-1","age":"4 to 5.5 Years (31 July 2026)","category":"SC/ST/OBC/BPL/Divyang/Weaker Section","residence":"MP Resident"},{"class":"Class-1","age":"6 to 7.5 Years (30 Sep 2026)","category":"SC/ST/OBC/BPL/Divyang/Weaker Section","residence":"MP Resident"}],"howToApply":[{"title":"RTE MP Portal par jaayein","detail":"rte.mponline.gov.in open karein"},{"title":"New Registration karein","detail":"Bacche aur parents ki basic details se nayi ID banao"},{"title":"Bacche ki details bharein","detail":"Naam, date of birth, category sab sahi likhein"},{"title":"Parents ki details bharein","detail":"Pitaji/mataji ka naam, income, category details bharein"},{"title":"Documents upload karein","detail":"Birth certificate, Aadhaar, Samagra ID, caste certificate scan karke upload karein"},{"title":"Schools select karein","detail":"Apne ghar ke nazdiki preferred schools chunein"},{"title":"Form submit karein","detail":"Sab details verify karke submit karein"},{"title":"Receipt download karein","detail":"Submission rec n<strong>Level 1 aur Level 2 mein Kya Fark Hai?</strong>\n\nLevel 1 Class 1 se 5 tak ke primary teacher ke liye hai. Iske liye 12th pass aur D.El.Ed ya B.Ed hona zaroori hai. Level 2 Class 6 se 8 tak ke upper primary teacher ke liye hai. Iske liye graduation aur B.Ed hona chahiye. Ek candidate dono levels ke liye ek saath apply kar sakta hai.\n\n<strong>Fees Kitni Hai?</strong>\n\nGeneral category ke liye ek level ki fees 550 rupaye hai. OBC aur EWS ke liye 450 rupaye. SC aur ST aur divyang ke liye 350 rupaye. Dono levels apply karne par fees doble hogi.\n\n<strong>Preparation Tips?</strong>\n\nRajasthan GK bahut important hai REET mein. Child Development aur Pedagogy bhi zaroori hai. Language Hindi aur English. Apni post ke subject ko achhe se padho. Previous year papers zaroor solve karo.","notification":"REET 2026 Official Notification – RBSE","importantDates":[{"label":"Notification Date","value":"March 2026","highlight":false},{"label":"Application Start","value":"01/04/2026","highlight":true},{"label":"Last Date","value":"30/04/2026","highlight":true},{"label":"Exam Date","value":"July 2026 (Expected)","highlight":false}],"fees":["General: Rs. 550/-","OBC/EWS: Rs. 450/-","SC/ST/PwD: Rs. 350/-"],"documents":["Aadhaar Card","10th & 12th Marksheet","Graduation Certificate","B.Ed / D.El.Ed Certificate","Caste Certificate","Photo & Signature"],"eligibility":[{"class":"Level 1 (Class 1-5)","age":"18 to 40 Years","category":"12th + D.El.Ed / B.Ed","residence":"Rajasthan"},{"class":"Level 2 (Class 6-8)","age":"18 to 40 Years","category":"Graduation + B.Ed","residence":"Rajasthan"}],"howToApply":[{"title":"reet.rajasthan.gov.in par jaayein","detail":"Official REET portal open karein"},{"title":"New Registration karein","detail":"Email aur mobile se account banao"},{"title":"Level chunein","detail":"Level 1, Level 2 ya dono select karein"},{"title":"Form bharein","detail":"Personal aur educational details bharein"},{"title":"Documents upload karein","detail":"Photo, sig
