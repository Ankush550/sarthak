ahiye date of notification ke hisaab se.\n\n<strong>Selection Process?</strong>\n\nLikha hua exam hoga — objective type mein. Exam mein Rajasthan GK, Mathematics, Hindi, Computer aur Reasoning se questions aayenge. Cut-off ke hisaab se merit list banegi. Document verification ke baad appointment milegi.\n\n<strong>Taiyari Kaise Karein?</strong>\n\nRajasthan GK bahut important hai — art, culture, history, geography sab cover karo. Mathematics ke liye percentage, ratio, algebra practice karo. Computer ke liye basic MS Office aur internet knowledge chahiye.","notification":"Rajasthan Patwari Bharti 2026 Official Notification","importantDates":[{"label":"Notification Date","value":"March 2026","highlight":false},{"label":"Apply Start (Expected)","value":"April 2026","highlight":true},{"label":"Last Date (Expected)","value":"May 2026","highlight":true}],"fees":["General: Rs. 450/-","OBC/EWS: Rs. 350/-","SC/ST/PwD: Rs. 250/-"],"documents":["Aadhaar Card","Graduation Certificate","RSCIT / Computer Certificate","Domicile Certificate","Caste Certificate","Photo & Signature"],"eligibility":[{"class":"Patwari","age":"18 to 40 Years","category":"Graduation + RSCIT Certificate","residence":"Rajasthan Domicile"}],"howToApply":[{"title":"RSMSSB Official Website par jaayein","detail":"rsmssb.rajasthan.gov.in open karein"},{"title":"Patwari Recruitment link dhundhein","detail":"Latest notifications mein Patwari 2026 dhundhein"},{"title":"New Registration karein","detail":"SSO ID se login ya new registration karein"},{"title":"Form bharein","detail":"Sab details sahi bharein"},{"title":"Documents upload karein","detail":"Photo, signature, certificates upload karein"},{"title":"Fees pay karein","detail":"Online payment karein"},{"title":"Submit karein","detail":"Final submit karo aur printout lo"}],"importantLinks":[{"label":"RSMSSB Official","url":"https://rsmssb.rajasthan.gov.in","text":"Apply Online"},{"label":"SSO Login","url":"https://sso.rajasthan.gov.in","text":"SSO Portal"}],"highlights":{"postName":"Rajasthan Patwari","vacancy":"Various Posts","domicile":"Rajasthan","ageLimit":"18 to 40 Years","applyDate":"April-May 2026 (Expected)","documents":"Graduation | RSCIT Certificate | Domicile","department":"Revenue Department, Rajasthan (RSMSSB)"},"keywords":["Rajasthan Patwari Bharti 2026","Patwari Vacancy Rajasthan","RSMSSB Patwari 2026","Patwari Eligibility Rajasthan","Rajasthan Lekhpal Bharti 2026"]},{"id":"rrb-alp-2026","title":"RRB ALP Assistant Loco Pilot Vacancy 2026 – 9000+ Posts ke liye Apply Karein","category":"Jobs","lastUpdate":"20/03/2026 | 02:00 PM","description":"Railway mein naukri ka sapna rakhne wale candidates ke liye ek aur mauka aaya hai. Railway Recruitment Board yaani RRB ne Assistant Loco Pilot yaani ALP ke 9000 se zyada posts ke liye notification jari ki hai. ALP woh hota hai jo driver ke saath train mein baithta hai aur driving mein madad karta hai. Yeh ek prestigious railway job hai.\n\n<strong>ALP Ki Naukri Kaisi Hoti Hai?</strong>\n\nAssistant Loco Pilot train ke cabin mein Loco Pilot yaani driver ke saath kaam karta hai. Instruments monitor karna, signals dekhna aur emergency mein driver ki madad karna ALP ka kaam hota hai. Kuch saal experience ke baad ALP ko Loco Pilot promote kiya jaata hai. Salary aur perks bahut achhe hote hain railway mein.\n\n<strong>Qualification Kya Chahiye?</strong>\n\n10th pass hona zaroori hai ITI ke saath ya 12th Science stream se. ITI trades mein Electrician, Fitter, Mechanic, Instrument Mechanic aadi valid hain. Engineering diploma wale bhi eligible hain.\n\n<strong>Selection Process?</strong>\n\nCBT 1 — Computer Based Test pehle hoga. Pass hone ke baad CBT 2 hoga. Phir psycho test aur medical exam. CBAT yaani Computer Based Aptitude Test bhi hota hai. Sab clear karne ke baad document verification aur joining.\n\n<strong>Taiyari Kaise Karein?</strong>\n\nMaths aur reasoning pe zyada focus karo. Physics ke basic concepts clear rakho. Current affairs bhi padhte raho. Mock tests regularly do. Time management bahut zaroori hai CBT mein.","notification":"RRB ALP Vacancy 2026 Official Notification – Railway Recruitment Board","importantDates":[{"label":"Notification Date","value":"March 2026","highlight":false},{"label":"Apply Start","value":"April 2026","highlight":true},{"label":"Last Date","value":"April 2026","highlight":true}],"fees":["General/OBC/EWS: Rs. 500/-","SC/ST/PwBD/Female/Minority/EBC: Rs. 250/-","Payment: Online only"],"documents":["Aadhaar Card","10th Certificate","ITI Certificate / Engineering Diploma","Caste Certificate (if applicable)","Photo & Signature"],"eligibility":[{"class":"ALP","age":"18 to 28 Years","category":"10th + ITI (relevant trade) OR 12th + 3yr Diploma","residence":"All India"}],"howToApply":[{"title":"RRB Official Website par jaayein","detail":"indianrailways.gov.in ya apne zone ka RRB site"},{"title":"ALP 2026 link dhundhein","detail":"Latest notification mein ALP vacancy dhundhein"},{"title":"New Registration karein","detail":"Email aur mobile se account banao"},{"title":"Form bharein","detail":"Personal, educational details aur zone select karein"},{"title":"Documents upload karein","detail":"Photo, signature, ITI certificate upload karein"},{"title":"Fees pay karein","detail":"Online payment karein"},{"title":"Submit karein","detail":"Preview dekho phir submit karo"}],"importantLinks":[{"label":"RRB Official","url":"https://indianrailways.gov.in","text":"Apply Online"},{"label":"RRB Jaipur","url":"https://rrbjaipur.gov.in","text":"Rajasthan Zone"}],"highlights":{"postName":"RRB Assistant Loco Pilot (ALP)","vacancy":"9000+ Posts","domicile":"All India","ageLimit":"18 to 28 Years","applyDate":"April 2026","documents":"10th | ITI Certificate | Engineering Diploma","department":"Railway Recruitment Board (RRB)"},"keywords":["RRB ALP 2026","Railway ALP Vacancy","Assistant Loco Pilot Recruitment 2026","RRB 9000 Posts","Railway 10th Pass Job 2026"]},{"id":"ayushman-2026","title":"Ayushman Bharat Card Kaise Banaye 2026 – 5 Lakh Rupaye Free Ilaaj","category":"Schemes","lastUpdate":"02/03/2026 | 10:00 AM","description":"Bimari aayi aur paisa nahi — yeh dard bahut log samajhte hain. Isliye bharat sarkar ne Ayushman Bharat Pradhan Mantri Jan Arogya Yojana shuru ki jisme har eligible parivar ko saal mein 5 lakh rupaye tak ka cashless ilaaj milta hai. Aur ab is yojana ka daaira badh gaya hai — 70 saal se upar ke sabhi buzurg bhi eligible hain chahe unki income kuch bhi ho.\n\n<strong>Yojana Kya Hai?</strong>\n\nAyushman Bharat mein eligible parivaaron ko ek health card milta hai. Is card ko dikhake empanelled hospitals mein free mein surgery, operation, cancer treatment, dialysis aur hazaron doosri treatments le sakte hain. Private hospitals bhi is yojana se jude hain. Cashless aur paperless treatment hoti hai.\n\n<strong>Kaun Eligible Hai?</strong>\n\nSECC 2011 database mein jinke naam hain woh eligible hain. Garib aur kamzor aarthik stithi wale parivar. Ab 70 saal se upar ke sabhi wrishth nagrik bhi eligible hain bina income limit ke. PM Jan Arogya Yojana ke saath saath state health schemes bhi combine hoti hain kuch states mein.\n\n<strong>Card Kaise Banaye?</strong>\n\nNazdiki Ayushman Mitra se ya CSC center se card ban sakta hai. PMJAY portal par bhi check kar sakte hain ki aap eligible hain ya nahi. Aadhaar card aur ration card lekar jaayein. Free mein card ban jaata hai.\n\n<strong>Kahan Use Karein?</strong>\n\npmjay.gov.in par hospital list milegi. Apne sheher ke empanelled hospitals mein card dikhao — free treatment milegi. Emergency mein bhi yeh card kaam aata hai.","notification":"Ayushman Bharat Pradhan Mantri Jan Arogya Yojana (PMJAY) Official","importantDates":[{"label":"Scheme Available","value":"Year Round","highlight":false},{"label":"Senior Citizen Expansion","value":"2024 se 70+ age ke liye","highlight":true}],"fees":["Card banana bilkul free hai","Treatment bhi free hai empanelled hospitals mein"],"documents":["Aadhaar Card","Ration Card","Mobile Number","Family ID (if any)"],"eligibility":[{"class":"Ayushman Bharat","age":"Koi age limit nahi (70+ ke liye alag provision)","category":"SECC 2011 Listed Families + 70+ All Senior Citizens","residence":"All India"}],"howToApply":[{"title":"Eligibility check karein","detail":"pmjay.gov.in ya 14555 helpline par check karein"},{"title":"Nazdiki CSC ya Hospital jaayein","detail":"Ayushman Mitra se milein"},{"title":"Documents lekar jaayein","detail":"Aadhaar aur Ration Card saath lein"},{"title":"Biometric verification karein","detail":"Fingerprint se identity verify hogi"},{"title":"Card milega","detail":"Ayushman card turant ya kuch din mein milega"},{"title":"Card sambhal ke rakhein","detail":"Treatment ke waqt hospital mein dikhayein"}],"importantLinks":[{"label":"Official Website","url":"https://pmjay.gov.in","text":"Ayushman Bharat Portal"},{"label":"Helpline","url":"tel:14555","text":"14555 (Toll Free)"},{"label":"Hospital Search","url":"https://pmjay.gov.in","text":"Empanelled Hospitals"}],"highlights":{"postName":"Ayushman Bharat Pradhan Mantri Jan Arogya Yojana","vacancy":"5 Lakh per year health cover","domicile":"All India","ageLimit":"Koi age limit nahi","applyDate":"Saal bhar available","documents":"Aadhaar Card | Ration Card","department":"National Health Authority, Government of India"},"keywords":["Ayushman Bharat Card Kaise Banaye","PMJAY 5 Lakh Free Treatment","Ayushman Card 2026","PM Jan Arogya Yojana","Free Medical Treatment India"]},{"id":"pm-ujjwala-2026","title":"PM Ujjwala Yojana 2026 – Free LPG Gas Connection Kaise Lein","category":"Schemes","lastUpdate":"04/03/2026 | 10:00 AM","description":"Ghar mein chulha jalana aur uspe khana banana — yeh simple kaam hai lekin lakhs parivaaron ke liye LPG gas nahi thi. Pradhan Mantri Ujjwala Yojana yaani PMUY ne is problem ka hal nikala. Is yojana ke tahat BPL aur zyada zarooratmand parivaaron ki mahilaon ko free LPG gas connection diya jaata hai.\n\n<strong>Yojana Kya Hai?</strong>\n\nPM Ujjwala Yojana mein eligible mahilaon ko free mein LPG connection milta hai — deposit free, regulator free, first refill pe subsidy. Yeh sab sarkar deti hai. Is yojana ka maksad hai ki har ghar mein clean cooking fuel ho taaki dhuen se hone wali bimaariyan kam hon.\n\n<strong>Ujjwala 2.0 Kya Hai?</strong>\n\nUjjwala 2.0 mein ek aur badlaav aaya — ab pravaasi parivar yaani woh log jo doosre sheher ya state mein rehte hain woh bhi apply kar sakte hain. Unhe address proof mein self-declaration kaafi hai.\n\n<strong>Eligibility Kya Hai?</strong>\n\nGhar ki mahila ke naam par connection milta hai. Parivar BPL ya SC/ST ya PMAY beneficiary ya antyodaya card holder ya vanvasi ya sabse pichde varg mein se hona chahiye. Parivar mein pehle se koi LPG connection nahi hona chahiye.\n\n<strong>Kaise Apply Karein?</strong>\n\nNazdiki gas agency par jaayein. PMUY form bharo. Documents submit karo. Verification ke baad connection milega. Online bhi apply ho sakta hai mylpg.in par.","notification":"Pradhan Mantri Ujjwala Yojana 2.0 Official","importantDates":[{"label":"Scheme Available","value":"Year Round","highlight":false},{"label":"New Connections","value":"Ongoing","highlight":true}],"fees":["Deposit: Free","Regulator: Free","First Refill: Subsidized"],"documents":["Aadhaar Card","BPL / Antyodaya / PMAY Card","Bank Passbook","Mobile Number","Photo"],"eligibility":[{"class":"PM Ujjwala Yojana","age":"18+ (Mahila ke naam par)","category":"BPL/SC/ST/PMAY/Antyodaya/Vanvasi Families","residence":"All India"}],"howToApply":[{"title":"Nazdiki Gas Agency par jaayein","detail":"HP Gas, Bharat Gas ya Indane agency dhundhein"},{"title":"PMUY form maangein","detail":"Ujjwala Yojana application form lein"},{"title":"Form bharein","detail":"Mahila ke naam se form bharein"},{"title":"Documents attach karein","detail":"Aadhaar, BPL card, bank passbook attach karein"},{"title":"Submit karein","detail":"Agency mein form submit karein"},{"title":"Verification aur Connection","detail":"Verification ke baad connection milega"}],"importantLinks":[{"label":"Official Website","url":"https://www.pmuy.gov.in","text":"PMUY Portal"},{"label":"Apply Online","url":"https://mylpg.in","text":"mylpg.in"}],"highlights":{"postName":"PM Ujjwala Yojana 2.0","vacancy":"Free LPG Connection","domicile":"All India","ageLimit":"18+ Mahila ke naam par","applyDate":"Year Round","documents":"Aadhaar | BPL Card | Bank Passbook","department":"Ministry of Petroleum & Natural Gas"},"keywords":["PM Ujjwala Yojana 2026","Free LPG Connection","PMUY Apply Online","Ujjwala 2.0","BPL Gas Connection"]},{"id":"ration-card-2026","title":"Ration Card Apply Online 2026 – Nayi Apply, Naam Jodna aur Download Kaise Karein","category":"Documents","lastUpdate":"15/03/2026 | 10:00 AM","description":"Ration card ek bahut zaroori sarkari document hai jo identity proof ke saath saath subsidized ration bhi dilwata hai. Agar aapke paas ration card nahi hai ya usme naam nahi hai toh is article mein poori process batai gayi hai — nayi apply kaise karein, naam kaise jodein aur download kaise karein.\n\n<strong>Ration Card Kitne Type Ke Hote Hain?</strong>\n\nAPL yaani Above Poverty Line — thoda zyada income wale parivaaron ke liye. BPL yaani Below Poverty Line — garib parivaaron ke liye — sabse zyada ration aur faayda. Antyodaya Anna Yojana — sabse garib parivaaron ke liye — sabse zyada subsidy. Har state ka apna color coding alag hota hai.\n\n<strong>Online Apply Kaise Karein?</strong>\n\nHar state ka apna food department portal hai. Rajasthan mein food.rajasthan.gov.in par jaayein. UP mein fcs.up.gov.in par. MP mein rationmitra.nic.in par. Portal par nayi application ka option milega — wahan Aadhaar, photo, address proof aur income certificate ke saath apply karein.\n\n<strong>Ration Card Download Kaise Karein?</strong>\n\nNational Food Security Portal nfsa.gov.in par jaayein. State select karein. District, block aur panchayat select karein. List mein apna naam dhundhein. PDF download karein.\n\n<strong>Naam Jodna ya Hatana?</strong>\n\nParivar mein nayi shaadi hui hai ya baccha paida hua hai toh naam jodna padega. Iske liye food department office mein ya portal par correction form bharo. Aadhaar proof aur birth certificate ya marriage certificate attach karein.","notification":"National Food Security Act – Ration Card Guidelines","importantDates":[{"label":"New Application","value":"Year Round","highlight":false},{"label":"Online Service","value":"24x7 Available","highlight":true}],"fees":["New Ration Card: Free ya nominal state charges","Download: Free"],"documents":["Aadhaar Card","Address Proof","Income Certificate / BPL Certificate","Passport Size Photo","Mobile Number"],"eligibility":[{"class":"Ration Card","age":"Koi age limit nahi (Parivar ka mukhiya apply karta hai)","category":"All Resident Indian Families","residence":"Respective State"}],"howToApply":[{"title":"State Food Portal par jaayein","detail":"Rajasthan: food.raj.nic.in | UP: fcs.up.gov.in | MP: rationmitra.nic.in"},{"title":"New Application link chunein","detail":"Nayi ration card application ka option select karein"},{"title":"Form bharein","detail":"Parivar ke sabhi members ki details bharein"},{"title":"Documents upload karein","detail":"Aadhaar, address proof aur photo upload karein"},{"title":"Submit karein","detail":"Form submit karo aur reference number note karo"},{"title":"Verification","detail":"Local officer aayega ya office mein jaana padega"},{"title":"Card milega","detail":"Verification ke baad ration card milega ya download link aayega"}],"importantLinks":[{"label":"NFSA Portal","url":"https://nfsa.gov.in","text":"nfsa.gov.in"},{"label":"Rajasthan Food Portal","url":"https://food.raj.nic.in","text":"Rajasthan Apply"},{"label":"UP Food Portal","url":"https://fcs.up.gov.in","text":"UP Apply"}],"highlights":{"postName":"Ration Card Apply / Download","vacancy":"All Indian Families","domicile":"Respective State","ageLimit":"Koi age limit nahi","applyDate":"Year Round","documents":"Aadhaar | Address Proof | Income Certificate | Photo","department":"State Food & Civil Supplies Department"},"keywords":["Ration Card Apply Online 2026","Ration Card Download","New Ration Card Kaise Banaye","Ration Card Name Add","NFSA Ration Card"]},{"id":"navy-agniveer-2026","title":"Indian Navy Agniveer MR SSR Recruitment 2026 – Apply Online Full Details","category":"Jobs","lastUpdate":"19/03/2026 | 10:00 AM","description":"Bharat ki nauka sena yaani Indian Navy ne Agniveer MR yaani Matric Recruit aur SSR yaani Senior Secondary Recruit ke posts ke liye recruitment nikali hai. Navy mein kaam karna ek alag hi anubhav hota hai — samundari yatrayen, technical skills aur desh seva sab ek saath milta hai.\n\n<strong>MR aur SSR Mein Kya Fark Hai?</strong>\n\nSSR Senior Secondary Recruit ke liye 12th pass hona zaroori hai Physics, Chemistry aur Maths ya Biology ke saath. MR Matric Recruit ke liye 10th pass kaafi hai. SSR mein technical trades hote hain jaise electronics aur mechanical. MR mein catering, hygiene aur steward jaise trades hote hain.\n\n<strong>Eligibility?</strong>\n\nSSR ke liye 17 se 21 saal age. MR ke liye bhi 17 se 21 saal. Physical standards bhi important hain — height, weight, chest aur eyesight sab check hoti hai. Unmarried male candidates apply kar sakte hain.\n\n<strong>Selection Process?</strong>\n\nOnline Written Test pehle hoga. Phir Physical Fitness Test. Medical Exam. Final merit list ke baad training ke liye bulaya jaata hai. Navy mein 4 saal ki Agniveer service hoti hai uske baad kuch ko regular service milti hai.\n\n<strong>Taiyari Kaise Karein?</strong>\n\nPhysics aur Maths ke concepts strong karein. English comprehension important hai. Reasoning aur General Science cover karein. Daily physical exercise karo taaki PFT mein koi problem na ho.","notification":"Indian Navy Agniveer MR & SSR Recruitment 2026 Official","importantDates":[{"label":"Notification Date","value":"March 2026","highlight":false},{"label":"Apply Start","value":"April 2026","highlight":true},{"label":"Last Date","value":"April 2026","highlight":true}],"fees":["All Categories: Rs. 300/-","Payment: Online only"],"documents":["Aadhaar Card","10th / 12th Certificate","School Leaving Certificate","Character Certificate","Photo & Signature"],"eligibility":[{"class":"Agniveer SSR","age":"17 to 21 Years","category":"12th PCM or PCB with 50% marks","residence":"All India (Unmarried Male)"},{"class":"Agniveer MR","age":"17 to 21 Years","category":"10th Pass with 50% marks","residence":"All India (Unmarried Male)"}],"howToApply":[{"title":"joinindiannavy.gov.in par jaayein","detail":"Official Navy recruitment website open karein"},{"title":"New Registration karein","detail":"Email aur mobile se account banao"},{"title":"Post select karein","detail":"SSR ya MR mein se chunein"},{"title":"Form bharein","detail":"Personal aur educational details bharein"},{"title":"Documents upload karein","detail":"10th/12th certificate, photo upload karein"},{"title":"Fee pay karein","detail":"Rs. 300 online pay karein"},{"title":"Submit karein","detail":"Final submit karo"}],"importantLinks":[{"label":"Apply Online","url":"https://joinindiannavy.gov.in","text":"Navy Official Website"},{"label":"Official Website","url":"https://indiannavy.nic.in","text":"Indian Navy Portal"}],"highlights":{"postName":"Agniveer MR & SSR","vacancy":"Various Posts","domicile":"All India (Unmarried Male)","ageLimit":"17 to 21 Years","applyDate":"April 2026","documents":"Aadhaar | 10th/12th Certificate | Character Certificate","department":"Indian Navy"},"keywords":["Navy Agniveer 2026","Indian Navy MR SSR","Navy Recruitment 2026","Agniveer Navy Apply","10th 12th Pass Navy Job"]},{"id":"raj-board-2026","title":"Rajasthan Board 10th 12th Result 2026 – RBSE Result Kaise Dekhen","category":"Education","lastUpdate":"18/03/2026 | 10:00 AM","description":"Rajasthan Board of Secondary Education yaani RBSE ka 10th aur 12th ka result 2026 jald announce hone wala hai. Rajasthan mein lakhs students is result ka intzaar kar rahe hain. Yeh result unke aage ke admission aur career ke liye bahut important hai.\n\n<strong>Result Kab Tak Aayega?</strong>\n\nRBSE 10th ka result April ya May 2026 mein aane ki ummeed hai. 12th ka result bhi April 2026 mein expected hai. Official announcement RBSE ki website rajeduboard.rajasthan.gov.in par ki jaayegi.\n\n<strong>Result Kaise Check Karein?</strong>\n\nrajeduboard.rajasthan.gov.in ya rajresults.nic.in par jaayein. 10th ya 12th result link par click karein. Roll number aur date of birth daalen. Submit karo — result screen par aa jaayega.\n\n<strong>Marks kam aayen toh kya karein?</strong>\n\nRBSE scrutiny ki facility deta hai — agar marks galat lage toh scrutiny form bharo. Compartment exam ki facility bhi hai agar fail hon ya zyada marks chahiye hon.\n\n<strong>Marksheet Download?</strong>\n\nOnline provisional marksheet download kar sakte hain. Original marksheet school ke through milegi. DigiLocker mein bhi save ho sakti hai.\n\n<strong>Pass Percentage Pichle Saalon Mein?</strong>\n\nRBSE ka pass percentage har saal 70 se 85 percent ke beech rehta hai. Girls ka pass percentage boys se zyada hota hai generally. Toppers list bhi official website par announce ki jaati hai jisme state rank 1 se 10 tak ke students ke naam hote hain.\n\n<strong>Supplementary Exam?</strong>\n\nJo students ek ya do subjects mein fail hote hain unhe supplementary exam ka mauka milta hai. Yeh exam July-August mein hota hai. Isme pass hone par regular students ki tarah aage padhai kar sakte hain. Compartment form school ke through ya online bhara jaata hai prescribed fees ke saath.\n\n<strong>Marksheet Verification?</strong>\n\nKisi competition ya admission ke liye original marksheet ki zaroorat padti hai jo school se milti hai. DigiLocker par bhi RBSE marksheet available hoti hai jo officially valid hai. Agar marksheet kho jaaye toh RBSE office se duplicate milti hai.","notification":"RBSE Result 2026 Official Announcement","importantDates":[{"label":"12th Result (Expected)","value":"April 2026","highlight":true},{"label":"10th Result (Expected)","value":"April-May 2026","highlight":true},{"label":"Scrutiny Form","value":"Result ke 1 hafte baad","highlight":false}],"fees":["Result dekhna: Free","Scrutiny: Nominal fees"],"documents":["Roll Number (Admit Card se)","Date of Birth"],"eligibility":[{"class":"RBSE Result","age":"Koi age limit nahi","category":"Rajasthan Board 10th/12th Students","residence":"Rajasthan"}],"howToApply":[{"title":"rajeduboard.rajasthan.gov.in par jaayein","detail":"Official RBSE website open karein"},{"title":"Result link par click karein","detail":"10th ya 12th result link chunein"},{"title":"Roll Number daalen","detail":"Admit card se roll number lein"},{"title":"Submit karein","detail":"Submit dabao aur result dekhen"},{"title":"Screenshot ya PDF save karein","detail":"Result ka printout nikaalo"}],"importantLinks":[{"label":"RBSE Official","url":"https://rajeduboard.rajasthan.gov.in","text":"RBSE Website"},{"label":"Raj Results","url":"https://rajresults.nic.in","text":"Result Portal"}],"highlights":{"postName":"RBSE 10th & 12th Result 2026","vacancy":"Rajasthan Board Students","domicile":"Rajasthan","ageLimit":"Koi age limit nahi","applyDate":"April-May 2026","documents":"Roll Number | Date of Birth","department":"Rajasthan Board of Secondary Education (RBSE)"},"keywords":["Rajasthan Board Result 2026","RBSE 10th Result","RBSE 12th Result","Raj Board Result Kaise Dekhen","rajeduboard result 2026"]},{"id":"up-board-2026","title":"UP Board 10th 12th Result 2026 – UPMSP Result Date aur Check Karne Ka Tarika","category":"Education","lastUpdate":"15/03/2026 | 10:00 AM","description":"Uttar Pradesh madhyamik shiksha parishad yaani UPMSP ka result 2026 jald aane wala hai. UP Board ka result India ka sabse bada board result hota hai — crores students iska intzaar karte hain. 10th aur 12th dono ka result 2026 mein announce hoga.\n\n<strong>UP Board Result Kab Aayega?</strong>\n\nUP Board 12th ka result April 2026 mein expected hai. 10th ka result bhi April ya May mein aayega. Exam February-March mein hua tha. Results official website par jari hoge.\n\n<strong>Result Kaise Check Karein?</strong>\n\nupmsp.edu.in ya results.upmsp.edu.in par jaayein. 10th ya 12th result ka link dhundhein. Roll number aur school code daalen. Submit karo — result aa jaayega.\n\n<strong>UP Board Scrutiny?</strong>\n\nAgar marks se santushth nahi hain toh scrutiny apply kar sakte hain. Online form bharo aur fees jama karo. Ek se do mahine mein revised result aayega.\n\n<strong>DigiLocker?</strong>\n\nUP Board ka result DigiLocker mein bhi save hota hai. Mobile number se login karo CBSE ya state board ke marksheet access ho jaate hain.\n\n<strong>UP Board Kitna Bada Hai?</strong>\n\nUP Board duniya ka sabse bada school board exam hai — har saal approximately 55 lakh se zyada students 10th aur 12th dono milake participate karte hain. Isliye result ke din website par bahut load hota hai.\n\n<strong>Passing Criteria?</strong>\n\nUP Board mein pass hone ke liye har subject mein minimum 33 marks chahiye. Theory aur practical dono mein alag alag pass karna hota hai. Ek subject mein fail hone par compartment exam milta hai.\n\n<strong>Result Ka Time?</strong>\n\nResult aam taur par subah 10 baje se dopahar 12 baje ke beech jari hota hai. Us time website slow ho jaati hai — upmsp.edu.in ke alawa indiaresults.com aur examresults.net par bhi check kar sakte hain.\n\n<strong>Scrutiny Process?</strong>\n\nAgar marks se khush nahi hain toh result ke 15 din ke andar scrutiny form bhar sakte hain. Online ya school ke through apply hota hai. Scrutiny fees lagti hai per subject. 45-60 din mein revised result aata hai.","notification":"UPMSP UP Board Result 2026 Official","importantDates":[{"label":"12th Result (Expected)","value":"April 2026","highlight":true},{"label":"10th Result (Expected)","value":"April-May 2026","highlight":true}],"fees":["Result dekhna: Free"],"documents":["Roll Number","School Code"],"eligibility":[{"class":"UP Board Result","age":"Koi age limit nahi","category":"UP Board 10th/12th Students","residence":"Uttar Pradesh"}],"howToApply":[{"title":"upmsp.edu.in par jaayein","detail":"UP Board official website open karein"},{"title":"Result link par click karein","detail":"High School ya Intermediate result chunein"},{"title":"Roll Number daalen","detail":"Admit card se roll number lein"},{"title":"Submit karo","detail":"Result screen par aa jaayega"},{"title":"Download karein","detail":"PDF save karo ya screenshot lo"}],"importantLinks":[{"label":"UP Board Official","url":"https://upmsp.edu.in","text":"UPMSP Website"},{"label":"UP Results","url":"https://results.upmsp.edu.in","text":"Result Portal"}],"highlights":{"postName":"UP Board 10th & 12th Result 2026","vacancy":"UP Board Students","domicile":"Uttar Pradesh","ageLimit":"Koi age limit nahi","applyDate":"April-May 2026","documents":"Roll Number | School Code","department":"UP Madhyamik Shiksha Parishad (UPMSP)"},"keywords":["UP Board Result 2026","UPMSP 10th Result","UP Board 12th Result","UP Board Result Kaise Dekhen","upmsp result date"]},{"id":"nta-neet-2026","title":"NTA NEET UG Online Form 2026 – Medical Admission ke liye Apply Karein","category":"Education","lastUpdate":"17/03/2026 | 10:00 AM","description":"Doctor banna chahne wale students ke liye NEET UG 2026 bahut important exam hai. National Testing Agency yaani NTA ne NEET UG 2026 ka notification jari kar diya hai. MBBS, BDS aur AYUSH courses mein admission ke liye NEET dena compulsory hai.\n\n<strong>NEET Kya Hai?</strong>\n\nNEET yaani National Eligibility cum Entrance Test ek national level medical entrance exam hai. Is exam mein Physics, Chemistry aur Biology se questions aate hain. Score ke basis par government aur private medical colleges mein admission milta hai.\n\n<strong>Eligibility Kya Hai?</strong>\n\n12th mein Physics, Chemistry aur Biology hona zaroori hai minimum 50% marks ke saath. SC/ST/OBC ke liye 40%. Minimum age 17 saal honi chahiye. Attempts limit hatai ja chuki hai.\n\n<strong>Exam Pattern?</strong>\n\n180 questions hote hain — 45 Physics, 45 Chemistry aur 90 Biology se. Har sahi jawab ke 4 marks aur galat ke liye 1 mark kata jaata hai. Exam offline pen-paper mode mein hota hai 3 ghante 20 minute mein.\n\n<strong>Taiyari Tips?</strong>\n\nNCERT books poori tarah padhna sabse important hai. Biology mein bahut zyada weight hoti hai — sabse pehle isko achi tarah cover karo. Physics ke formulas aur derivations yaad karo. Chemistry mein organic chemistry pe dhyan do.\n\n<strong>NEET mein Kitna Score Chahiye?</strong>\n\nGovernment MBBS college ke liye General category mein 600+ marks achhe maane jaate hain. OBC ke liye 550+ aur SC/ST ke liye 500+. Private colleges mein kam score par bhi admission mil sakta hai lekin fees zyada hoti hai. AIIMS aur JIPMER ke liye 650+ chahiye.\n\n<strong>NEET Counselling Kya Hoti Hai?</strong>\n\nNEET clear karne ke baad counselling hoti hai jisme rank ke hisaab se college aur seat allot hoti hai. MCC yaani Medical Counselling Committee all India quota ke liye counselling karti hai. State quota ke liye state counselling alag hoti hai.\n\n<strong>Attempts Limit?</strong>\n\nPehle NEET mein 3 attempts ki limit thi lekin ab koi limit nahi hai. Age limit bhi hata di gayi hai. Jab tak eligible ho tab tak de sakte hain. Isliye jo pehli baar clear nahi kar paaye woh baar baar try kar sakte hain.","notification":"NTA NEET UG 2026 Official Notification","importantDates":[{"label":"Application Extended Last Date","value":"March 2026","highlight":true},{"label":"Exam Date (Expected)","value":"May 2026","highlight":true},{"label":"Result (Expected)","value":"June 2026","highlight":false}],"fees":["General/OBC/EWS: Rs. 1700/-","SC/ST/PwBD: Rs. 1000/-","Payment: Online"],"documents":["Aadhaar Card","12th Certificate / Appearing Proof","Passport Size Photo","Signature"],"eligibility":[{"class":"NEET UG 2026","age":"Minimum 17 Years","category":"12th PCB with 50% (General) / 40% (SC/ST)","residence":"All India"}],"howToApply":[{"title":"neet.nta.nic.in par jaayein","detail":"Official NTA NEET website open karein"},{"title":"New Registration karein","detail":"Email aur mobile se account banao"},{"title":"Form bharein","detail":"Personal aur educational details bharein"},{"title":"Documents upload karein","detail":"Photo, signature upload karein"},{"title":"Fees pay karein","detail":"Online payment karein"},{"title":"Submit karein","detail":"Preview ke baad submit karo"},{"title":"Admit card download karein","detail":"Exam se pehle admit card zaroor download karein"}],"importantLinks":[{"label":"Apply Online","url":"https://neet.nta.nic.in","text":"NTA NEET Official"},{"label":"NTA Official","url":"https://nta.ac.in","text":"NTA Website"}],"highlights":{"postName":"NTA NEET UG 2026","vacancy":"Medical College Admissions","domicile":"All India","ageLimit":"Minimum 17 Years","applyDate":"February-March 2026","documents":"Aadhaar | 12th Certificate | Photo","department":"National Testing Agency (NTA)"},"keywords":["NEET UG 2026","NTA NEET Apply Online","NEET Eligibility 2026","NEET Exam Date 2026","Medical Entrance Exam 2026"]},{"id":"gaon-beti-2026","title":"Gaon Ki Beti Scholarship 2025-26 – Gramin Betiyon ko Milegi Scholarship","category":"Education","lastUpdate":"14/03/2026 | 10:00 AM","description":"Madhya Pradesh sarkar gramin kshetron ki betiyon ko padhai mein madad karne ke liye Gaon Ki Beti Scholarship deti hai. Is scholarship ka maksad hai ki gaon ki beti bhi aaage padh sake aur unki aarthik stithi unki padhai mein rukawat na bane. Jinhone 12th mein 60 percent ya usse zyada marks laaye hain unhe har mahine scholarship milti hai.\n\n<strong>Scholarship Kitni Milti Hai?</strong>\n\nIs scholarship mein eligible students ko 500 rupaye per month diye jaate hain — 10 mahine ke liye matlab 5000 rupaye saal mein. Yeh raqam seedha bank account mein transfer hoti hai.\n\n<strong>Kaun Apply Kar Sakta Hai?</strong>\n\nMP ki gramin kshetra ki ladkiyan eligible hain. 12th mein 60% ya usse zyada marks chahiye. Graduate ya postgraduate level mein padhai ho rahi honi chahiye kisi government college mein. SC/ST/OBC/General sabhi eligible hain. Family income limit hai jo official notification mein check karein.\n\n<strong>Application Kab Hoti Hai?</strong>\n\nHar saal July-September ke beech application portal open hota hai. Scholarshipportal.mp.nic.in par apply karna hota hai.\n\n<strong>Scholarship Kab Se Shuru Hoti Hai?</strong>\n\nJab college mein admission ho jaaye aur July mein portal khule tab se apply karo. Scholarship November-December ke aaspaas bank mein transfer hoti hai. Har saal renew karni padti hai — college jaari hai toh scholarship jaari rahegi.\n\n<strong>Gaon Ki Beti Scholarship aur Doosri Scholarships Saath?</strong>\n\nKuch cases mein ek saath do scholarship nahi le sakte. MP scholarship portal par check karo kaunsi scholarships combine ho sakti hain. Generally Gaon Ki Beti ke saath Pratibha Kiran nahi milti ek saath.\n\n<strong>Scholarship Rok Di Jaaye Toh Kya Karein?</strong>\n\nAgar bank account mein paisa nahi aaya toh apne college ke scholarship coordinator se baat karo. scholarshipportal.mp.nic.in par status check karo. Koi document missing ho sakta hai ya bank account link nahi hoga.","notification":"Gaon Ki Beti Scholarship MP Official 2025-26","importantDates":[{"label":"Application Period","value":"July-September (Annual)","highlight":true},{"label":"Portal","value":"scholarshipportal.mp.nic.in","highlight":false}],"fees":["Application: Free"],"documents":["Aadhaar Card","12th Marksheet (60%+ marks)","College Admission Proof","Bank Passbook","Domicile Certificate","Income Certificate","Photo"],"eligibility":[{"class":"Gaon Ki Beti","age":"12th pass 60%+ marks","category":"Rural MP Girls in College","residence":"MP Rural Areas"}],"howToApply":[{"title":"scholarshipportal.mp.nic.in par jaayein","detail":"MP Scholarship portal open karein"},{"title":"New Registration karein","detail":"Aadhaar se register karein"},{"title":"Gaon Ki Beti form chunein","detail":"Scholarship list mein Gaon Ki Beti dhundhein"},{"title":"Details bharein","detail":"Personal, educational aur bank details bharein"},{"title":"Documents upload karein","detail":"Marksheet, domicile, income certificate upload karein"},{"title":"Submit karein","detail":"Verify karke submit karo"}],"importantLinks":[{"label":"MP Scholarship Portal","url":"https://scholarshipportal.mp.nic.in","text":"Apply Online"}],"highlights":{"postName":"Gaon Ki Beti Scholarship","vacancy":"Rs. 500/month (10 months)","domicile":"Madhya Pradesh Rural","ageLimit":"12th pass 60%+ marks","applyDate":"July-September annually","documents":"Aadhaar | 12th Marksheet | Domicile | Income Certificate","department":"Higher Education Department, MP"},"keywords":["Gaon Ki Beti Scholarship 2026","MP Rural Girl Scholarship","MP Scholarship Portal","Gramin Beti Scholarship","12th Pass Scholarship MP"]},{"id":"upsssc-jtc-2026","title":"UPSSSC Junior Technical Cadre Bharti 2026 – 3446 Posts Apply Online","category":"Jobs","lastUpdate":"24/03/2026 | 04:00 PM","description":"Uttar Pradesh Subordinate Services Selection Commission yaani UPSSSC ne Junior Technical Cadre yaani JTC ke liye badi vacancy nikali hai. Kul 3446 posts hain jo UP ke alag alag technical departments mein hain. Ye UP ke engineering graduates ke liye ek sunehri mauka hai. Application online mode se hogi aur last date April 2026 mein hai.\n\n<strong>UPSSSC JTC 2026 — Kya Hai Yeh Naukri?</strong>\n\nJunior Technical Cadre UP government ke technical departments mein junior engineer level ki post hai. Selected candidates ko PWD, Irrigation, Rural Engineering jaise departments mein posting milegi. Ye ek permanent government job hai jisme achha salary, allowances aur job security milti hai. 3446 posts bahut badi vacancy hai toh competition thoda manageable rahega.\n\n<strong>Eligibility — Kaun Apply Kar Sakta Hai?</strong>\n\nB.Tech ya B.E. Civil, Electrical ya Mechanical Engineering mein hona chahiye kisi recognized university se. Diploma in Engineering bhi eligible hai kuch posts ke liye. Age limit 18 saal se 40 saal ke beech honi chahiye. OBC, SC, ST aur doosre reserved categories ke liye age mein chhoot milegi UP government ke niyamon ke hisaab se. UP ka domicile hona zaroori hai.\n\n<strong>Selection Process Kya Hai?</strong>\n\nUPSSSC JTC 2026 mein selection Written Exam ke basis par hoga. Exam mein Technical subjects se questions aayenge. PET yaani Preliminary Eligibility Test qualify karna zaroori hai — jo candidates PET clear kar chuke hain woh directly apply kar sakte hain. Written exam qualify karne ke baad document verification hogi aur final merit list banegi.\n\n<strong>Salary Kitni Milegi?</strong>\n\nJunior Technical Cadre ke liye pay matrix level 6 milega jisme basic pay 35400 rupaye se shuru hoti hai. Iske saath HRA, DA, TA aur doosre government allowances milenge. Total in-hand salary 45000 se 55000 rupaye per month ke around hogi. UP government employees ko 7th Pay Commission ka benefit milta hai.\n\n<strong>Apply Kaise Karein?</strong>\n\nUPSSSC ki official website upsssc.gov.in par jaayein. JTC 2026 notification link dhundhein. Pehle PET registration check karein — PET qualify hona mandatory hai. Login karke application form fill karein. Educational qualification aur personal details sahi bharein. Photo aur signature upload karein. Application fee online pay karein. Submit karne ke baad printout zaroor rakhein.","notification":"UPSSSC JTC Recruitment 2026 — Official Notification","importantDates":[{"label":"Notification Date","value":"March 2026","highlight":false},{"label":"Application Start","value":"April 2026","highlight":false},{"label":"Last Date Apply","value":"April 2026","highlight":true},{"label":"Exam Date","value":"Baad mein announce hogi","highlight":false}],"fees":["General / OBC / EWS: Rs. 25/-","SC / ST: Rs. 25/-","Payment: Online Mode"],"documents":["Aadhaar Card","B.Tech / Diploma Certificate","UP Domicile Certificate","Caste Certificate (if applicable)","PET Scorecard","Passport Size Photo"],"eligibility":[{"class":"Junior Technical Cadre","age":"18 to 40 Years","category":"B.Tech/B.E. Civil/Electrical/Mechanical ya Diploma","residence":"Uttar Pradesh"}],"howToApply":[{"title":"upsssc.gov.in par jaayein","detail":"UPSSSC official website open karein"},{"title":"JTC 2026 link click karein","detail":"Recruitment notification par click karein"},{"title":"PET scorecard ready rakhein","detail":"PET qualify hona mandatory hai"},{"title":"Registration karein","detail":"Account banao aur login karein"},{"title":"Form bharein","detail":"Sahi details bharein"},{"title":"Documents upload karein","detail":"Photo, signature aur certificates upload karein"},{"title":"Fee pay karein","detail":"Online payment karein"},{"title":"Submit karein","detail":"Printout zaroor lein"}],"importantLinks":[{"label":"Apply Online","url":"https://upsssc.gov.in","text":"UPSSSC Official Website"},{"label":"Official Notification","url":"https://upsssc.gov.in","text":"Download Notification"}],"highlights":{"postName":"Junior Technical Cadre (JTC)","vacancy":"3446 Posts","domicile":"Uttar Pradesh","ageLimit":"18 to 40 Years","applyDate":"April 2026","documents":"B.Tech/Diploma | PET Scorecard | Domicile | Aadhaar","department":"Uttar Pradesh Subordinate Services Selection Commission (UPSSSC)"},"keywords":["UPSSSC JTC 2026","UP Junior Technical Cadre","UPSSSC 3446 Posts","UP Engineering Government Job 2026","UPSSSC Vacancy 2026"]},{"id":"pm-svanidhi-2026","title":"PM SVANidhi Yojana 2026 – Street Vendors ko Milega Aasaan Loan","category":"Schemes","lastUpdate":"18/03/2026 | 10:00 AM","description":"Footpath par ya thele pe dukaan lagane wale street vendors ke liye PM SVANidhi Yojana ek badi madad hai. Pradhan Mantri Street Vendor's AtmaNirbhar Nidhi scheme ke tahat rehri-patri wale, chaat wale, sabzi wale, cobbler, chai wale aur doosre street vendors ko bank se loan mil sakta hai bina kisi guarantee ke.\n\n<strong>Yojana Kya Hai?</strong>\n\nIs yojana mein pehle 10000 rupaye ka loan milta hai. Samay par wapas karne par 20000 rupaye aur phir 50000 rupaye tak ka loan mil sakta hai. Interest rate bhi subsidized hai. Digital transactions karne par cashback bhi milta hai.\n\n<strong>Kaun Eligible Hai?</strong>\n\nShabhi urban street vendors eligible hain jo 24 March 2020 se pehle se kaam kar rahe hain ya certificate of vending rakhte hain. Local municipal authority ka certificate hona zaroori hai ya letter of recommendation.\n\n<strong>Kaise Apply Karein?</strong>\n\nPMSVANidhi.mohua.gov.in par apply kar sakte hain. Nazdiki bank ya microfinance institution se bhi apply ho sakta hai. PM SVANidhi app bhi available hai.\n\n<strong>Loan Wapas Nahi Ho Paya Toh Kya?</strong>\n\nPM SVANidhi mein flexible repayment hai — agar temporary problem hai toh bank se baat kar sakte hain. Regular repayment par cashback milta hai. Default karne se credit score kharab hota hai isliye samay par wapas karo.\n\n<strong>Digital Transactions Ka Faayda?</strong>\n\nJo vendors digital payments lete hain — UPI, QR code etc — unhe monthly cashback milta hai PM SVANidhi scheme mein. Yeh 200 rupaye se 1200 rupaye tak ho sakta hai transactions ke hisaab se. Isliye digital payments encourage kiye jaate hain.\n\n<strong>Certificate of Vending Kaise Milta Hai?</strong>\n\nApne local municipal corporation ya nagarpalika mein jaayein. Vendor registration form bharo. Surveyed vendors ko certificate of vending milta hai. New vendors ko letter of recommendation bhi kaam aata hai.","notification":"PM SVANidhi Yojana 2026 Official Update","importantDates":[{"label":"Scheme Available","value":"Year Round","highlight":false},{"label":"Loan Amount","value":"10K → 20K → 50K","highlight":true}],"fees":["Application: Free","Interest Subsidy milti hai"],"documents":["Aadhaar Card","Vendor Certificate / ULB Letter","Bank Account","Mobile Number","Photo"],"eligibility":[{"class":"Street Vendor","age":"18+ Urban Street Vendor","category":"Urban Vendors with Vending Certificate","residence":"Urban Areas India"}],"howToApply":[{"title":"PMSVANidhi.mohua.gov.in par jaayein","detail":"Official portal open karein"},{"title":"Apply for Loan chunein","detail":"Loan application link par click karein"},{"title":"Aadhaar se login karein","detail":"OTP verification karein"},{"title":"Form bharein","detail":"Vendor details aur bank details bharein"},{"title":"Documents upload karein","detail":"Vendor certificate aur Aadhaar upload karein"},{"title":"Submit karein","detail":"Application submit karo aur bank se sampark karein"}],"importantLinks":[{"label":"Official Portal","url":"https://pmsvanidhi.mohua.gov.in","text":"PM SVANidhi Portal"}],"highlights":{"postName":"PM SVANidhi Street Vendor Loan","vacancy":"10K-50K Loan","domicile":"All Urban India","ageLimit":"18+ Urban Street Vendor","applyDate":"Year Round","documents":"Aadhaar | Vendor Certificate | Bank Account","department":"Ministry of Housing & Urban Affairs"},"keywords":["PM SVANidhi Yojana 2026","Street Vendor Loan","Rehri Patri Loan Yojana","10000 Loan for Vendors","PMSVANidhi Apply Online"]},{"id":"mp-pension-2026","title":"MP Social Security Pension Yojana 2026 – Vridh, Viklang aur Vidhwa Pension Apply","category":"Schemes","lastUpdate":"16/03/2026 | 10:00 AM","description":"Madhya Pradesh sarkar buzurgon, divyang logon aur vidhwa mahilaon ko har mahine pension deti hai. Social Security Pension Yojana ke tahat yeh pension seedha bank account mein aati hai. Agar aap ya aapke parivar mein koi eligible hain toh zaroor apply karein.\n\n<strong>Kis Kis Ko Milti Hai Pension?</strong>\n\nVridhavastha Pension 60 saal se upar ke buzurgon ko milti hai jinka naam BPL list mein hai. Viklang Pension 6 percent ya usse zyada disability wale divyang logon ko milti hai. Vidhwa Pension un mahilaon ko milti hai jinka pati gujar chuka ho aur jo BPL mein hain.\n\n<strong>Pension Kitni Milti Hai?</strong>\n\nHar mahine 600 rupaye se lekar 1000 rupaye tak milti hai — category aur scheme ke hisaab se. Kuch cases mein zyada bhi milti hai.\n\n<strong>Apply Kaise Karein?</strong>\n\nMp samagra portal ya nazdiki lok seva kendra par jaayein. Form bharo — Samagra ID, Aadhaar, bank passbook aur relevant certificates saath lao. Documents verify hone ke baad pension shuru ho jaati hai.\n\n<strong>Pension Mein Shuddhi Kaise Karein?</strong>\n\nAgar bank account change hua ho ya naam mein correction chahiye toh nazdiki lok seva kendra par jaayein. Samagra portal par bhi correction ho sakta hai. Pension rokte hain toh lokayukt portal par complain kar sakte hain.\n\n<strong>Pension Kab Se Milegi?</strong>\n\nApplication ke baad 1-2 mahine mein pension shuru ho jaati hai agar documents sahi hon. Pehle backlog ke saath poora paisa ek saath bhi aata hai kuch cases mein. Jan Seva Kendra se status track kar sakte hain.\n\n<strong>Pension Kitne Saal Milti Hai?</strong>\n\nJab tak eligible hain tab tak milti hai. Vridhavastha pension zindagi bhar. Viklang pension disability certificate valid hone tak. Vidhwa pension dobara shaadi nahi hone tak milti hai. Har saal documents reverify hote hain kuch cases mein.","notification":"MP Social Security Pension Yojana Official","importantDates":[{"label":"Apply","value":"Year Round","highlight":false},{"label":"Pension","value":"Monthly Direct Bank Transfer","highlight":true}],"fees":["Apply karna free hai"],"documents":["Aadhaar Card","Samagra ID","Bank Passbook","Age Proof (Vridh ke liye)","Disability Certificate (Viklang ke liye)","Death Certificate of Husband (Vidhwa ke liye)","BPL Card"],"eligibility":[{"class":"Vridhavastha Pension","age":"60+ Years","category":"BPL Listed Senior Citizens","residence":"Madhya Pradesh"},{"class":"Viklang Pension","age":"Any Age","category":"40%+ Disability Certificate","residence":"Madhya Pradesh"},{"class":"Vidhwa Pension","age":"18+ (Vidhwa Mahila)","category":"BPL Widow Women","residence":"Madhya Pradesh"}],"howToApply":[{"title":"Nazdiki Lok Seva Kendra jaayein","detail":"Ya socialsecurity.mp.gov.in par online apply karein"},{"title":"Pension category chunein","detail":"Vridh, Viklang ya Vidhwa — apni category chunein"},{"title":"Form bharein","detail":"Samagra ID aur personal details bharein"},{"title":"Documents attach karein","detail":"Age proof, disability certificate ya death certificate"},{"title":"Submit karein","detail":"Application submit karein"},{"title":"Verification","detail":"Verification ke baad pension shuru"}],"importantLinks":[{"label":"MP Social Security Portal","url":"https://socialsecurity.mp.gov.in","text":"Apply Online"},{"label":"Samagra Portal","url":"https://samagra.gov.in","text":"Samagra ID Check"}],"highlights":{"postName":"MP Social Security Pension (Vridh/Viklang/Vidhwa)","vacancy":"Rs. 600-1000/month","domicile":"Madhya Pradesh","ageLimit":"60+ (Vridh) / Any (Viklang) / 18+ (Vidhwa)","applyDate":"Year Round","documents":"Aadhaar | Samagra ID | BPL Card | Relevant Certificates","department":"Social Justice & Persons with Disabilities Dept., MP"},"keywords":["MP Pension Yojana 2026","Vridhavastha Pension MP","Viklang Pension Apply","Vidhwa Pension MP","Social Security Pension Madhya Pradesh"]},{"id":"jan-aadhaar-2026","title":"Jan Aadhaar Card Rajasthan 2026 – Online Apply aur Download Kaise Karein","category":"Documents","lastUpdate":"08/03/2026 | 10:00 AM","description":"Rajasthan mein Jan Aadhaar Card ek bahut zaroori document ban gaya hai. Yeh ek family ID hai jisme parivar ke sabhi sadasyon ki jankari hoti hai. Rajasthan sarkar ki sabhi yojanaon ka labh lene ke liye Jan Aadhaar zaroori hai — chahe chiranjeevi yojana ho, palanhar ho ya koi aur welfare scheme.\n\n<strong>Jan Aadhaar Kya Hai?</strong>\n\nJan Aadhaar ek 10 digit ka unique family identification number hai. Ek family mein ek card hota hai jisme family ke sare members ka naam hota hai. Ek QR code bhi hota hai jisme sab information encrypted hoti hai.\n\n<strong>Kyun Zaroori Hai?</strong>\n\nRajasthan ki lagbhag sabhi welfare schemes ke liye Jan Aadhaar compulsory hai. Hospital mein Chiranjeevi treatment ke liye bhi Jan Aadhaar chahiye. Scholarship ke liye, ration card ke liye aur doosre sarkari faayde ke liye bhi zaruri hai.\n\n<strong>Online Apply Kaise Karein?</strong>\n\njanaadhaar.rajasthan.gov.in par jaayein. Citizen Registration par click karein. Mobile number se OTP verify karein. Family head ki details bharein. Family members add karein. Submit karein aur enrollment number note karein.\n\n<strong>Card Download Kaise Karein?</strong>\n\nSSO.Rajasthan.gov.in par login karein. Jan Aadhaar section mein jaayein. Download option se card download karein.\n\n<strong>Jan Aadhaar mein Correction Kaise Karein?</strong>\n\nAgar naam ya koi detail galat hai toh janaadhaar.rajasthan.gov.in par correction request submit karein. Supporting documents saath upload karein. Correction 15-30 din mein ho jaata hai.\n\n<strong>Jan Aadhaar Card Lost Ho Jaaye Toh?</strong>\n\nDobara download kar sakte hain SSO portal se. Enrollment number yaad hona chahiye ya registered mobile number se login karein.\n\n<strong>Jan Aadhaar se Kaunsi Schemes?</strong>\n\nChiranjeevi Swasthya Bima Yojana, Palanhar Yojana, Free Mobile Yojana, scholarship schemes, ration card — rajasthan ki lagbhag sabhi welfare schemes ke liye Jan Aadhaar compulsory hai. Isliye ise safe rakhein.","notification":"Jan Aadhaar Card Rajasthan Official","importantDates":[{"label":"Service Available","value":"24x7 Online","highlight":false},{"label":"Registration","value":"Year Round","highlight":true}],"fees":["Apply karna: Free","Card: Free"],"documents":["Aadhaar Card (All family members ka)","Mobile Number","Passport Size Photo","Bank Details"],"eligibility":[{"class":"Jan Aadhaar","age":"Koi age limit nahi","category":"All Rajasthan Families","residence":"Rajasthan"}],"howToApply":[{"title":"janaadhaar.rajasthan.gov.in par jaayein","detail":"Jan Aadhaar official portal open karein"},{"title":"Citizen Registration chunein","detail":"New registration ka option select karein"},{"title":"Mobile OTP verify karein","detail":"Registered mobile se OTP verify karein"},{"title":"Family head details bharein","detail":"Mukhiya ki personal details bharein"},{"title":"Family members add karein","detail":"Sabhi members ka Aadhaar number add karein"},{"title":"Submit karein","detail":"Form submit karo aur enrollment number note karo"},{"title":"Card download karein","detail":"SSO portal se Jan Aadhaar card download karein"}],"importantLinks":[{"label":"Jan Aadhaar Portal","url":"https://janaadhaar.rajasthan.gov.in","text":"Apply Online"},{"label":"SSO Login","url":"https://sso.rajasthan.gov.in","text":"Download Card"}],"highlights":{"postName":"Jan Aadhaar Card Rajasthan","vacancy":"Family ID Card","domicile":"Rajasthan","ageLimit":"Koi age limit nahi","applyDate":"Year Round","documents":"Aadhaar | Mobile Number | Photo","department":"Government of Rajasthan"},"keywords":["Jan Aadhaar Card Rajasthan 2026","Jan Aadhaar Apply Online","Jan Aadhaar Download","Rajasthan Family ID","Jan Aadhaar Chiranjeevi"]},{"id":"raj-mobile-2026","title":"Rajasthan Free Mobile Yojana 2026 – Indira Gandhi Free Smartphone Yojana Update","category":"Schemes","lastUpdate":"10/03/2026 | 10:00 AM","description":"Rajasthan sarkar ne Indira Gandhi Free Smartphone Yojana ke tahat state ki mahilaon ko free smartphone dene ka prayas kiya tha. Is yojana ke tahat chiranjeevi parivaaron ki mahila head ya class 9 se 12th mein padhne wali chhatrao ko smartphone diye gaye the. Ab 2026 mein is yojana ki aage ki installment ka intzaar hai.\n\n<strong>Yojana Kya Thi?</strong>\n\nIndira Gandhi Free Smartphone Yojana mein smartphone ke saath ek saal ka free internet data bhi diya gaya tha. Iska maksad tha digital divide ko kam karna aur mahilaon ko digital services se connect karna.\n\n<strong>Kaun Eligible Tha?</strong>\n\nChiranjeevi parivaaron ki mahila mukhiya. Class 9 se 12th ya college mein padhne wali chhatrayein. NREGS mein kaam karne wali mahilayen. Vidhwa aur deserted mahilayen.\n\n<strong>2026 Mein Kya Hoga?</strong>\n\nNayi government ke aane ke baad is yojana ke baare mein official update aana baaki hai. Agar aap eligible hain toh nazdiki e-Mitra kendra par jaayein ya official Rajasthan government portal check karte rahein.\n\n<strong>Phone Mein Kya Kya Milta Hai?</strong>\n\nSmartphone ke saath pehle saal ka internet data free milta tha. Kuch cases mein sim card bhi diya gaya. Phone ki cost sarkar ne bear ki.\n\n<strong>2026 Mein Kya Expect Karein?</strong>\n\nRajasthan mein nayi government hai aur is yojana ki status abhi clear nahi hai. Official announcement ka intzaar karein. Sarkari website check karte rahein ya nazdiki e-Mitra se jaankari lein.\n\n<strong>Purana Phone Mila Tha Toh Dobara Milega?</strong>\n\nJis mahila ko pehle phone mila tha woh dobara eligible nahi hogi usi yojana mein. Lekin agar nayi phase aati hai to naye terms hoge. Official notification ka intzaar karein.","notification":"Indira Gandhi Free Smartphone Yojana Rajasthan Official","importantDates":[{"label":"Pehli Phase","value":"2023-24 mein aayi thi","highlight":false},{"label":"2026 Update","value":"Jald aayega","highlight":true}],"fees":["Free hai"],"documents":["Jan Aadhaar Card","Chiranjeevi Card","College/School ID (Students ke liye)","Aadhaar Card"],"eligibility":[{"class":"Free Smartphone","age":"18+ Mahila (ya student)","category":"Chiranjeevi Family Women / Students Class 9-12","residence":"Rajasthan"}],"howToApply":[{"title":"Nazdiki e-Mitra par jaayein","detail":"Ya official Rajasthan portal check karein"},{"title":"Eligibility check karein","detail":"Jan Aadhaar se eligibility verify karein"},{"title":"Camp date check karein","detail":"Apne area ke distribution camp ki date note karein"},{"title":"Documents lekar jaayein","detail":"Jan Aadhaar, Aadhaar aur relevant documents saath lein"},{"title":"Smartphone lein","detail":"Verification ke baad free smartphone milega"}],"importantLinks":[{"label":"Official Portal","url":"https://igsy.rajasthan.gov.in","text":"IGSY Portal Rajasthan"}],"highlights":{"postName":"Indira Gandhi Free Smartphone Yojana Rajasthan","vacancy":"Free Smartphone + 1 Year Internet","domicile":"Rajasthan","ageLimit":"18+ Mahila / Students","applyDate":"Camp wise distribution","documents":"Jan Aadhaar | Chiranjeevi Card | Aadhaar","department":"Department of Information Technology, Rajasthan"},"keywords":["Rajasthan Free Mobile 2026","Indira Gandhi Smartphone Yojana","Free Phone Rajasthan","IGSY Rajasthan","Rajasthan Mahila Free Mobile"]},{"id":"nib-recruitment-2026","title":"NIB Bharti 2026 – Scientist, Junior Scientist aur 46 Posts ke liye Online Apply Karein","category":"Jobs","lastUpdate":"24/03/2026 | 10:00 AM","description":"National Institute of Biologicals yaani NIB ek pradhan sarkari sanstha hai jo Ministry of Health & Family Welfare ke under kaam karti hai. NIB Noida, Uttar Pradesh mein sthit hai aur yeh biological products ki quality testing, standardization aur research mein kaam karti hai. Agar aap science field mein career banana chahte hain toh NIB Bharti 2026 ek bahut achha mauka hai. Kul 46 posts ke liye notification jari ki gayi hai.\n\n<strong>NIB Bharti 2026 – Kya Hai Yeh Naukri?</strong>\n\nNIB mein alag alag posts ke liye application maangi gayi hain. Scientist Grade-II ke 2 posts hain jo sabse senior post hai isme salary bhi sabse zyada milti hai. Scientist Grade-III Veterinary ke 1 post hai jo veterinary science background walon ke liye hai. Junior Scientist ke 12 posts hain jo Master's degree walon ke liye ek excellent opportunity hai. Laboratory Technician ke 25 posts hain jo sabse zyada hain aur Biology background wale apply kar sakte hain. Iske alawa Administrative Assistant ka 1 post, Junior Hindi Translator ka 1 post aur Assistant-II ke 2 posts bhi hain.\n\n<strong>Salary Kitni Milegi?</strong>\n\nNIB mein salary central government pay matrix ke hisaab se milti hai. Scientist Grade-II ko 78800 se 209200 rupaye per month milenge jo ek bahut hi attractive salary hai. Scientist Grade-III Veterinary ko 56100 se 177500 rupaye milenge. Junior Scientist ko 44900 se 142400 rupaye milenge. Administrative Assistant, Junior Hindi Translator aur Laboratory Technician ko 35400 se 112400 rupaye milenge. Assistant-II ko 19900 se 63200 rupaye milenge. In salaries ke saath central government ke allowances jaise HRA, TA, DA bhi milenge jo overall package aur bhi behtar bana deta hai.\n\n<strong>Eligibility – Kaun Apply Kar Sakta Hai?</strong>\n\nHar post ke liye alag alag qualification chahiye. Scientist Grade-II ke liye MBBS ya PG Medical degree plus 5 saal experience chahiye ya Master's degree plus 7 saal experience ya PhD plus 3 saal experience. Junior Scientist ke liye Master's degree relevant field mein plus 1 saal experience zaroori hai. Laboratory Technician ke liye B.Sc Biology ya B.Sc Microbiology/Biotechnology/Biochemistry hona chahiye saath mein DMLT diploma ya B.Sc Medical Lab Technology plus 1 saal experience. Assistant-II ke liye 12th pass with 50% marks aur computer typing speed 35 words per minute English ya 30 words per minute Hindi mein zaroori hai.\n\n<strong>Age Limit Kya Hai?</strong>\n\nScientist Grade-II ke liye maximum age 45 saal hai. Scientist Grade-III Veterinary ke liye 35 saal. Junior Scientist, Administrative Assistant, Junior Hindi Translator aur Laboratory Technician ke liye maximum 30 saal. Assistant-II ke liye maximum 27 saal. SC/ST/OBC aur government employees ke liye age mein chhoot milegi Government of India ke niyamon ke hisaab se.\n\n<strong>Chunav Prakriya – Selection Process Kya Hai?</strong>\n\nNIB Bharti 2026 mein selection teen stages mein hogi. Pehle Computer Based Examination hogi jo objective type multiple choice format mein hogi. CBT pass karne ke baad Personal Discussion hogi jisme aapki communication skills aur subject knowledge test ki jaayegi. Administrative Assistant aur Assistant-II ke posts ke liye Skill Test bhi hogi jisme typing test shamil hai. Junior Hindi Translator ke liye Open Competitive Examination hogi jisme Paper-I aur Paper-II dono dene honge.\n\n<strong>Application Process – Kaise Apply Karein?</strong>\n\nNIB Bharti 2026 mein apply karne ki process poori tarah online hai. Sirf online application accept ki jaayegi. Application start date 9 March 2026 hai aur last date 8 April 2026 hai toh jaldi apply karein. nib.gov.in official website par jaayein aur application form fill karein. Sahi personal aur educational details bharein. Photo, signature aur certificates required format mein upload karein. Form submit karne ke baad application ka printout zaroor lein. Online application ke saath saath hard copy bhi 8 April 2026 tak bhejni hogi. North-Eastern Region ke candidates ke liye bhi last date same hai. Agar application mein koi galat jaankari di ya koi important cheez chhupa li toh service se terminated kiya ja sakta hai isliye sab sahi sahi bharein.\n\n<strong>Zaroori Tips – Apply Karne Se Pehle Yeh Jaroor Karein?</strong>\n\nPehle official notification PDF download karein nib.gov.in se aur poori tarah padhen. Apni eligibility achhi tarah check karein. Documents ready rakhein jaise certificates, marksheets, experience letters. Photo aur signature prescribed size mein scan karein. Application fee agar laagu ho toh online pay karein. Last date ka intzaar na karein – aaj hi apply karein kyunki server pe load badh jaata hai last date ke paas.","notification":"NIB Various Posts Recruitment 2026 – Official Notification","importantDates":[{"label":"Notification Date","value":"09 March 2026","highlight":false},{"label":"Application Start","value":"09 March 2026","highlight":false},{"label":"Last Date Apply Online","value":"08 April 2026","highlight":true},{"label":"Hard Copy Last Date","value":"08 April 2026","highlight":true}],"fees":["Official notification mein application fee ka ullekh nahi – check karein nib.gov.in par"],"documents":["Aadhaar Card","10th/12th Certificate", an Govt Job","NIB Noida Jobs 2026","Science Jobs Central Government"]},{"id":"hprca-math-teacher-admit-2026","title":"HPRCA Mathematics Teacher Admit Card 2026 – Download Kaise Karein, Exam 26 March","category":"Education","lastUpdate":"24/03/2026 | 09:00 AM","description":"Himachal Pradesh ke Mathematics Teacher banne ka sapna dekhne wale candidates ke liye ek important update hai. Himachal Pradesh Rajya Chayan Aayog yaani HPRCA ne Mathematics Teacher Post Code-26003 ke liye admit card jari kar diya hai. Admit card 20 March 2026 ko official website hprca.hp.gov.in par upload ho gaya hai. Likhi pariksha yaani written exam 26 March 2026 ko Computer Based Test format mein hongi.\n\n<strong>HPRCA Mathematics Teacher Exam Kya Hai?</strong>\n\nHPRCA Himachal Pradesh ki state recruitment agency hai jo state government ke departments ke liye teachers aur doosre posts par bharti karti hai. Mathematics Teacher Post Code-26003 ke liye jo candidates ne pehle apply kiya tha unhi ke liye admit card jari hua hai. Yeh exam Computer Based Test mode mein hogi matlab computer par online exam dena hoga designated exam centers par. HP ke alag alag districts mein exam centers banaye gaye hain.\n\n<strong>Admit Card Mein Kya Kya Hota Hai?</strong>\n\nHPRCA Mathematics Teacher Admit Card 2026 mein candidate ki poori jaankari hogi. Candidate ka naam, pita ka naam, janm tithi, category aur gender clearly likha hoga. Application number ya roll number admit card par hoga. Candidate ki photo aur signature bhi hogi jisse exam center par identity verification hogi. Exam ki date yaani 26 March 2026 clearly mention hogi. Exam shift aur reporting time bhi hoga toh time se pahuncho. Exam center ka naam aur poora address admit card par hoga – pehle se check karke rasto ki planning karein. Important instructions bhi mention honge jaise kya laana hai aur kya nahi.\n\n<strong>Admit Card Download Kaise Karein?</strong>\n\nHPRCA Mathematics Teacher Admit Card download karna bahut simple hai. Pehle official website hprca.hp.gov.in kholo. Homepage par Latest ya Admit Card section mein jaao. Mathematics Teacher Post Code-26003 ka admit card link dhundho aur click karo. Login page aayega jahan application number, date of birth ya password dalna hoga. SSO login bhi available hai HP residents ke liye. Submit ya Download button dabao. Admit card screen par aa jaayega – PDF download karo. 2-3 printouts nikalo – ek backup ke liye rakhna zaroori hai.\n\n<strong>Exam Center Par Kya Kya Lekar Jaayein?</strong>\n\nExam mein jaate waqt kuch zaroori cheezein saath leni hongi. Sabse pehle HPRCA Mathematics Teacher Admit Card 2026 ka printout – bina iske entry nahi milegi. Ek valid photo ID proof original mein lena zaroori hai – Aadhaar Card, Voter ID, Driving License, PAN Card ya Passport mein se koi ek. Do passport size photographs bhi saath lein jo application form mein upload ki thi waisi hi. Yeh cheezein original mein honi chahiye – photocopy ya mobile mein dikhaana accept nahi hoga.\n\n<strong>Kya Nahi Le Jaana Exam Mein?</strong>\n\nExam hall mein kuch cheezein bilkul allowed nahi hain. Mobile phone ya koi bhi smartphone exam hall mein nahi le ja sakte. Smartwatch ya digital watch bhi banned hain – sirf simple analog watch le ja sakte hain. Calculator ya koi bhi electronic device allowed nahi hai jab tak notification mein specifically allowed na kaha gaya ho. Books, notes ya koi bhi study material nahi le ja sakte. Bags aur pouches bahar chhod dein exam center par lockers available hote hain usually.\n\n<strong>Exam Ke Din Ki Taiyari Kaise Karein?</strong>\n\nExam ke ek din pehle hi exam center ka location Google Maps par dhundh lo aur route plan kar lo. Subah jaldi uthao aur exam center par reporting time se kam se kam 45-60 minute pehle pahuncho. Late entry allow nahi hogi isliye punctuality bahut zaroori hai. Sab documents organize karke raat ko hi bag mein rakh do. Exam mein time management bahut important hai – agar koi question mushkil lage toh skip karo aur baad mein wapas aao. Ghabrao mat – apni best dene ki koshish karo.\n\n<strong>Admit Card Download Mein Problem Aaye Toh Kya Karein?</strong>\n\nKuch candidates ko admit card download karne mein dikkat aa sakti hai. Agar website slow ho toh browser cache clear karo aur dobara try karo. Alag browser jaise Chrome, Firefox ya Edge mein try karo. Agar application number ya password yaad nahi toh forgot password option use karo. Agar phir bhi problem aaye toh HPRCA helpdesk se contact karo – website par contact details available hain. Exam se kam se kam 2 din pehle problem solve kar lo – last minute mein pareshani badh jaati hai.","notification":"HPRCA Mathematics Teacher Admit Card 2026 – Official","importantDates":[{"label":"Admit Card Jari","value":"20 March 2026","highlight":false},{"label":"Exam Date","value":"26 March 2026","highlight":true},{"label":"Result (Expected)","value":"Baad mein announce hoga","highlight":false}],"fees":["Koi fee nahi – admit card free mein download hoga"],"documents":["Admit Card Printout (Mandatory)","Aadhaar / Voter ID / PAN / Passport (Original)","2 Passport Size Photos"],"eligibility":[{"class":"Mathematics Teacher (Post Code-26003)","age":"As per HPRCA notification","category":"Applied candidates only","residence":"Himachal Pradesh"}],"howToApply":[{"title":"hprca.hp.gov.in kholo","detail":"Official HPRCA website open karo"},{"title":"Admit Card section mein jaao","detail":"Latest ya Admit Card link dhundho"},{"title":"Post Code-26003 link click karo","detail":"Mathematics Teacher admit card link select karo"},{"title":"Login karein","detail":"Application number aur date of birth ya password daalo"},{"title":"Download karein","detail":"Admit card PDF download karo"},{"title":"Printout nikalo","detail":"2-3 printouts nikalo exam ke liye"}],"importantLinks":[{"label":"Download Admit Card","url":"https://hprca.hp.gov.in","text":"hprca.hp.gov.in"},{"label":"Official Website","url":"https://hprca.hp.gov.in","text":"HPRCA Official Portal"}],"highligh gories ke candidates ke liye application fee sirf 100 rupaye hai jo bahut kam hai. SC, ST, PwBD aur Women candidates ke liye koi fee nahi — bilkul free hai. Payment online mode mein hogi — Debit Card, Credit Card, Internet Banking, IMPS ya Mobile Wallet se payment kar sakte hain.\n\n<strong>Selection Process Kya Hai?</strong>\n\nRRC WR Apprentice Bharti 2026 mein selection Merit List ke basis par hoga. Koi written exam nahi hogi. 10th ke marks aur ITI ke marks ke basis par merit list banegi. Isliye jo students 10th mein achhe marks laaye hain unhe zyada chance milega. Merit list baad mein official website par jari ki jaayegi.\n\n<strong>Apply Kaise Karein?</strong>\n\nOnline apply karna hoga official website rrcwr.indianrailways.gov.in par. Registration karein apna naam, mobile number aur email daalo. Login karke application form fill karein. Personal details, educational qualification aur ITI trade ki details bharein. Required documents upload karein — photo, signature, 10th marksheet aur ITI certificate. Application fee online pay karein. Form submit karne ke baad printout zaroor lein reference ke liye.","notification":"RRC WR Apprentice Recruitment 2026 — Advt. No. RRC/WR/04/2025","importantDates":[{"label":"Application Start","value":"21 February 2026","highlight":false},{"label":"Last Date Apply","value":"23 March 2026","highlight":true},{"label":"Fee Payment Last Date","value":"23 March 2026","highlight":true},{"label":"Merit List","value":"Baad mein announce hogi","highlight":false}],"fees":["General / OBC / EWS: Rs. 100/-","SC / ST / PwBD / Women: Free","Payment: Online (Debit/Credit Card, Net Banking, UPI)"],"documents":["Aadhaar Card","10th Marksheet (50%+ marks)","ITI Certificate (Relevant Trade)","Caste Certificate (if applicable)","Passport Size Photo","Signature"],"eligibility":[{"class":"Apprentice","age":"15 to 24 Years","category":"10th Pass 50%+ Marks + ITI Certificate","residence":"All India"}],"howToApply":[{"title":"Official website kholo","deta
