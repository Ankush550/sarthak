<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="pageTitle">Job Detail – SarthakYojana</title>
<meta name="description" id="pageDesc" content="Complete job details, eligibility, vacancies, salary and apply link.">
<link id="canonicalTag" rel="canonical" href="https://sarthakyojana.in/pages/job-detail.html">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div id="site-header"></div>
<div id="ticker-wrap"></div>
<div class="breadcrumb"><div class="breadcrumb-inner" id="bc"><a href="../index.html">Home</a> &rsaquo; Job Detail</div></div>

<div class="center">
  <div id="job-content"><p style="padding:30px;text-align:center;color:#888;">Loading...</p></div>

  <div class="content-section" id="job-about" style="display:none;">
    <h2 id="about-h2"></h2>
    <div id="about-body"></div>
  </div>

  <div class="sec-box" style="margin-top:10px;">
    <div class="sec-hdr"><h2>Similar / Related Jobs</h2></div>
    <ul class="sec-list" id="similarJobs"></ul>
  </div>
</div>

<div id="site-footer"></div>
<script src="../assets/jobs-data.js"></script>
<script src="../assets/main.js"></script>
<script>
renderHeader('Latest Job');
renderTicker();
renderFooter();

const id = new URLSearchParams(window.location.search).get('id');
document.getElementById('canonicalTag').href = 'https://sarthakyojana.in/pages/job-detail.html?id=' + (id||'');

const all = [...JOBS_DATA, ...PRIVATE_JOBS_DATA, ...RESULTS_DATA, ...ADMIT_CARDS_DATA, ...ANSWER_KEYS_DATA];
const job = all.find(j => j.id === id);

if (!job) {
  document.getElementById('job-content').innerHTML = '<p style="padding:30px;text-align:center;color:#c0392b;">Job not found. <a href="../pages/jobs.html">View All Jobs</a></p>';
} else {
  document.title = job.title + ' – ' + job.organization + ' | SarthakYojana';
  document.getElementById('pageDesc').content = job.description || job.title + ' recruitment 2026. Check vacancies, eligibility and apply online.';
  document.getElementById('bc').innerHTML = `<a href="../index.html">Home</a> &rsaquo; <a href="jobs.html">Jobs</a> &rsaquo; ${job.title}`;

  // Schema
  if (JOBS_DATA.find(j=>j.id===id)) {
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.text = JSON.stringify(buildJobSchema(job));
    document.head.appendChild(s);
  }

  const daysLeft = (d)=>{
    const diff = Math.ceil((new Date(d.split(' ').reverse().join('-')) - new Date()) / 86400000);
    return diff > 0 ? diff + ' days left' : 'Expired';
  };

  document.getElementById('job-content').innerHTML = `
    <div class="jd-box">
      <div class="jd-title-bar"><h1>${job.title} – ${job.organization} Recruitment 2026</h1></div>
      <div class="jd-body">
        <table class="jd-meta">
          <tr><td>Organization</td><td>${job.organization}</td></tr>
          <tr><td>Post Name</td><td>${job.title}</td></tr>
          ${job.totalVacancies?`<tr><td>Total Vacancies</td><td><strong style="color:#c0392b;">${job.totalVacancies}</strong></td></tr>`:''}
          ${job.qualification?`<tr><td>Qualification</td><td>${job.qualification}</td></tr>`:''}
          ${job.ageLimit?`<tr><td>Age Limit</td><td>${job.ageLimit}</td></tr>`:''}
          ${job.salaryMin?`<tr><td>Pay Scale</td><td>₹${job.salaryMin.toLocaleString()} – ₹${job.salaryMax.toLocaleString()} per month</td></tr>`:''}
          ${job.location?`<tr><td>Location</td><td>${job.location}</td></tr>`:''}
          ${job.employmentType?`<tr><td>Employment Type</td><td>${job.employmentType}</td></tr>`:''}
          ${job.lastDate?`<tr><td>Last Date to Apply</td><td><strong style="color:#c0392b;">${job.lastDate}</strong></td></tr>`:''}
          ${job.examDate?`<tr><td>Exam / Interview Date</td><td>${job.examDate}</td></tr>`:''}
          ${job.status?`<tr><td>Application Status</td><td><span class="badge-${job.status==='open'?'open':job.status==='closing_soon'?'soon':'closed'}">${job.status==='open'?'Open Now':job.status==='closing_soon'?'Closing Soon':'Closed'}</span></td></tr>`:''}
        </table>

        ${job.description?`<h2 style="font-size:14px;color:#c0392b;margin-bottom:8px;border-bottom:1px solid #eee;padding-bottom:5px;">About This Recruitment</h2><p style="font-size:12.5px;color:#444;line-height:1.75;margin-bottom:12px;">${job.description}</p>`:''}

        ${job.importantDates?`<h2 style="font-size:14px;color:#c0392b;margin-bottom:8px;border-bottom:1px solid #eee;padding-bottom:5px;">Important Dates</h2>
        <table class="jd-meta" style="margin-bottom:12px;">
          ${Object.entries(job.importantDates).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
        </table>`:''}

        ${job.applicationFee?`<h2 style="font-size:14px;color:#c0392b;margin-bottom:8px;border-bottom:1px solid #eee;padding-bottom:5px;">Application Fee</h2>
        <table class="jd-meta" style="margin-bottom:12px;">
          ${Object.entries(job.applicationFee).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
        </table>`:''}

        <div class="apply-box">
          <h3>Apply Online – ${job.title}</h3>
          <p style="font-size:12px;color:#666;margin-bottom:10px;">Last Date: <strong style="color:#c0392b;">${job.lastDate||'N/A'}</strong> &nbsp;|&nbsp; Status: <strong>${job.status==='open'?'Open Now':'Check Official Site'}</strong></p>
          ${job.applyLink?`<a href="${job.applyLink}" class="apply-btn-main" target="_blank" rel="nofollow noopener">Apply Online &rarr;</a>
          <br><br><a href="${job.officialWebsite||job.applyLink}" target="_blank" rel="nofollow noopener" style="font-size:12px;color:#666;">Official Website</a>`:'<p style="color:#888;font-size:12px;">Application link not available yet. Check back soon.</p>'}
        </div>

        <p style="font-size:11px;color:#999;margin-top:10px;font-style:italic;">Disclaimer: SarthakYojana.in is not the official recruitment agency. Always verify details from the official website before applying. We are not responsible for any errors in recruitment information.</p>
      </div>
    </div>`;

  // About section
  const aboutEl = document.getElementById('job-about');
  aboutEl.style.display = 'block';
  document.getElementById('about-h2').textContent = 'About ' + job.organization + ' Recruitment 2026';
  document.getElementById('about-body').innerHTML = `
    <p>${job.organization} has released an official recruitment notification for the post of <strong>${job.title}</strong>. Eligible candidates can apply online through the official website before the last date.</p>
    <h3>Selection Process</h3>
    <p>The selection will be done through Written Exam / CBT, Physical Test (if applicable), and Document Verification.</p>
    <h3>How to Apply</h3>
    <ul>
      <li>Visit the official website of ${job.organization}</li>
      <li>Click on the Apply Online link for ${job.title} recruitment</li>
      <li>Register with your valid email ID and mobile number</li>
      <li>Fill the application form with correct details</li>
      <li>Upload required documents and photograph</li>
      <li>Pay the application fee if applicable</li>
      <li>Submit and take a printout for future reference</li>
    </ul>`;

  // Similar jobs
  const sim = JOBS_DATA.filter(j=>j.id!==id).slice(0,8);
  document.getElementById('similarJobs').innerHTML = sim.map(j=>
    `<li><a href="job-detail.html?id=${j.id}">${j.title} – ${j.organization} (${j.totalVacancies||'N/A'} Posts)</a></li>`
  ).join('');
}
</script>
</body>
</html>
