ing, operations aur technical management ka kaam milega. Finance Stream mein CA ya CMA qualified candidates ko financial management aur accounts ka kaam milega. BSNL ki naukri government naukri hoti hai jisme achha salary aur benefits milte hain.\n\n<strong>Vacancy Details — Kitni Posts Hain?</strong>\n\nSenior Executive Trainee Telecom Stream ke liye 95 posts hain. Iske liye B.E. ya B.Tech Electronics, Telecommunication, Computer Science, IT, Electrical ya Instrumentation Engineering mein minimum 60% marks hone chahiye. Senior Executive Trainee Finance Stream ke liye 25 posts hain. Iske liye Chartered Accountant yaani CA ya Cost and Management Accountancy yaani CMA qualification honi chahiye.\n\n<strong>Age Limit Kya Hai?</strong>\n\nMinimum age 21 saal aur maximum age 30 saal hai 7 March 2026 ki date ke hisaab se General, EWS aur OBC CL candidates ke liye. OBC NCL candidates ke liye maximum age 33 saal hai. SC aur ST candidates ke liye maximum age 35 saal hai. BSNL niyamon ke hisaab se age relaxation milegi reserved categories ko.\n\n<strong>Application Fee Kitni Hai?</strong>\n\nGeneral, OBC aur EWS categories ke liye application fee 2500 rupaye hai. SC, ST aur PwBD candidates ke liye 1250 rupaye ki fee lagegi. Payment online mode se hogi — Debit Card, Credit Card, Internet Banking, IMPS ya Mobile Wallet se payment kar sakte hain.\n\n<strong>Selection Process Kya Hoga?</strong>\n\nBSNL SET Bharti 2026 mein selection Written Exam aur Merit List ke basis par hoga. Written exam ki date baad mein announce hogi. Exam qualify karne ke baad merit list banegi. Merit list mein selected candidates ko interview ya document verification ke liye bulaya jaayega. Final selection merit ke hisaab se hogi.\n\n<strong>Apply Kaise Karein?</strong>\n\nBSNL ki official website bsnl.co.in par jaayein aur recruitment section mein SET 2026 ka link dhundhein. Pehle registration karein apna naam, email aur mobile number daalo. Login karke application form sahi sahi bharein. Educational qualification aur personal details daalen. Required documents upload karein — photo, signature aur degree certificate. Application fee online pay karein. Submit karne ke baad printout zaroor lein. Last date 15 April 2026 hai — aur correction 16 se 23 April 2026 tak ho sakti hai.","notification":"BSNL SET Recruitment 2026 — Advt. No. BSNLCO-11/12(11)/1/2025-RECTT-CO-Part (1)","importantDates":[{"label":"Application Start","value":"05 February 2026","highlight":false},{"label":"Last Date Apply","value":"15 April 2026 (Extended)","highlight":true},{"label":"Fee Payment Last Date","value":"15 April 2026","highlight":true},{"label":"Correction Date","value":"16 – 23 April 2026","highlight":false},{"label":"Exam Date","value":"Baad mein announce hogi","highlight":false}],"fees":["General / OBC / EWS: Rs. 2500/-","SC / ST / PwBD: Rs. 1250/-","Payment: Online (Debit/Credit Card, Net Banking, UPI)"],"documents":["Aadhaar Card","B.E./B.Tech Degree Certificate (60%+ marks)","CA / CMA Certificate (Finance Stream)","Caste Certificate (if applicable)","Passport Size Photo","Signature"],"eligibility":[{"class":"SET Telecom Stream","age":"21 to 30 Years","category":"B.E./B.Tech (Electronics/CS/IT/Electrical) 60%+ marks","residence":"All India"},{"class":"SET Finance Stream","age":"21 to 30 Years","category":"CA (Chartered Accountant) ya CMA","residence":"All India"}],"howToApply":[{"title":"bsnl.co.in par jaayein","detail":"Official BSNL website open karein"},{"title":"Recruitment section dhundhein","detail":"SET 2026 application link par click karein"},{"title":"Registration karein","detail":"Naam, email aur mobile se account banao"},{"title":"Form bharein","detail":"Personal aur educational details sahi bharein"},{"title":"Documents upload karein","detail":"Photo, signature aur degree certificate upload karein"},{"title":"Fee pay karein","detail":"Rs. 2500 ya Rs. 1250 online pay karein"},{"title":"Submit karein","detail":"Preview ke baad final submit karo"},{"title":"Printout lo","detail":"Application ka printout zaroor nikaalo"}],"importantLinks":[{"label":"Apply Online","url":"https://bsnl.co.in/en","text":"BSNL Official Website"},{"label":"Official Notification","url":"https://bsnl.co.in/en","text":"Download Notification PDF"}],"highlights":{"postName":"Senior Executive Trainee (Telecom & Finance Stream)","vacancy":"120 Posts","domicile":"All India","ageLimit":"21 to 30 Years (Category wise)","applyDate":"05 Feb to 15 Apr 2026","documents":"B.E./B.Tech Degree | CA/CMA Certificate | Aadhaar | Photo","department":"Bharat Sanchar Nigam Limited (BSNL)"},"keywords":["BSNL SET Recruitment 2026","BSNL Senior Executive Trainee","BSNL Telecom Job 2026","BSNL Finance Stream Vacancy","Government Telecom Job 2026"]},{"id":"bihar-iti-cat-2026","title":"Bihar ITI CAT Admission Form 2026 – 33108 Seats ke liye Apply Karein","category":"Education","lastUpdate":"24/03/2026 | 02:00 PM","description":"Bihar Combined Entrance Competitive Examination Board yaani BCECEB ne Industrial Training Institute Competitive Admission Test yaani ITI CAT 2026 ka notification jari kiya hai. Bihar ke jo students 10th ke baad ITI course mein admission lena chahte hain unke liye yeh ek suhana mauka hai. Is saal 33,108 seats available hain aur last date 14 April 2026 hai.\n\n<strong>Bihar ITI CAT 2026 — Kya Hai Yeh Exam?</strong>\n\nITI yaani Industrial Training Institute mein alag alag technical trades mein 1-2 saal ke courses hote hain. Electrician, Fitter, Welder, Mechanic, Plumber, Stenographer jaise trades mein training milti hai. ITI karne ke baad government aur private sector dono mein naukri ke achhe chances milte hain. Bihar ITI CAT ek entrance exam hai jiske basis par Bihar ke ITI colleges mein admission milta hai. 33,108 seats bahut zyada hain matlab competition thoda kam hai.\n\n<strong>Eligibility — Kaun Apply Kar Sakta Hai?</strong>\n\nBihar ITI CAT 2026 ke liye 10th pass ya 10th mein appearing students apply kar sakte hain kisi bhi recognized board se. Age limit minimum 14 saal hai. MMT yaani Mechanic Motor Vehicle aur MT yaani Mechanic Tractor trades ke liye minimum age 17 saal hai. Maximum age ki koi limit nahi hai toh koi bhi eligible students apply kar sakte hain.\n\n<strong>Application Fee Kitni Hai?</strong>\n\nGeneral, EBC aur OBC candidates ke liye fee 750 rupaye hai. SC aur ST candidates ke liye sirf 100 rupaye ki fee lagegi jo bahut kam hai. PH yaani Physically Handicapped candidates ke liye 430 rupaye ki fee hai. Payment online mode se hogi — Debit Card, Credit Card, Net Banking, IMPS ya Mobile Wallet se payment kar sakte hain.\n\n<strong>Exam Schedule Kya Hai?</strong>\n\nOnline application 16 March 2026 se shuru ho gayi hai aur last date 14 April 2026 hai. Fee payment 15 April 2026 tak ho sakti hai. Correction window 16-17 April 2026 ko milegi agar koi galti ho. Admit Card 8 May 2026 ko jari hoga. Entrance Exam 17 May 2026 ko hogi. Result baad mein announce kiya jaayega.\n\n<strong>Selection Process Kya Hai?</strong>\n\nBihar ITI CAT 2026 mein Entrance Exam ke basis par selection hoga. Entrance exam mein Mathematics, Science aur General Knowledge se questions aayenge. Exam qualify karne ke baad merit list banegi. Merit list ke hisaab se ITI college aur trade allot ki jaayegi. Jitne achhe marks aayenge utna achha ITI college milega.\n\n<strong>Apply Kaise Karein?</strong>\n\nBCECEB ki official website bceceboard.bihar.gov.in par jaayein. Bihar ITI CAT 2026 ka link dhundhein aur click karein. Naya registration karein — naam, mobile number aur email se account banao. Form mein personal aur educational details sahi bharein. Photo aur signature prescribed format mein upload karein. Application fee online pay karein. Submit karne ke baad confirmation page ka printout zaroor lein. Admit card 8 May 2026 ko official website se download karna hoga.","notification":"Bihar ITI CAT 2026 — BCECEB Official Notification","importantDates":[{"label":"Application Start","value":"16 March 2026","highlight":false},{"label":"Last Date Apply","value":"14 April 2026","highlight":true},{"label":"Fee Payment Last Date","value":"15 April 2026","highlight":true},{"label":"Correction Window","value":"16-17 April 2026","highlight":false},{"label":"Admit Card","value":"08 May 2026","highlight":false},{"label":"Exam Date","value":"17 May 2026","highlight":true}],"fees":["General / EBC / OBC: Rs. 750/-","SC / ST: Rs. 100/-","PH (Divyang): Rs. 430/-","Payment: Online (Debit/Credit Card, Net Banking, UPI)"],"documents":["Aadhaar Card","10th Marksheet ya Appearing Certificate","Caste Certificate (if applicable)","Disability Certificate (PH candidates)","Passport Size Photo","Signature"],"eligibility":[{"class":"Bihar ITI CAT 2026","age":"Min 14 Years (MMT/MT ke liye 17 Years)","category":"10th Pass ya Appearing (Any Recognized Board)","residence":"Bihar"}],"howToApply":[{"title":"bceceboard.bihar.gov.in par jaayein","detail":"BCECEB official website open karein"},{"title":"ITI CAT 2026 link click karein","detail":"Apply Online link par click karein"},{"title":"Registration karein","detail":"Naam, mobile aur email se account banao"},{"title":"Form bharein","detail":"Personal aur educational details sahi bharein"},{"title":"Photo upload karein","detail":"Photo aur signature upload karein"},{"title":"Fee pay karein","detail":"Rs. 750/100/430 online pay karein"},{"title":"Submit karein","detail":"Preview ke baad final submit karo"},{"title":"Admit card download karein","detail":"8 May 2026 ko admit card download karna"}],"importantLinks":[{"label":"Apply Online","url":"http://bceceboard.bihar.gov.in","text":"BCECEB Official Website"},{"label":"Official Notification","url":"http://bceceboard.bihar.gov.in","text":"Download Notification"}],"highlights":{"postName":"Bihar ITI CAT Admission 2026","vacancy":"33,108 Seats","domicile":"Bihar","ageLimit":"Min 14 Years (No Max Limit)","applyDate":"16 Mar to 14 Apr 2026","documents":"10th Certificate | Aadhaar | Photo | Caste Certificate","department":"Bihar Combined Entrance Competitive Examination Board (BCECEB)"},"keywords":["Bihar ITI CAT 2026","Bihar ITI Admission Form","BCECEB ITI 2026","Bihar 10th Pass ITI Course","ITI Entrance Exam Bihar 2026"]},{"id":"ssc-chsl-2026","title":"SSC CHSL Bharti 2026 – 10th aur 12th Pass ke liye Sarkari Naukri Apply Karein","category":"Jobs","lastUpdate":"24/03/2026 | 05:00 PM","description":"Staff Selection Commission yaani SSC ne Combined Higher Secondary Level yaani CHSL 2026 ka notification jari kiya hai. SSC CHSL ek national level exam hai jisme 12th pass candidates apply kar sakte hain. Is bharti mein Lower Division Clerk, Junior Secretariat Assistant, Postal Assistant aur Data Entry Operator jaise posts hain. Ye Central Government ki permanent naukri hai jisme achha career banaya ja sakta hai.\n\n<strong>SSC CHSL 2026 — Posts aur Vacancy</strong>\n\nSSC CHSL mein alag alag posts hain. Lower Division Clerk yaani LDC aur Junior Secretariat Assistant yaani JSA ke posts sabse zyada hain jo ministry aur government offices mein hote hain. Postal Assistant aur Sorting Assistant ke posts Post Offices mein hote hain. Data Entry Operator ke posts various government departments mein hote hain. Total vacancy har saal 3000 se 5000 ke beech hoti hai.\n\n<strong>Eligibility — Kaun Apply Kar Sakta Hai?</strong>\n\nSSC CHSL ke liye 12th pass hona zaroori hai kisi bhi recognized board se. Data Entry Operator ke liye Science stream preferred hai 12th mein. Age limit 18 saal se 27 saal ke beech honi chahiye. OBC candidates ke liye 3 saal aur SC/ST candidates ke liye 5 saal ki age relaxation milegi. Ex-servicemen aur doosre categories ke liye bhi relaxation available hai.\n\n<strong>Selection Process Kya Hai?</strong>\n\nSSC CHSL mein teen stages hain. Tier-1 mein Computer Based Test hoga jisme General Intelligence, English, Quantitative Aptitude aur General Awareness se 100 questions aayenge. Tier-2 mein Computer Based Test hoga jisme English aur Math ke questions honge. Tier-3 mein Typing Test hoga — LDC/JSA ke liye 35 WPM English ya 30 WPM Hindi aur DEO ke liye 8000 key depressions per hour zaroori hai.\n\n<strong>Salary Kitni Milegi?</strong>\n\nLDC aur JSA ke liye pay level 2 milega jisme basic pay 19900 rupaye hai. Postal Assistant aur Sorting Assistant ke liye pay level 4 milega jisme basic pay 25500 rupaye hai. Data Entry Operator ke liye pay level 4 ya 5 milega. In-hand salary allowances ke saath 30000 se 45000 rupaye per month hogi depending on posting location.\n\n<strong>Apply Kaise Karein?</strong>\n\nSSC ki official website ssc.gov.in par jaayein. CHSL 2026 notification download karein aur poori tarah padhen. One Time Registration karein agar pehle se nahi kiya. Login karke CHSL 2026 form fill karein. Photo aur signature upload karein. Application fee Rs. 100 online pay karein — SC/ST/Women/Ex-SM ke liye fee maafi hai. Submit karne ke baad printout zaroor rakhein.","notification":"SSC CHSL 2026 — Official Notification","importantDates":[{"label":"Notification Date","value":"2026","highlight":false},{"label":"Application Start","value":"Notify Later","highlight":false},{"label":"Last Date Apply","value":"Notify Later","highlight":true},{"label":"Tier-1 Exam","value":"Notify Later","highlight":false}],"fees":["General / OBC / EWS: Rs. 100/-","SC / ST / Women / Ex-SM: Free","Payment: Online Mode"],"documents":["Aadhaar Card","12th Marksheet","Caste Certificate (if applicable)","Passport Size Photo","Signature"],"eligibility":[{"class":"LDC / JSA / PA / DEO","age":"18 to 27 Years","category":"12th Pass (Any Stream)","residence":"All India"}],"howToApply":[{"title":"ssc.gov.in par jaayein","detail":"SSC official website open karein"},{"title":"One Time Registration karein","detail":"Agar pehle se nahi kiya toh register karein"},{"title":"Login karein","detail":"Credentials se login karein"},{"title":"CHSL 2026 form bharein","detail":"Sahi details bharein"},{"title":"Documents upload karein","detail":"Photo aur signature upload karein"},{"title":"Fee pay karein"," . Chest male ke liye 81-86 cm hona chahiye.\n\n<strong>Selection Process Kya Hai?</strong>\n\nRajasthan Police Constable 2026 mein selection 4 stages mein hoga. Pehle Written Exam hogi jisme Rajasthan GK, Hindi, English, Math aur Reasoning ke questions aayenge. Written qualify karne ke baad Physical Efficiency Test yaani PET hogi. Phir Physical Standard Test yaani PST mein height aur chest measure hogi. Finally Medical Test hoga.\n\n<strong>Salary Kitni Milegi?</strong>\n\nRajasthan Police Constable ko pay level 5 milega jisme basic pay 14600 rupaye hai. Allowances milane ke baad in-hand salary 25000 se 30000 rupaye per month hogi. Rajasthan police mein regular promotions milte hain. Government quarters, medical facilities aur doosre benefits bhi milte hain.\n\n<strong>Apply Kaise Karein?</strong>\n\nRajasthan Police ki official website police.rajasthan.gov.in ya SSO portal sso.rajasthan.gov.in par jaayein. Constable Bharti 2026 ka link dhundhein. SSO ID se login karein ya naya account banayein. Form mein sahi details bharein. Photo aur signature upload karein. Application fee online pay karein. Submit karne ke baad admit card ka wait karein.","notification":"Rajasthan Police Constable Recruitment 2026 — Official","importantDates":[{"label":"Notification","value":"March 2026","highlight":false},{"label":"Apply Start","value":"April 2026","highlight":false},{"label":"Last Date","value":"April 2026","highlight":true},{"label":"Exam Date","value":"Notify Later","highlight":false}],"fees":["General / OBC: Rs. 400/-","SC / ST / EWS: Rs. 350/-","Payment: Online Mode"],"documents":["Aadhaar Card","10th Marksheet","Rajasthan Domicile Certificate","Caste Certificate (if applicable)","Passport Size Photo","Signature"],"eligibility":[{"class":"Constable GD","age":"18 to 23 Years","category":"10th Pass + Height 168cm (Male) / 152cm (Female)","residence":"Rajasthan"}],"howToApply":[{"title":"sso.rajasthan.gov.in par jaayein","detail":"SSO portal se login karein"},{"title":"Const       'bihar-iti-cat-2026':          'iti+technical+training',
      // Education / Entrance
      'jee-mains-2026':              'engineering+college+india',
      'nta-neet-2026':               'medical+college+india+mbbs',
      'hprca-math-teacher-admit-2026': 'teacher+himachal+india',
      // Schemes / Yojana
      'ladli-bahna-2026':            'women+empowerment+india',
      'ladli-behna':                 'women+india+scheme',
      'pm-kisan-2026':               'farmer+india+agriculture',
      'pm-kisan':                    'farmer+india+crop',
      'ayushman-2026':               'health+hospital+india',
      'pm-ujjwala-2026':             'lpg+gas+cylinder+india',
      'ration-card-2026':            'food+grains+india+ration',
      'pm-svanidhi-2026':            'street+vendor+india+market',
      'vahan-rc-2026':               'vehicle+registration+india',
    };

    function getJobImage(j) {
      var kw = imageKeywords[j.id] || getCategoryKeyword(j.category, j.title);
      var imgUrl = 'https://source.unsplash.com/800x300/?' + kw;
      return \`<div class="job-img-wrap">
        <img
          src="\${imgUrl}"
          alt="\${j.title}"
          loading="lazy"
          onerror="this.parentElement.innerHTML='<div class=\"job-img-placeholder\"><div class=\"ph-icon\">\${getCategoryEmoji(j.category)}</div><div class=\"ph-text\">\${j.category}</div></div>'"
        />
        <div class="job-img-overlay">
          <div class="job-img-title">\${j.title}</div>
          <div class="job-img-cat">\${j.category} &nbsp;|&nbsp; \${j.lastUpdate}</div>
        </div>
      </div>\`;
    }

    function getCategoryKeyword(category, title) {
      var t = (category + ' ' + title).toLowerCase();
      if (t.includes('army') || t.includes('defence') || t.includes('agniveer')) return 'indian+army+soldier';
      if (t.includes('navy')) return 'indian+navy+warship';
      if (t.includes('police') || t.includes('constable')) return 'police+india+uniform';
      if (t.includes('railway') || t.includes('rrb')) return 'indian+railway+train';
      if (t.includes('teacher') || t.includes('reet') || t.includes('tgt')) return 'teacher+classroom+india';
      if (t.includes('engineer') || t.includes('je ')) return 'engineer+construction+india';
      if (t.includes('forest') || t.includes('guard')) return 'forest+india+nature+green';
      if (t.includes('medical') || t.includes('neet') || t.includes('paramedical')) return 'hospital+medical+india';
      if (t.includes('result') || t.includes('board')) return 'exam+students+india';
      if (t.includes('farmer') || t.includes('kisan')) return 'farmer+agriculture+india';
      if (t.includes('women') || t.includes('mahila') || t.includes('behna')) return 'women+india+empowerment';
      if (t.includes('scholarship') || t.includes('beti')) return 'girl+student+scholarship+india';
      if (t.includes('admit') || t.includes('city')) return 'examination+hall+india';
      if (t.includes('scheme') || t.includes('yojana')) return 'government+scheme+india';
      return 'government+india+sarkari';
    }

    function getCategoryEmoji(cat) {
      var c = (cat||'').toLowerCase();
      if (c.includes('defence')) return '🪖';
      if (c.includes('railway')) return '🚂';
      if (c.includes('teacher')) return '📖';
      if (c.includes('result')) return '📋';
      if (c.includes('admit')) return '🎫';
      if (c.includes('police')) return '👮';
      if (c.includes('scheme') || c.includes('yojana')) return '🏛️';
      return '📢';
    }
    // ───────────────────────────────────────────────────────

    function renderJob(j) {
      // Unique title per job
      const pageTitle = j.title + ' 2026 – ' + j.category + ' | Sarthak Yojana';
      const pageDesc  = j.description ? j.description.substring(0, 155) : j.title + ' – Eligibility, Dates, Apply Online at SarthakYojana.in';
      const pageUrl   = 'https://sarthakyojana.in/pages/job-detail.html?id=' + j.id;

      document.title = pageTitle;
      document.getElementById('pageTitle').textContent   = pageTitle;
      document.getElementById('pageDesc').setAttribute('content', pageDesc);

      // Canonical — most important for duplicate fix
      document.getElementById('canonicalTag').setAttribute('href', pageUrl);

      // Open Graph
      document.getElementById('ogTitle').setAttribute('content', pageTitle);
      document.getElementById('ogDesc').setAttribute('content', pageDesc);
      document.getElementById('ogUrl').setAttribute('content', pageUrl);

      // JSON-LD Structured Data — Google Search Console fix (all required fields)
      const schema = {
        "@context": "https://schema.org",
        "@type": "JobPosting",
        "title": j.title,
        "description": pageDesc,
        "datePosted": j.lastUpdate,
        "validThrough": (j.highlights?.applyDate ? (function(d){ try{ var p=d.split(' '); var months={'Jan':'01','Feb':'02','Mar':'03','Apr':'04','May':'05','Jun':'06','Jul':'07','Aug':'08','Sep':'09','Oct':'10','Nov':'11','Dec':'12'}; return '2026-'+(months[p[1]]||'12')+'-'+(p[0].padStart(2,'0'))+'T23:59:59'; } catch(e){ return '2026-12-31T23:59:59'; } })(j.highlights.applyDate) : '2026-12-31T23:59:59'),
        "employmentType": "FULL_TIME",
        "hiringOrganization": {
          "@type": "Organization",
          "name": j.highlights?.department || "Government of India",
          "sameAs": "https://india.gov.in",
          "logo": "https://sarthakyojana.in/assets/images/logo.png"
        },
        "jobLocation": {
          "@type": "Place",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": j.highlights?.domicile || "All India",
            "addressLocality": "New Delhi",
            "addressRegion": "Delhi",
            "postalCode": "110001",
            "addressCountry": "IN"
          }
        },
        "baseSalary": {
          "@type": "MonetaryAmount",
          "currency": "INR",
          "value": {
            "@type": "QuantitativeValue",
            "minValue": 18000,
            "maxValue": 100000,
            "unitText": "MONTH"
          }
        },
        "applicantLocationRequirements": {
          "@type": "Country",
          "name": "India"
        },
        "directApply": true,
        "url": pageUrl
      };
      let schemaTag = document.getElementById('jobSchema');
      if (!schemaTag) { schemaTag = document.createElement('script'); schemaTag.id = 'jobSchema'; schemaTag.type = 'application/ld+json'; document.head.appendChild(schemaTag); }
      schemaTag.textContent = JSON.stringify(schema);

      // FAQ Schema — Google "People also ask" ke liye
      if (j.faq && j.faq.length > 0) {
        const faqSchema = {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": j.faq.map(f => ({
            "@type": "Question",
            "name": f.q,
            "acceptedAnswer": { "@type": "Answer", "text": f.a }
          }))
        };
        let faqTag = document.getElementById('faqSchema');
        if (!faqTag) { faqTag = document.createElement('script'); faqTag.id = 'faqSchema'; faqTag.type = 'application/ld+json'; document.head.appendChild(faqTag); }
        faqTag.textContent = JSON.stringify(faqSchema);
      }

      document.getElementById('breadCat').textContent = j.category;
      document.getElementById('breadTitle').textContent = j.title.substring(0,40) + '...';

      // Build Important Dates rows
      const dateRows = j.importantDates.map(d => `
        <tr>
          <td>${d.label}</td>
          <td class="${d.highlight ? 'highlight-date' : ''}">${d.value}</td>
        </tr>`).join('');

      // Build Fees
      const feesHTML = j.fees.map(f => `<div class="fees-item">${f}</div>`).join('');

      // Build Documents
      const docsHTML = j.documents.map(d => `<div class="doc-item">${d}</div>`).join('');

      // Build Eligibility Table
      let eligHTML = '';
      if (j.eligibility && j.eligibility.length > 0) {
        eligHTML = `
          <div class="d-card">
            <div class="d-card-head">✅ Eligibility Criteria / पात्रता शर्तें</div>
            <div class="d-card-body" style="overflow-x:auto;">
              <table class="elig-table">
                <thead><tr><th>Class</th><th>Age Eligibility</th><th>Category</th><th>Residence</th></tr></thead>
                <tbody>${j.eligibility.map(e => `<tr><td><b>${e.class}</b></td><td>${e.age}</td><td>${e.category}</td><td>${e.residence}</td></tr>`).join('')}</tbody>
              </table>
            </div>
          </div>`;
      }

      // Build How to Apply — Accordion style
      const stepsHTML = j.howToApply.map((s,i) => {
        const title  = typeof s === 'object' ? s.title  : s;
        const detail = typeof s === 'object' ? s.detail : '';
        return `
        <div class="step-item" id="step-${i}">
          <div class="step-header" onclick="toggleStep(${i})">
            <div class="step-num">${i+1}</div>
            <span class="step-title">${title}</span>
            <span class="step-plus">+</span>
          </div>
          ${detail ? `<div class="step-body">${detail}</div>` : ''}
        </div>`;
      }).join('');

      // Build Important Links
      const linksHTML = j.importantLinks.map(l => `
        <tr>
          <td>${l.label}</td>
          <td><a href="${l.url}" target="_blank" style="color:#1a56db;font-weight:500;">${l.text}</a></td>
        </tr>`).join('');

      // Build Keywords
      const kwHTML = j.keywords.map(k => `<span class="keyword-tag">${k}</span>`).join('');

      // Build Highlights
      const hl = j.highlights;

      document.getElementById('mainWrap').innerHTML = `
        <div class="detail-main">

          <!-- JOB IMAGE BANNER -->
          ${getJobImage(j)}

          <!-- TITLE -->
          <div class="title-box">
            <span class="cat-badge">${j.category}</span>
            <h1 style="margin-top:8px;">${j.title}</h1>
            <div class="title-meta">
              <span>🕐 Last Update: ${j.lastUpdate}</span>
            </div>
            <p style="font-size:13px;color:#374151;line-height:1.8;margin-top:10px;">${j.description}</p>
            ${j.notification ? `<div class="notif-box">📢 Notification: ${j.notification}</div>` : ''}
          </div>

          <!-- IMPORTANT DATES + FEES -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div class="d-card">
              <div class="d-card-head">📅 Important Dates / महत्वपूर्ण तिथि</div>
              <div class="d-card-body" style="padding:0;">
                <table>${dateRows}</table>
              </div>
            </div>
            <div class="d-card">
              <div class="d-card-head">💰 Application Fee / आवेदन शुल्क</div>
              <div class="d-card-body">${feesHTML}</div>
            </div>
          </div>

          <!-- AD SLOT -->
          <div id="midAdSlot" style="background:white;border-radius:8px;border:1px dashed #cbd5e1;padding:6px;text-align:center;">
            <div style="font-size:10px;color:#94a3b8;margin-bottom:4px;">« Advertisement »</div>
          </div>

          <!-- ELIGIBILITY -->
          ${eligHTML}

          <!-- DOCUMENTS -->
          <div class="d-card">
            <div class="d-card-head">📋 Required Documents / आवश्यक दस्तावेज</div>
            <div class="d-card-body">
              <div class="docs-list">${docsHTML}</div>
            </div>
          </div>

          <!-- HOW TO APPLY -->
          <div class="d-card">
            <div class="d-card-head">🔢 How to Apply / आवेदन प्रक्रिया</div>
            <div class="d-card-body">
              <div class="steps-list">${stepsHTML}</div>
            </div>
          </div>

          <!-- IMPORTANT LINKS -->
          <div class="d-card">
            <div class="d-card-head">🔗 Important Links / महत्वपूर्ण लिंक</div>
            <div class="d-card-body" style="padding:0;">
              <table>
                <thead><tr><th>Description</th><th>Link</th></tr></thead>
                <tbody>${linksHTML}</tbody>
              </table>
            </div>
          </div>

          <!-- HIGHLIGHTS -->
          <div class="highlight-box">
            <h3>⭐ Highlight | Short Details | #${j.id.toUpperCase().replace(/-/g,'')}</h3>
            <table class="hl-table">
              <tr><td>📌 Post Name</td><td>${hl.postName}</td></tr>
              <tr><td>🗺️ Domicile</td><td>${hl.domicile}</td></tr>
              <tr><td>🎂 Age Limit</td><td>${hl.ageLimit}</td></tr>
              <tr><td>📅 Apply Date</td><td>${hl.applyDate}</td></tr>
              <tr><td>📄 Documents</td><td>${hl.documents}</td></tr>
              <tr><td>🏛️ Department</td><td>${hl.department}</td></tr>
            </table>
          </div>

          <!-- SHARE BUTTONS -->
          <div>
            <div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:8px;">Share This Post:</div>
            <div class="share-btns">
              <a class="share-btn btn-wa"   href="https://wa.me/?text=${encodeURIComponent(j.title + ' – ' + window.location.href)}" target="_blank">💬 Join WhatsApp</a>
              <a class="share-btn btn-tg"   href="https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(j.title)}" target="_blank">📨 Join Telegram</a>
              <button class="share-btn btn-copy" onclick="navigator.clipboard.writeText(window.location.href);alert('Link copy ho gaya!')">🔗 Copy Link</button>
              <a class="share-btn btn-home" href="../index.html">🏠 Back to Home</a>
            </div>
          </div>

          <!-- FAQ SECTION -->
          ${j.faq && j.faq.length > 0 ? `
          <div class="d-card">
            <div class="d-card-head">❓ Frequently Asked Questions / अक्सर पूछे जाने वाले सवाल</div>
            <div class="d-card-body" style="padding:0;">
              ${j.faq.map((f,i) => `
              <div class="faq-item" id="faq-${i}" style="border-bottom:1px solid #f1f5f9;">
                <div class="faq-q" onclick="toggleFaq(${i})" style="display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;font-size:13px;font-weight:600;color:#1e293b;">
                  <span style="color:#1a56db;font-size:16px;flex-shrink:0;">Q</span>
                  <span style="flex:1;">${f.q}</span>
                  <span class="faq-plus" style="color:#1a56db;font-size:18px;font-weight:300;flex-shrink:0;transition:transform .2s;">+</span>
                </div>
                <div class="faq-a" style="display:none;padding:0 16px 12px 42px;font-size:13px;color:#374151;line-height:1.7;background:#f8fafc;">
                  <span style="color:#16a34a;font-weight:600;">A:</span> ${f.a}
                </div>
              </div>`).join('')}
            </div>
          </div>` : ''}

          <!-- KEYWORDS -->
          <div>
            <div style="font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">Related Keywords:</div>
            <div class="keywords-wrap">${kwHTML}</div>
          </div>

        </div>

        <!-- SIDEBAR -->
        <div class="detail-sidebar">

          <div id="sideAdSlot" style="background:white;border-radius:8px;border:1px dashed #cbd5e1;padding:6px;text-align:center;">
            <div style="font-size:10px;color:#94a3b8;margin-bottom:4px;">« Advertisement »</div>
          </div>

          <div class="sb-box">
            <div class="sb-head2">📌 Recommended Post</div>
            <div id="recommendedPosts"></div>
            <div style="padding:6px 12px;"><a href="../index.html" style="font-size:11px;color:#1a56db;">More &gt;&gt;</a></div>
          </div>

        </div>`;

      // Load recommended posts
      var others = JOBS_DATA.filter(function(x){ return x.id !== j.id; }).slice(0,5);
      document.getElementById('recommendedPosts').innerHTML = others.map(function(o){
        return '<div class="sb-item"><a href="job-detail.html?id='+o.id+'">'+o.title+'</a><div class="sb-date2">📅 '+o.lastUpdate+'</div></div>';
      }).join('');

      // Inject AdSense ads after innerHTML is set (script tags can't be in innerHTML)
      var midAd = document.getElementById('midAdSlot');
      if (midAd) {
        var ins1 = document.createElement('ins');
        ins1.className = 'adsbygoogle';
        ins1.style.cssText = 'display:block;width:100%;min-height:80px;';
        ins1.setAttribute('data-ad-client', 'ca-pub-8602963796651751');
        ins1.setAttribute('data-ad-slot', 'YOUR_AD_SLOT_JOB_1');
        ins1.setAttribute('data-ad-format', 'horizontal');
        ins1.setAttribute('data-full-width-responsive', 'true');
        midAd.appendChild(ins1);
        try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
      }

      var sideAd = document.getElementById('sideAdSlot');
      if (sideAd) {
        var ins2 = document.createElement('ins');
        ins2.className = 'adsbygoogle';
        ins2.style.cssText = 'display:block;width:300px;height:250px;';
        ins2.setAttribute('data-ad-client', 'ca-pub-8602963796651751');
        ins2.setAttribute('data-ad-slot', 'YOUR_AD_SLOT_JOB_2');
        ins2.setAttribute('data-ad-format', 'rectangle');
        sideAd.appendChild(ins2);
        try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
      }
    }
  </script>


  <script>
    // Auto date update
    (function(){
      var days = ['रविवार','सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
      var months = ['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
      var d = new Date();
      var dateStr = days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
      var els = document.querySelectorAll('.auto-date');
      els.forEach(function(el){ el.textContent = '📅 ' + dateStr; });
    })();
  </script>
</body>
</html>
