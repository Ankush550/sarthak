<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="pageTitle">Job Detail – Sarthak Yojana</title>
<meta name="description" id="pageDesc" content="Sarthak Yojana – Sarkari Job Details">

<link rel="canonical" id="canonicalTag" href="https://sarthakyojana.in/pages/job-detail.html">

<!-- Adsense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8602963796651751" crossorigin="anonymous"></script>

</head>

<body>

<div id="mainWrap">Loading...</div>

<script>

function renderJob(j) {

  const pageTitle = j.title + ' 2026 – ' + j.category + ' | Sarthak Yojana';
  const pageDesc  = j.description ? j.description.substring(0, 155) : j.title;
  const pageUrl   = 'https://sarthakyojana.in/pages/job-detail.html?id=' + j.id;

  document.title = pageTitle;
  document.getElementById('pageTitle').textContent = pageTitle;
  document.getElementById('pageDesc').setAttribute('content', pageDesc);
  document.getElementById('canonicalTag').setAttribute('href', pageUrl);

  // ✅ FIXED SCHEMA (NO OPTIONAL CHAINING)
  const schema = {
    "@context": "https://schema.org",
    "@type": "JobPosting",
    "title": j.title,
    "description": pageDesc,

    "datePosted": "2026-03-28",

    "validThrough": "2026-12-31T23:59:59",

    "employmentType": "FULL_TIME",

    "hiringOrganization": {
      "@type": "Organization",
      "name": (j.highlights && j.highlights.department) || "Government of India"
    },

    "jobLocation": {
      "@type": "Place",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": (j.highlights && j.highlights.domicile) || "All India"
      }
    }
  };

  let tag = document.getElementById('jobSchema');
  if (!tag) {
    tag = document.createElement('script');
    tag.id = 'jobSchema';
    tag.type = 'application/ld+json';
    document.head.appendChild(tag);
  }
  tag.textContent = JSON.stringify(schema);

  // ✅ FIXED
  const hl = j.highlights || {};

  document.getElementById('mainWrap').innerHTML = `
    <h1>${j.title}</h1>
    <p>${j.description}</p>

    <h3>Highlights</h3>
    <ul>
      <li>${hl.postName || ''}</li>
      <li>${hl.domicile || ''}</li>
      <li>${hl.ageLimit || ''}</li>
      <li>${hl.applyDate || ''}</li>
      <li>${hl.department || ''}</li>
    </ul>
  `;
}

</script>

</body>
</html>
