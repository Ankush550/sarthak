<script>

renderCookieConsent();

const params = new URLSearchParams(window.location.search);
const type = params.get('type'); // result | admit | answer
const id   = params.get('id');
if (!type || !id) { window.location.replace('results.html'); }

// FIX: build a clean canonical from type+id only — do NOT use window.location.href,
// which was picking up tracking params (utm_*, fbclid, gclid, ref, etc.) and
// producing a different canonical URL per share-link. That mismatch between the
// canonical Google discovers and the one we declare is what causes "Duplicate,
// Google chose different canonical than user" in Search Console.
document.getElementById('canonicalTag').href =
  'https://sarthakyojana.in/pages/item-detail.html?type=' + encodeURIComponent(type || '') + '&id=' + encodeURIComponent(id || '');

const ALL = {
  result: typeof RESULTS_DATA !== 'undefined' ? RESULTS_DATA : [],
  admit: typeof ADMIT_CARDS_DATA !== 'undefined' ? ADMIT_CARDS_DATA : [],
  answer: typeof ANSWER_KEYS_DATA !== 'undefined' ? ANSWER_KEYS_DATA : []
};

const TYPE_LABELS = {
  result: { label:'Result', color:'#c0392b', icon:'📊', viewAll:'results.html', dlLabel:'Check Result', sec:'All Results 2026' },
  admit:  { label:'Admit Card', color:'#1a5276', icon:'🪪', viewAll:'results.html#admit', dlLabel:'Download Admit Card', sec:'All Admit Cards 2026' },
  answer: { label:'Answer Key', color:'#1a7a3a', icon:'🗝️', viewAll:'results.html#answer', dlLabel:'Download Answer Key', sec:'All Answer Keys 2026' }
};

const dataset = ALL[type];
const meta = TYPE_LABELS[type];

renderHeader(meta ? meta.label : '');
renderTicker();

if (!dataset || !meta) {
  document.getElementById('mainContent').innerHTML = '<h1 style="font-size:20px;color:#1a237e;">Page Not Found</h1><p style="padding:10px 0 30px;text-align:center;color:#c0392b;">Invalid page request. <a href="../index.html">Go Home</a></p>';
  var adWrap0 = document.getElementById('adBannerWrap');
  if (adWrap0) adWrap0.style.display = 'none';
} else {
  const item = dataset.find(x => x.id === id);

  if (!item) {
    document.getElementById('mainContent').innerHTML = '<h1 style="font-size:20px;color:#1a237e;">Item Not Found</h1><p style="padding:10px 0 30px;text-align:center;color:#c0392b;">Sorry, we could not find this item. It may have been moved or the link is incorrect. <a href="results.html">Browse All</a></p>';
  var adWrap1 = document.getElementById('adBannerWrap');
  if (adWrap1) adWrap1.style.display = 'none';
  // Page already defaults to noindex,follow in <head> — nothing more to do here.
  document.getElementById('canonicalTag').href = 'https://sarthakyojana.in/pages/results.html';
  } else {
    // Valid item confirmed — safe to index now (default meta above is noindex).
    let robotsTag = document.querySelector('meta[name="robots"]');
    if (!robotsTag) {
      robotsTag = document.createElement('meta');
      robotsTag.name = 'robots';
      document.head.appendChild(robotsTag);
    }
    robotsTag.content = 'index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1';

    // ── ENTERPRISE SEO — Article schema + breadcrumbs + OG/Twitter ──
    const schemaType = type === 'admit' ? 'Admit Card' : type === 'answer' ? 'Answer Key' : 'Exam Result';
    applySEO({
      title:       item.title + ' | SarthakYojana.in',
      description: item.description || item.title + ' – Download from official website. Check complete details on SarthakYojana.in',
      keywords:    item.title + ', ' + (item.organization || '') + ', ' + schemaType + ' 2026, Sarkari Result',
      path:        'pages/item-detail.html?type=' + type + '&id=' + item.id,
      type:        'Article',
      datePublished: item.declaredDate || item.date,
      image:       item.image ? ('assets/images/' + item.image) : undefined,
      breadcrumbs: [
        { name: 'Home', path: '' },
        { name: meta.sec, path: 'pages/results.html' },
        { name: item.title, path: 'pages/item-detail.html?type=' + type + '&id=' + item.id }
      ]
    });
    document.getElementById('bc').innerHTML = `<a href="../index.html">Home</a> &rsaquo; <a href="results.html">${meta.sec}</a> &rsaquo; ${item.title}`;

    // Build rows
    const rows = [];
    rows.push(['Organization', item.organization || '—']);
    if (item.postName) rows.push([meta.label + ' For', item.postName]);
    rows.push([meta.label + ' Date', item.declaredDate || item.date || '—']);
    if (item.examDate)         rows.push(['Exam Date', item.examDate]);
    if (item.objectionDeadline) rows.push(['Objection Last Date', `<strong style="color:#c0392b;">${item.objectionDeadline}</strong>`]);

    // How-to steps
    const rawSteps = item.howToCheck || item.howToDownload || '';
    const steps = rawSteps.split('→').map(s => s.trim()).filter(Boolean);
 let articleContent = '';

if(type === 'admit'){
    articleContent =
    (typeof ADMIT_CARD_CONTENT !== 'undefined' &&
    ADMIT_CARD_CONTENT[item.id])
    ? ADMIT_CARD_CONTENT[item.id]
    : '<h2 style="color:red">Content Not Found</h2>';
}
else if(type === 'result'){
    articleContent =
    (typeof RESULT_CONTENT !== 'undefined' &&
    RESULT_CONTENT[item.id])
    ? RESULT_CONTENT[item.id]
    : '<h2 style="color:red">Content Not Found</h2>';
}
else if(type === 'answer'){
    articleContent =
    (typeof ANSWER_KEY_CONTENT !== 'undefined' &&
    ANSWER_KEY_CONTENT[item.id])
    ? ANSWER_KEY_CONTENT[item.id]
    : '<h2 style="color:red">Content Not Found</h2>';
}

    // Build content
    document.getElementById('mainContent').innerHTML = `

<div class="article-container">

<h1>${item.title}</h1>

<img src="../assets/images/${item.image}" 
alt="${item.title}" 
style="width:100%;border-radius:10px;margin-bottom:20px;">

<div class="download-box">
</div>

${articleContent}

</div>

`;
    


   

    // Related items
    const related = dataset.filter(x => x.id !== id).slice(0, 8);
    document.getElementById('relatedTitle').textContent = 'More ' + meta.sec;
    document.getElementById('viewAllLink').href = meta.viewAll;
    document.getElementById('relatedList').innerHTML = related.map(r =>
      `<li><a href="item-detail.html?type=${type}&id=${r.id}">${r.title}${r.isNew ? '<span class="new-tag">NEW</span>' : ''}</a></li>`
    ).join('');
  }
}

renderFooter();
</script>
