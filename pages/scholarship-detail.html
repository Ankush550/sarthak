/* ============================================================
   QUICK INFO CARD — sd-box (green/gold scholarship theme)
   ============================================================ */
.sd-box {
  background: #fff;
  border: 0.5px solid #d9e6da;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 14px;
  box-shadow: 0 2px 10px rgba(27,94,32,0.08);
}
.sd-title-bar {
  background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
  padding: 14px 18px;
}
.sd-title-bar h1 {
  color: #fff;
  font-size: 20.5px;
  font-weight: 700;
  line-height: 1.45;
  margin: 0;
}
.sd-meta { width: 100%; border-collapse: collapse; }
.sd-meta tr { border-bottom: 0.5px solid #f0f4f0; transition: background 0.15s; }
.sd-meta tr:last-child { border-bottom: none; }
.sd-meta tr:hover { background: #f4fbf4; }
.sd-meta td:first-child {
  width: 38%; padding: 9px 16px; font-size: 14.5px; color: #1b5e20;
  font-weight: 800; background: #f4faf4; border-right: .5px solid #eef4ee; vertical-align: middle;
}
.sd-meta td:last-child { padding: 9px 16px; font-size: 13.5px; color: #101018; vertical-align: middle; }

.badge-new { display:inline-block;background:#e53935;color:#fff;font-size:11px;font-weight:800;padding:3px 12px;border-radius:20px;letter-spacing:.2px; }
.badge-corporate { display:inline-block;background:#fff8e1;color:#8d6e00;font-size:11px;font-weight:800;padding:3px 12px;border-radius:20px;border:1px solid #ffe082;letter-spacing:.2px; }

/* Article wrapper reuses the site's .content-article / .detail-table rules
   from common-content.css; only the accent colours are overridden below
   to keep the green scholarship theme consistent. */
.content-article h2 { color:#1b5e20; background:#f0faf0; border-left:4px solid #2e7d32; }
.content-article h3 { color:#2e7d32; border-left:3px solid #a5d6a7; }
.detail-table thead tr { background:linear-gradient(90deg,#1b5e20 0%,#2e7d32 100%); }
.detail-table tbody tr:nth-child(even) { background:#f6faf6; }
.detail-table tbody tr:hover { background:#eaf6ea; }

.apply-box { background:#fff;border:1px solid #d9e6da;border-radius:12px;padding:18px 20px;margin-bottom:12px;box-shadow:0 1px 6px rgba(27,94,32,0.05); text-align:center; }
.apply-btn-main {
  display:inline-block;background:linear-gradient(135deg,#2e7d32 0%,#1b5e20 100%);color:#fff;
  padding:14px 38px;border-radius:6px;font-size:15px;font-weight:800;text-decoration:none;
  box-shadow:0 3px 10px rgba(27,94,32,0.3);letter-spacing:.2px;
}
.apply-btn-main:hover { background:linear-gradient(135deg,#1b5e20 0%,#154a18 100%); color:#fff; text-decoration:none; }
</style>

<body>
<div id="site-header"></div>
<div id="ticker-wrap"></div>
<div class="breadcrumb"><div class="breadcrumb-inner" id="bc"><a href="../index.html">Home</a> &rsaquo; Scholarship Detail</div></div>

<div class="center">
  <div class="job-banner" id="bannerWrap" style="display:none;">
    <img id="scholBannerImage"
         src=""
         alt="Scholarship Banner"
         style="width:100%;height:auto;display:block;">
  </div>
  <!-- Quick Info Card -->
  <div id="quickCard"></div>

  <!-- Advertisements -->
  <div class="ad-banner-wrap" id="adBannerWrap">
    <span class="ad-banner-label">Advertisements</span>
    <div class="ad-banner">
      <ins class="adsbygoogle"
           style="display:block;width:100%;min-height:90px;"
           data-ad-client="ca-pub-8602963796651751"
           data-ad-slot="1013901637"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>

  <!-- Full Article Content -->
  <div class="content-article" id="fullContent"></div>

  <!-- Ad Banner Middle -->
  <div class="ad-banner-wrap">
    <span class="ad-banner-label">Advertisements</span>
    <div class="ad-banner">
      <ins class="adsbygoogle"
           style="display:block;width:100%;min-height:90px;"
           data-ad-client="ca-pub-8602963796651751"
           data-ad-slot="1013901637"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>

  <!-- Apply Box -->
  <div class="apply-box" id="applyBox" style="display:none;">
    <h3 id="applyTitle" style="color:#1b5e20;margin:0 0 8px;">Apply Now</h3>
    <p id="applyMeta" style="font-size:12px;color:#666;margin-bottom:14px;"></p>
    <div id="applyLinks"></div>
    <p style="font-size:11.5px;color:#888;margin-top:14px;">Disclaimer: SarthakYojana.in is not affiliated with the scholarship provider. Always verify all details from the official website before applying.</p>
  </div>

  <!-- Similar Scholarships -->
  <div class="sec-box" style="margin-top:10px;">
    <div class="sec-hdr"><h2>More Scholarships 2026</h2></div>
    <ul class="sec-list" id="similarScholarships"></ul>
    <a href="scholarships.html" class="view-more">View All Scholarships &raquo;</a>
  </div>

</div>

<div id="site-footer"></div>

<script src="../assets/js/scholarship-content.js"></script>
<script src="../assets/js/scholarships-data.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/sidebar-widgets.js"></script>
<script>
renderHeader('Scholarship');
renderTicker();
renderFooter();
renderCookieConsent();

const id = new URLSearchParams(window.location.search).get('id') || '';
if (!id) { window.location.replace('scholarships.html'); }
document.getElementById('canonicalTag').href = 'https://sarthakyojana.in/pages/scholarship-detail.html?id=' + id;

const sch = (typeof SCHOLARSHIPS_DATA !== 'undefined' ? SCHOLARSHIPS_DATA : []).find(s => s.id === id);

if (!sch) {
  document.getElementById('quickCard').innerHTML = '<div class="content-article"><h1 style="font-size:20px;color:#1b5e20;">Scholarship Not Found</h1><p style="text-align:center;color:#c0392b;padding:20px;">Sorry, we could not find this scholarship. It may have been moved or the link is incorrect. <a href="scholarships.html">Browse All Scholarships</a></p></div>';
  var adWrap = document.getElementById('adBannerWrap');
  if (adWrap) adWrap.style.display = 'none';
  // Invalid/missing scholarship ID — explicitly mark this specific page as
  // noindex. (Default in <head> is now "index, follow" since almost all
  // requests have a valid ?id=; we only override it in this rare case.)
  let notFoundRobotsTag = document.querySelector('meta[name="robots"]');
  if (!notFoundRobotsTag) {
    notFoundRobotsTag = document.createElement('meta');
    notFoundRobotsTag.name = 'robots';
    document.head.appendChild(notFoundRobotsTag);
  }
  notFoundRobotsTag.content = 'noindex, follow';
  document.getElementById('canonicalTag').href = 'https://sarthakyojana.in/pages/scholarships.html';
} else {
  document.getElementById('bc').innerHTML = `<a href="../index.html">Home</a> &rsaquo; <a href="scholarships.html">Scholarships</a> &rsaquo; ${sch.title}`;

  // Banner image (if provided in data)
  if (sch.image) {
    const bannerWrap = document.getElementById('bannerWrap');
    const bannerImg = document.getElementById('scholBannerImage');
    bannerImg.src = '../assets/images/' + sch.image;
    bannerImg.alt = sch.title;
    bannerWrap.style.display = 'block';
  }

  // Valid scholarship confirmed — page is already index,follow by default (see <head>).

  // ── SEO — breadcrumbs + OG/Twitter ──
  applySEO({
    title:       sch.title + ' – ' + sch.provider + ' | Eligibility, Amount & Apply | SarthakYojana.in',
    description: (sch.shortDescription || sch.title) + ' Check eligibility, amount, documents and apply online at SarthakYojana.in.',
    keywords:    sch.title + ', ' + sch.provider + ', scholarship 2026, sarkari scholarship 2026, student scholarship',
    path:        'pages/scholarship-detail.html?id=' + sch.id,
    type:        'Article',
    breadcrumbs: [
      { name: 'Home', path: '' },
      { name: 'Scholarship 2026', path: 'pages/scholarships.html' },
      { name: sch.title, path: 'pages/scholarship-detail.html?id=' + sch.id }
    ]
  });

  // Quick info card
  document.getElementById('quickCard').innerHTML = `
    <div class="sd-box">
      <div class="sd-title-bar">
        <h1>${sch.title}</h1>
      </div>
      <div class="sd-body">
        <table class="sd-meta">
          <tr><td>Provider</td><td><strong>${sch.provider||'—'}</strong>
            ${sch.isNew ? ' <span class="badge-new">NEW</span>' : ''}
            <span class="badge-corporate">${sch.type||'Corporate'}</span>
          </td></tr>
          <tr><td>Beneficiaries</td><td>${sch.beneficiaries||'—'}</td></tr>
          <tr><td>Amount</td><td><strong style="color:#1b5e20;">${sch.amount||'—'}</strong></td></tr>
          <tr><td>Application Mode</td><td>${sch.applicationMode||'—'}</td></tr>
          <tr><td>Application Start</td><td>${sch.startDate||'—'}</td></tr>
          <tr><td>Last Date to Apply</td><td><strong style="color:#c0392b;">${sch.lastDate||'—'}</strong></td></tr>
          ${sch.officialLink ? `<tr><td>Official Website</td><td><a href="${sch.officialLink}" target="_blank" rel="nofollow noopener" style="color:#1b5e20;font-weight:600;">${sch.officialLink}</a></td></tr>` : ''}
        </table>
      </div>
    </div>`;

  // Full article content from SCHOLARSHIP_CONTENT
  const articleContent = (typeof SCHOLARSHIP_CONTENT !== 'undefined') ? SCHOLARSHIP_CONTENT[id] : null;
  if (articleContent) {
    document.getElementById('fullContent').innerHTML = articleContent;
  } else {
    document.getElementById('fullContent').innerHTML = `
      <h2>About ${sch.title}</h2>
      <p>${sch.shortDescription || (sch.provider + ' offers this scholarship to eligible students. Check the official website for full details and the application process.')}</p>`;
  }

  // Apply box — big prominent button
  const applyBox = document.getElementById('applyBox');
  applyBox.style.display = 'block';
  document.getElementById('applyTitle').textContent = 'Apply – ' + sch.title;
  document.getElementById('applyMeta').innerHTML = 'Last Date: <strong style="color:#c0392b;">' + (sch.lastDate || 'Check Official Site') + '</strong>';
  document.getElementById('applyLinks').innerHTML = sch.applyLink
    ? `<a href="${sch.applyLink}" class="apply-btn-main" target="_blank" rel="nofollow noopener">Apply Now &rarr;</a>`
    : sch.officialLink
      ? `<a href="${sch.officialLink}" class="apply-btn-main" target="_blank" rel="nofollow noopener">Visit Official Website &rarr;</a>`
      : '<p style="color:#888;font-size:12.5px;">Application link will be available soon. Bookmark this page.</p>';

  // Similar scholarships
  const sim = SCHOLARSHIPS_DATA.filter(s => s.id !== id).slice(0, 10);
  document.getElementById('similarScholarships').innerHTML = sim.map(s =>
    `<li><a href="scholarship-detail.html?id=${s.id}">${s.title} – ${s.provider}</a></li>`
  ).join('');
}
</script>
</body>
</html>
