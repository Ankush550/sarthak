<script>
applySEO({
  title:       "Search Sarkari Naukri 2026 – Find Govt Jobs | SarthakYojana.in",
  description: "Search government jobs, results, admit cards and schemes on SarthakYojana.in. Find Sarkari Naukri by organization, post name, or qualification.",
  keywords:    "search sarkari naukri, search govt jobs, sarkari job search 2026",
  path:        "pages/search.html",
  type:        "WebPage",
  noindex:     true,
  breadcrumbs: [
    { name: "Home", path: "" },

  ]
});
</script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const can = document.createElement('link');
  can.rel='canonical'; can.href=window.location.href;
  document.head.appendChild(can);
});
</script>
<script>document.write('<link rel="canonical" href="https://sarthakyojana.in/pages/search.html">');</script>
  <!-- Google Analytics GA4 – G-HG8H9C38KD -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HG8H9C38KD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HG8H9C38KD', {

    });

  </head>
<body>
<div id="site-header"></div>
<div id="ticker-wrap"></div>
<div class="search-hero">
  <h1>Search Sarkari Naukri 2026</h1>
  <div class="sh-form">
    <input type="text" id="searchInput" placeholder="Search jobs, results, schemes..." value="">
    <button onclick="doSearchPage()">Search</button>
  </div>
</div>
<div class="center">
  <div id="searchResults"></div>
  <div class="content-section">
    <h2>Search Tips</h2>
    <ul>
      <li>Search by organization name (e.g. "CRPF", "RBI", "Railway")</li>
      <li>Search by post name (e.g. "Constable", "Engineer", "Clerk")</li>
      <li>Search by qualification (e.g. "Graduate", "10th Pass")</li>
      <li>Use <a href="job-finder.html">Job Finder</a> for advanced filtering</li>
    </ul>
  </div>
</div>
<div id="site-footer"></div>
<script src="../assets/js/jobs-data.js"></script>
<script src="../assets/js/main.js"></script>
<script>
renderHeader('');
renderTicker();
renderFooter();
renderCookieConsent();

const q = new URLSearchParams(window.location.search).get('q') || '';
if (q) { document.getElementById('searchInput').value = q; document.title = q + ' – Search | SarthakYojana'; showResults(q); }

function doSearchPage() {
  const v = document.getElementById('searchInput').value.trim();
  if (v) { history.pushState({},'',' search.html?q='+encodeURIComponent(v)); showResults(v); }
}
document.getElementById('searchInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearchPage(); });

function showResults(q) {
  const res = doSearch(q);
  const el = document.getElementById('searchResults');
  if (!res.length) { el.innerHTML = '<div class="sec-box"><div class="sec-hdr"><h2>Search Results for: '+q+'</h2></div><p style="padding:20px;text-align:center;color:#888;">No results found for "'+q+'". Try different keywords.</p></div>'; return; }
  el.innerHTML = `<div class="sec-box"><div class="sec-hdr"><h2>Search Results for: ${q} (${res.length} found)</h2></div>
    <table class="data-table"><thead><tr><th>#</th><th>Post</th><th>Organization</th><th>Last Date</th><th>Apply</th></tr></thead>
    <tbody>${res.map((j,i)=>`<tr><td>${i+1}</td><td><a href="job-detail.html?id=${j.id}" style="color:#c0392b;">${j.title}</a></td><td>${j.organization}</td><td>${j.lastDate||'—'}</td><td><a href="job-detail.html?id=${j.id}" class="apply-small">View</a></td></tr>`).join('')}</tbody></table></div>`;
}
</script>
</body>
</html>
