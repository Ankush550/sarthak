<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Private Jobs 2026 – Complete List | SarthakYojana</title>
<meta name="description" content="Full list of private sector jobs 2026. Filter by company, category, location and experience.">
<link rel="canonical" href="https://sarthakyojana.in/pages/private-jobs-list.html">
<link rel="stylesheet" href="../assets/style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=pub-8602963796651751" crossorigin="anonymous"></script>
</head>
<body>
<div id="site-header"></div>
<div id="ticker-wrap"></div>
<div class="breadcrumb"><div class="breadcrumb-inner"><a href="../index.html">Home</a> &rsaquo; <a href="private-jobs.html">Private Jobs</a> &rsaquo; All Jobs</div></div>
<div class="center">
  <div class="page-title-box"><h1>All Private Jobs 2026 – Complete List</h1></div>
  <div class="filter-bar">
    <select id="pvtCat" onchange="applyPvt()"><option value="">All Categories</option><option value="IT">IT/Software</option><option value="Banking">Banking</option><option value="Manufacturing">Manufacturing</option><option value="Healthcare">Healthcare</option></select>
    <input type="text" id="pvtKw" placeholder="Company / Post..." oninput="applyPvt()" style="width:180px;">
    <button onclick="resetPvt()">Reset</button>
  </div>
  <div class="sec-box">
    <div class="sec-hdr"><h2>Private Jobs List 2026</h2></div>
    <table class="data-table"><thead><tr><th>#</th><th>Company</th><th>Post</th><th>Category</th><th>Location</th><th>Experience</th><th>Last Date</th><th>Apply</th></tr></thead>
    <tbody id="pvtTbody"></tbody></table>
    <div id="pvtEmpty" style="display:none;padding:20px;text-align:center;color:#888;">No jobs found.</div>
  </div>
</div>
<div id="site-footer"></div>
<script src="../assets/jobs-data.js"></script>
<script src="../assets/main.js"></script>
<script>
renderHeader('Private Jobs');
renderTicker();
renderFooter();
renderCookieConsent();
function renderPvt(data){
  const tb=document.getElementById('pvtTbody'),em=document.getElementById('pvtEmpty');
  if(!data.length){tb.innerHTML='';em.style.display='block';return;}
  em.style.display='none';
  tb.innerHTML=data.map((j,i)=>`<tr><td>${i+1}</td><td><strong>${j.company}</strong></td><td>${j.title}</td><td>${j.category||'—'}</td><td>${j.location||'Multiple'}</td><td>${j.experience||'Any'}</td><td style="color:#c0392b;">${j.lastDate||'—'}</td><td><a href="${j.applyLink||'#'}" class="apply-small" target="_blank" rel="nofollow noopener">Apply</a></td></tr>`).join('');
}
function applyPvt(){
  const cat=document.getElementById('pvtCat').value.toLowerCase(),kw=document.getElementById('pvtKw').value.toLowerCase();
  renderPvt(PRIVATE_JOBS_DATA.filter(j=>{
    if(cat&&!(j.category||'').toLowerCase().includes(cat))return false;
    if(kw&&!j.title.toLowerCase().includes(kw)&&!j.company.toLowerCase().includes(kw))return false;
    return true;
  }));
}
function resetPvt(){document.getElementById('pvtCat').value='';document.getElementById('pvtKw').value='';renderPvt(PRIVATE_JOBS_DATA);}
const urlCat=new URLSearchParams(window.location.search).get('cat');
if(urlCat){document.getElementById('pvtCat').value=urlCat;applyPvt();}else renderPvt(PRIVATE_JOBS_DATA);
</script>
</body>
</html>
